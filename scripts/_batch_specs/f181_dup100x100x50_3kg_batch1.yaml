files:
  - file: реальные данные/изделия/энергетическая/asrg/часть_asrg_alternator/_index.md
    url: https://en.wikipedia.org/wiki/Advanced_Stirling_radioisotope_generator
    source_note: "Wikipedia ASRG — 130 We, 32 кг, 76×46×39 см; ResearchGate Chan/Wong — конвертор ASC класса 75 We ≈1.3 кг, линейный альтернатор движущегося магнита"
    material: smco
    dims: 130,130,120
    standards: "NASA/TM—2018-219944;NASA GRC ASRG EU Specs"
    desc: "Линейный альтернатор движущегося магнита токогенерирующей секции конвертора Стирлинга ASRG (референс: ASRG — 130 We от двух конверторов, 32 кг, 76×46×39 см; конвертор ASC класса 75 We ≈1.3 кг). Конструкция: аксиальный статор с медными катушками и якорь с постоянными магнитами SmCo на рабочем поршне; для радиоизотопных температур применяются самарий-кобальтовые магниты из-за высокой точки Кюри против NdFeB. Габарит секции ≈Ø130×120 мм (оценка от конвертора класса SRSC Ø127 мм)."
    principle: "Возвратно-поступательное движение поршня с якорем наводит ЭДС в катушках статора при прохождении магнитов SmCo мимо зубцов; однофазный переменный ток синхронной частоты хода (50–80 Гц) выпрямляется и подаётся в шину питания; ламинированный сердечник снижает вихревые потери, зазор между магнитом и статором минимизирует рассеяние потока."
  - file: реальные данные/изделия/энергетическая/asrg/часть_asrg_heater_head/_index.md
    url: https://ntrs.nasa.gov/api/citations/20160010442/downloads/20160010442.pdf
    source_note: "NASA NTRS 20160010442 (Wong et al., ASC Technology Maturation) — heater head из Inconel 718 на 650°C (конструкция ASC-0), новая генерация до 850°C"
    material: inconel_718
    dims: 130,130,90
    standards: "NASA NTRS 20160010442;AMS 5663 (Inconel 718)"
    desc: "Горячая головка свободнопоршневого конвертора Стирлинга из жаропрочного никелевого сплава Inconel 718 (референс NASA ASC: конструкция ASC-0 с горячим концом 650°C допускает IN718, целевая генерация ASC-E3 — до 850°C из высокотемпературной керамики (SiC)). Куполообразный горячий фланец принимает тепло от GPHS-модулей и образует полость расширения; габарит узла ≈Ø130×90 мм (оценка от конвертора класса SRSC Ø127 мм)."
    principle: "Тепловое излучение и проводимость от горячей пластины GPHS нагревают купол головки до 650°C; тепло испаряет рабочее тело (гелий) в полости расширения, создавая ход поршня; IN718 сохраняет предел ползучести и оксидную стойкость при циклическом нагреве, а тонкостенный купол минимизирует радиальный градиент температур."
  - file: реальные данные/изделия/энергетическая/mmrtg/часть_mmrtg_hot_side/_index.md
    url: https://www.nasa.gov/wp-content/uploads/2015/08/4_mars_2020_mmrtg.pdf
    source_note: "NASA Mars 2020 MMRTG Fact Sheet — масса 43.6 кг, длина 66.8 см, диаметр по финам 64.2 см, тепловая мощность 1975 Вт; стопка GPHS 8 модулей"
    material: inconel_625
    dims: 260,260,250
    standards: "NASA Mars 2020 MMRTG Fact Sheet;DOE GPHS Rev.5"
    desc: "Горячий узел MMRTG — несущая горячая структура вокруг стопки из 8 GPHS-модулей (каждый 99.5×93.3×58.2 мм, 1.93 кг): сплав Inconel 625 с пружинным преднатягом удерживает стопку и передаёт тепло на горячие спаи термоэлектрических колонн. Сам MMRTG — 43.6 кг, Ø642 мм по финам × 668 мм, тепловая мощность 1975 Вт, электрическая 110 Вт. Габарит горячего узла ≈260×260×250 мм (оценка от стопки GPHS 199×187×233 мм)."
    principle: "Тепло распада Pu-238 (≈1975 Вт тепл.) от стопки GPHS через горячий узел подаётся на горячие спаи PbTe/TAGS термоэлектрических пар; Inconel 625 держит рабочие температуры горячей стороны (до ~500°C на корпусе стопки) и химическую совместимость с графитом GPHS; пружинная система компенсирует термоусадку и удерживает осевой прижим."
  - file: реальные данные/изделия/энергетическая/mptm/часть_mptm_generator/_index.md
    url: https://www.microgen-engine.com/engines
    source_note: "Microgen Engine Corporation — свободнопоршневой Стирлинг-генератор 50 Гц, 1 кВт (макс. 1050 Вт), двигатель без горелки Ø300×450 мм; линейный альтернатор движущегося магнита"
    material: copper_wire
    dims: 250,250,110
    standards: "Microgen Engine Corporation Specs;EN 50598"
    desc: "Линейный альтернатор теплового модуля MPTM (референс: Microgen — свободнопоршневой Стирлинг-генератор 50 Гц / 1 кВт электрических, двигатель Ø300×450 мм без горелки). Аксиальная секция движущегося магнита: медные катушки статора на ламинированном ярме, якорь с NdFeB/SmCo магнитами на рабочем поршне; габарит секции ≈Ø250×110 мм (оценка от корпуса двигателя Ø300 мм), масса 3.0 кг — 30% номинала модуля 10 кг."
    principle: "Поршень конвертора несёт кольцевую магнитную систему, проходящую сквозь статорные катушки; переменный магнитный поток наводит однофазную ЭДС промышленной частоты хода, синхронизированной с резонансом пружинной подвески; медная обмотка с высокой плотностью тока обеспечивает кпд генерации до 90% при согласовании с сетевым инвертором."
  - file: реальные данные/изделия/энергетическая/perovskite_tandem/часть_perovskite_tandem_frame/_index.md
    url: https://www.wellste.com/aluminum-solar-panel-frame
    source_note: "Wellste aluminum solar panel frame — экструдированный анодированный профиль 30×35 мм (ряд 30×30–30×45 мм) для стеклянных PV-модулей"
    material: aluminum_6063
    dims: 1500,1000,35
    mass: 2.0
    share: 0.2
    standards: "EN 755-9 (EN AW-6063-T5);IEC 61215"
    desc: "Периметральная рама тандемного перовскит-кремниевого модуля 1500×1000×5 мм (референс: стандартные PV-рамы из экструдированного анодированного профиля EN AW-6063-T5 сечением 30×35 мм). Четыре отрезка профиля с терморазрывными уголками стягивают ламинацию, канавки под силиконовый герметик и монтажные пазы клипс заземления; масса рамы ≈2.0 кг при периметре 5 м и 0.4 кг/м."
    principle: "Рама воспринимает изгибающий момент от снеговой/ветровой нагрузки, разгружая стекло, и передаёт её на монтажные клипсы рельса; анодирование 12–15 мкм противостоит аммиачной и солевой атмосфере (IEC 61215), а пластиковые уголки разрывают гальваническую пару с нержавеющим крепежом."
  - file: реальные данные/изделия/энергетическая/svintsovo-kislotnye_akb/часть_svintsovo-kislotnye_akb_electrolyte/_index.md
    url: https://www.neware.net/news/what-is-battery-acid/230/53.html
    source_note: "Neware — электролит свинцово-кислотной АКБ: раствор H2SO4, удельная плотность 1.280 заряженной (≈37% H2SO4 по массе), падает к ~1.12 разряженной"
    material: h2so4_aqueous
    dims: 330,160,130
    mass: 4.5
    share: 0.3
    standards: "IEC 60095;EN 50342-1"
    desc: "Электролит свинцово-кислотной АКБ — водный раствор серной кислоты плотностью 1.280 г/см³ в заряженном состоянии (≈37% H₂SO₄ по массе; разряженной — до 1.12 г/см³). Заполняет поры пластин и сепарационное пространство корпуса 350×175×190 мм: уровень над пластинами ~130 мм, объём ≈3.5 л, масса ≈4.5 кг (30% номинала батареи 15 кг, референс SLI-класс IEC 60095)."
    principle: "При разряде ионы SO₄²⁻ связываются в сульфат свинца на обеих пластинах, концентрация кислоты и плотность падают пропорционально глубине разряда; при заряде реакция обращается с выделением водорода и кислорода при перезаряде; плотность электролита служит прямым индикатором степени заряженности (ареометр)."
  - file: работа и и/изделия/каркас/marcuswright/часть_marcus_человеческая_кожа/_index.md
    url: https://www.ncbi.nlm.nih.gov/books/NBK279255
    source_note: "NCBI InformedHealth — кожа человека: площадь 1.5–2 м², масса 3.5–10 кг, толщина 1–2 мм; инженерный аналог — лист медицинского силикона 40–50 Shore A"
    material: silikon_40_50_shore_a
    dims: 2000,1000,1.5
    standards: "ISO 10993-1 (биосовместимость);ASTM D2240 (Shore A)"
    desc: "Внешний покровный слой андроида Marcus Wright — инженерный аналог человеческой кожи (референс NCBI: у взрослого кожа покрывает 1.5–2 м², весит 3.5–10 кг при толщине 1–2 мм). Воплощение — листовой покров площадью 2 м² в развёртке (2000×1000 мм) толщиной 1.5 мм из медицинского силикона 40–50 Shore A на текстильной подложке, сегментированный на панели с скрытыми замками к эндоскелету; масса ≈3.0 кг."
    principle: "Покров восстанавливает контур тела и несёт тактильную функцию: силиконовая оболочка гасит микронеровности каркаса, текстильная подложка распределяет контактное давление и отводит тепло от сервоприводов к поверхности; сегментные замки допускают съём панелей для обслуживания, а Shore A 40–50 повторяет податливость дермы."
