source_note: "Chaowei Power patent CN112103513A (2020): positive grid frame 1.8–2.0 mm / 15–16 ribs, negative grid frame 1.2–1.4 mm / 12–15 ribs; plate L×W derived from canon DIN-format case 350×175×190 (6 cells, cell pitch 58.3 mm → plate 160×146 mm); Suzuki Battery engineering blog (PbO2 positive / sponge lead negative)"
files:
  - file: "реальные данные/изделия/энергетическая/svintsovo-kislotnye_akb/часть_svintsovo-kislotnye_akb_anode/_index.md"
    material: pbo2
    dims: 160,146,2.2
    mass: 0.247
    share: 0.0164
    standards: "IEC 60095"
    desc: "Положительная пластина свинцово-кислотной АКБ: решётка (токоотвод) из сплава Pb-Sb/Pb-Ca с рамкой 1.8–2.0 мм и 15–16 поперечными рёбрами, заполнена пастой активной массы PbO2 (β-фаза, пористость ~50 %). Пластина 160×146×2.2 мм — типовой формат DIN-батареи с корпусом 350×175×190 мм (6 ячеек вдоль длины, шаг 58.3 мм; высота пластин ~146 мм). Масса пластины ~0.25 кг (объём 51.4 см³ × ~4.8 г/см³ кажущейся плотности пасты)."
    principle: "При разряде PbO2 восстанавливается до PbSO4 с поглощением электронов: PbO2 + SO4²⁻ + 4H⁺ + 2e⁻ → PbSO4 + 2H2O (E° ≈ +1.69 В). При заряде реакция идёт в обратную сторону с выделением PbO2; решётка служит токоотводом и каркасом, пористая паста — местом электрохимической реакции."
  - file: "реальные данные/изделия/энергетическая/svintsovo-kislotnye_akb/часть_svintsovo-kislotnye_akb_cathode/_index.md"
    material: spongy_lead
    dims: 160,146,1.6
    mass: 0.15
    share: 0.01
    standards: "IEC 60095"
    desc: "Отрицательная пластина свинцово-кислотной АКБ: решётка из Pb-Sb/Pb-Ca с рамкой 1.2–1.4 мм и 12–15 поперечными рёбрами (тоньше положительной — нет коррозионного роста), заполнена губчатым свинцом (пористость ~40–50 %). Пластина 160×146×1.6 мм для DIN-корпуса 350×175×190 мм; масса ~0.15 кг (объём 37.4 см³ × ~4.0 г/см³ с учётом пористости губчатой массы)."
    principle: "При разряде губчатый свинец окисляется до сульфата: Pb + SO4²⁻ → PbSO4 + 2e⁻ (E° ≈ −0.36 В); электроны через решётку уходят во внешнюю цепь. При заряде PbSO4 восстанавливается обратно в пористый Pb; добавки (барий, лигносульфонаты) препятствуют срастанию кристаллов и сульфатации."
