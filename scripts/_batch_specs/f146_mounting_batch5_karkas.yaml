    standards: "EN 1090-2;ISO 898-1 (класс 8.8)"
    desc: "Опорный узел решётчатого каркаса (space frame support node): опорная пластина 150×150×12 мм из стали Ст3 (S235JR/Q235B) с 4× закладными анкерами M16 и посадкой под шаровый/болтовой узел фермы. Типовой инженерный пример base plate 300×300×20 с 4×M24×500 (Base Plate and Anchor Bolt Design) масштабирован под номинальную массу каркаса 50 кг. Масса ≈2.1 кг (расчёт по плотности 7.85 г/см³)."
    principle: "Закладные анкеры фиксируют опорную пластину в несущем основании; болтовое соединение пластины с узлами фермы передаёт пространственные нагрузки (сжатие/растяжение/сдвиг) от решётчатого каркаса на основание. Овальные/увеличенные анкерные отверстия допускают регулировку геометрии при монтаже (по LF Space Frame: anchor bolt holes of the support bottom plate)."
