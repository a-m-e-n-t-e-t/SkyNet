    desc: "Фланец крепления сильфонного компенсатора DN50 PN10: плоский фланец EN 1092-1 Type 01, наружный диаметр 165 мм, толщина 18 мм, окружность болтов 125 мм, 4× отверстия 18 мм под болты M16. Аустенитная нержавеющая сталь AISI 304/1.4541 — семейство фланцевых компенсаторов PN10-16 по каталогу Tameson. Масса ≈1.9 кг (таблица EN 1092-1 при 7.85 г/см³)."
    principle: "Компенсатор зажимается парой ответных фланцев; болты M16 затягиваются крест-накрест с равномерным моментом, чтобы не передавать крутящий момент на сильфон (практика floating metal flanges по Garlock). Фланец воспринимает осевую реакцию сильфона и передаёт её на присоединяемую конструкцию каркаса."
