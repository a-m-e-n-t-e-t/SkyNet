    standards: "Micromachines 12:913 (2021);JEDEC JESD22"
    desc: "Блок sense-усилителей периферии мемристорной матрицы: CMOS-схемы считывания (current-mode и voltage-mode sense amplifiers с транзиентной компенсацией и опорными ячейками), размещённые на кремниевом кристалле 12×12 мм рядом с кроссбаром. По обзору Zhang et al. (Micromachines 12:913, 2021) в advanced CMOS-узлах схемы считывания RRAM устойчивы к разбросу сопротивлений ячеек (килоомный диапазон HRS/LRS); макроблок sense-цепей принят 1.5×1.0×0.5 мм. Масса ≈2 г (20% номинала родителя 10 г)."
    principle: "При чтении на выбранную ячейку кроссбара подаётся низкое напряжение (схемы V/2-смещения невыбранных строк подавляют sneak-path токи через соседние ячейки); sense-усилитель сравнивает ток или напряжение выбранной битовой линии с опорной ячейкой и фиксирует состояние HRS/LRS защёлкой-триггером. Current-mode схемы устойчивы к разбросу сопротивлений мемристоров, voltage-mode с транзиентной компенсацией сокращают время чтения до наносекундного диапазона."
