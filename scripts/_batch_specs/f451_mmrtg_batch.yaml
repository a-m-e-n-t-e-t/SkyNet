files:
  - file: реальные данные/изделия/энергетическая/mmrtg/часть_mmrtg_isotope/_index.md
    url: https://www.energy.gov/ne/articles/powering-curiosity-multi-mission-radioisotope-thermoelectric-generators
    source_note: "DOE (2026): MMRTG — 8 GPHS-модулей, суммарно 4.8 кг PuO2; GPHS-модуль 9.3×9.7×5.3 см, ~250 Вт тепл. (NTRS 19910015359, Wikipedia GPHS)"
    material: pu-238
    dims: 97,97,425
    standards: "DOE 10 CFR 71;ISO 2919"
    desc: "Источниковый блок MMRTG: осевая стопка из 8 GPHS-модулей (General Purpose Heat Source) — каждый 9.3×9.7×5.3 см, ~1.43 кг, ~250 Вт тепл. на выпуске (NTRS 19910015359; Wikipedia), всего 8×53.09 ≈ 425 мм по высоте при сечении 97×97 мм. Суммарно 4.8 кг топлива PuO2 (DOE) — канон 5.0 кг соответствует топливу с иридиевыми капсулами; графитовые ударные оболочки (GIS) и CBCF-аэрошелл относятся к конструктиву стопки. Каждый модуль несёт 4 иридиевые капсулы с PuO2 — защита при авариях запуска (взрыв/падение/огонь)."
    principle: "Альфа-распад Pu-238 (T½ 87.7 года, ~0.56 Вт/г) выделяет ~2000 Вт тепл. в стопке GPHS. Иридиевые капсулы герметизируют топливо при гипотетических авариях, графитовые GIS/CBCF — абляционная термозащита; тепло через графитовый блок термораспределения (thermal distribution block) и изоляционный лайнер Haynes 25 передаётся горячим спаям 768 ТЭ-пар. Стопка в центре цилиндрического корпуса — радиальная схема теплового потока MMRTG."
  - file: реальные данные/изделия/энергетическая/mmrtg/часть_mmrtg_thermocouples/_index.md
    url: https://www.lpi.usra.edu/opag/meetings/feb2016/posters/1-MMRTG.PDF
    source_note: "LPI/USRA (2016): 16 ТЭ-модулей последовательно × 48 пар = 768 пар; Beyond NERVA: n-нога TE1010 (PbTe), p-нога TE2003 (PbSnTe)+TAGS-85; горячая сторона ~525 °C"
    material: pbte_teg
    dims: 600,425,50
    standards: "ASTM E1289"
    desc: "Термоэлектрический конвертер MMRTG: 16 термоэлектрических модулей, соединённых электрически последовательно, по 48 пар в каждом — всего 768 пар PbTe/TAGS-85 (LPI/USRA). Состав пары: n-нога — PbTe-сплав TE1010; p-нога сегментирована — PbSnTe TE2003 у горячего спая + TAGS-85 ((GeTe)0.85(AgSbTe2)0.15) у холодного (Beyond NERVA). Горячая сторона ~525 °C — верхний предел класса PbTe/TAGS (скаттерудиты позволили бы 600 °C). Кольцевой пакет вокруг стопки GPHS: осевая длина 425 мм (по стопке 8 модулей), развёртка по среднему диаметру ~600 мм, радиальная толщина 50 мм — конструктивная оценка; канон массы 10 кг агрегирует пары с горячими/холодными башмаками и шинами."
    principle: "Эффект Зеебека: градиент 525 °C (горячие спаи на блоке термораспределения GPHS) → ~200 °C (холодные спаи на стенке корпуса) генерирует ЭДС в 768 последовательно-параллельно соединённых парах (две цепи для отказоустойчивости), канон 110 Вт эл. при 2000 Вт тепл. (КПД ~6.5 % канон). Модули подпружинены для теплового контакта с обеими сторонами (Hammel et al.); сегментированная p-нога снимает термические напряжения на стыке материалов при марсианских циклах −60…+85 °C окружающей среды."
  - file: реальные данные/изделия/энергетическая/mmrtg/часть_mmrtg_thermal_insulation/_index.md
    url: https://www.techbriefs.com/component/content/article/3273-npo-45219
    source_note: "NASA TechBriefs HyMATI: аэрогель 100–1000 мкм между Mo-фольгами, λ 20–25 мВт/(м·К) до 800 °C, стабильность 1000 °C, −36 % массы; наследственная MFI: 60 слоёв Mo 7.6 мкм + Astroquartz 90 мкм, пакет 1.7 см"
    material: silica_aerogel_blanket
    dims: 700,425,17
    standards: "ASTM C534"
    desc: "Тепловая изоляция MMRTG между ТЭ-конвертером и корпусом — гибридный мультифольгово-аэрогелевый пакет класса NASA HyMATI: кварцевый аэрогель слоями 100–1000 мкм между тонкими молибденовыми фольгами, λ 20 мВт/(м·К) в вакууме и 25 мВт/(м·К) при 1 атм газа до 800 °C, стабильность до 1000 °C, на 36 % легче наследственной MFI (60 чередующихся слоёв Mo-фольги 7.6 мкм + Astroquartz 90 мкм, суммарный пакет 1.7 см). Пакет: осевая длина 425 мм по стопке GPHS, развёртка кольцевого зазора ~700 мм, толщина 17 мм — по наследственному MFI-стеку; силикатная изоляция также непосредственно окружает ТЭ-модули (Beyond NERVA). Канон 3.0 кг агрегирует пакет с крепежом и обмоткой ТЭ-зоны."
    principle: "Пакет гасит паразитные тепловые потери от ТЭ-зоны к корпусу: Mo-фольги блокируют радиационный перенос, аэрогелевые слои — кондуктивный (λ ~20–25 мВт/(м·К)); тонкий 17-мм пакет удерживает минимальный радиальный зазор и массу. Работает в вакууме и в атмосфере (значение при 1 атм аргона — консервативная верхняя оценка для марсианского CO2 ~6 мбар). Деградация за 14-летний срок учтена проектированием теплового инвентаря 2000→~1800 Вт."
  - file: реальные данные/изделия/энергетическая/mmrtg/часть_mmrtg_cold_side/_index.md
    url: https://www.energy.gov/ne/articles/powering-curiosity-multi-mission-radioisotope-thermoelectric-generators
    source_note: "DOE/NASA: MMRTG Ø64 см по кончикам рёбер × 66 см, 45 кг; Beyond NERVA: 8 рёбер из алюминиевого сплава Al6063, отвод радиацией/конвекцией"
    material: al_6063-t5
    dims: 660,640,640
    standards: "ASTM B209"
    desc: "Холодный узел MMRTG — радиационно-конвективный теплоотвод: труба алюминиевого корпуса с 8 осевыми рёбрами из Al6063, развёртка до Ø64 см по кончикам рёбер при длине 66 см (DOE/NASA: «64 cm in diameter (fin tip to fin tip) by 66 cm long»); огибающие габариты 660×640×640 мм. Холодные спаи 768 ТЭ-пар подпружинены к внутренней стенке корпуса (Hammel et al.: модули прижаты для отвода от холодного спая). Канон 5.0 кг согласован: труба корпуса Ø~0.33 м × 0.66 м × стенка ~2 мм ≈ 3.7 кг + рёбра."
    principle: "Холодная сторона ТЭ-цепи замыкается на стенку корпуса-радиатор: 8 рёбер Al6063 (λ ~200 Вт/(м·К), экструзия T5) наращивают излучающую поверхность до Ø64 см. Отвод тепла — радиацией в космос и конвекцией в атмосфере (Марс: CO2 ~6 мбар); режим dual-mission — конструкция обязана работать и в вакууме (чистая радиация), и в атмосфере. Температура холодных спаев ~200 °C задаёт нижнюю границу градиента для 768 пар PbTe/TAGS."
