    desc: "Силовой поршень свободно-поршневого конвертора Стирлинга ASC (Sunpower Inc. для NASA GRC; класс конвертора ~55 We, КПД 38%, масса конвертора 1.3 кг) — исполнительная часть ASRG, выдающего 130 We от двух конверторов при массе 32 кг и габарите 76×46×39 см. Диск-поршень Ø75×60 мм с тонкостенной юбкой и штоком линейного альтернатора; горячая часть конвертора работает при 650 °C. Материал — Inconel 718 (IN718), крип-испытания которого для flight-конверторов велись в NASA GRC. Масса ≈3.42 кг (14.25% номинала родителя 24 кг)."
    principle: "В свободно-поршневом цикле поршень качается под действием перепада давления рабочего газа (гелий) между горячей полостью за вытеснителем и холодной полостью: газовая пружина и инерция поршня образуют резонансный контур, а прикреплённые к штоку магниты линейного альтернатора превращают колебание в электричество. Газовые подшипники Sunpower исключают механический контакт пар трения — отсюда ресурс ≥14 лет без износа; Inconel 718 держит крип и давление цикла при 650 °C горячей зоны."
