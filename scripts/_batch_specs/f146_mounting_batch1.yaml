    standards: "NASA-STD-5001A;MSFC-STD-5003"
    desc: "Седловая опора COPV-баллона (Ø≈120 мм): фрезерованное из Ti-6Al-4V полукольцо шириной 40 мм с мягкими прокладками (каптон/тефлон против повреждения композитной обмотки) и 2× бандажные титановые ленты 20×1.5 мм. Envelope узла 240×160×50 мм, масса ≈250 г."
    principle: "Нижняя седловая опора воспринимает вес и осевые нагрузки баллона, верхние бандажные ленты прижимают COPV к седлу с контролируемым моментом; прокладки исключают контакт титана с углепластиковой обмоткой (гальваническая пара + истирание) — практика NASA NTRS 20110008406."
