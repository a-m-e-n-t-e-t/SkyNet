    standards: "IEC 60034-7 (IM B3/B5);ISO 4762 (M5)"
    desc: "Кронштейн-хомут крепления BLDC-двигателя (семейство до 15 кВт, IEC frame 80–160): L-образный профиль 120×60×5 мм с вырезами облегчения, 4× винтов M5 ISO 4762 к foot/flange-посадке IM B3/B5, виброизоляторы между фланцем двигателя и базовой пластиной. Масса узла ≈50 г (алюминий 6061-T6, 18.5 см³ с учётом вырезов)."
    principle: "Фланцевое/ножечное крепление по IEC 60034-7: хомут обжимает посадочный поясок статора, болты M5 передают реактивный момент на базовую поверхность; резиновые виброизоляторы (Shore 60A) разрывают вибрационную связь ротор–рама."
  - file: реальные данные/изделия/сенсоры/flir/часть_flir_mounting/_index.md
    url: https://softwareservices.flir.com/BFS-U3-51S5PC/latest/40-Installation/Mounting.htm
