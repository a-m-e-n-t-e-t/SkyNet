    share: 0.02
    standards: "ISO 261 (M2);1/4-20 UNC tripod"
    desc: "Адаптер крепления FLIR-камеры (Blackfly S BFS-U3-51S5, корпус 29×29 мм): пластина 35×35×4 мм с 4× резьбовыми отверстиями M2×2 под нижний ряд крепёжных отверстий корпуса и резьбой 1/4-20 UNC для штативного кронштейна. Масса ≈10 г (алюминий 6061-T6, анодирование)."
    principle: "Камера притягивается к пластине 4× винтами M2 (по datasheet Teledyne FLIR), пластина через штативное резьбовое отверстие 1/4-20 фиксируется на кронштейне носителя; большая опорная площадь 35×35 мм гасит вибрации оптики."
  - file: реальные данные/изделия/прочее/copv/часть_copv_mounting/_index.md
    url: https://ntrs.nasa.gov/api/citations/20110008406/downloads/20110008406.pdf
    source_note: "NASA NTRS 20110008406 — Composite Overwrapped Pressure Vessels (McLaughlan, 2011)"
    material: ti-6al-4v
    dims: 240,160,50
    mass: 0.25
