    share: 0.02
    standards: "ISO 261 (M2.5)"
    desc: "Комплект стоек крепления платы STM32 (формат Nucleo): 4× изоляционные стойки PEEK M2.5×11 с винтами, envelope 55×35×8 мм. PEEK выбран за электроизоляцию (исключает замыкание на шасси) и стабильность при пайке/отмывке. Масса ≈2 г."
    principle: "Плата фиксируется на 4 стойках M2.5 (стандарт ST Nucleo — отверстия Ø3.2 мм по углам): PEEK-стойки электрически изолируют сигнальные слои от металлического шасси и демпфируют вибрацию, допуская установку без дополнительных изоляционных шайб."
  - file: реальные данные/изделия/система_связи/stm32h743/часть_stm32h743_mounting/_index.md
