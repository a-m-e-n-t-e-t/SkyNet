    standards: "ISO 4762 (M4);ISO 898-1"
    desc: "Кронштейн LiDAR (RoboSense AC1, корпус 95×42.6×80 мм, 400 г): П-образная пластина 110×55×4 мм с центральным вырезом под разъём и кабельный отвод, 4× винта M4 ISO 4762 в штатные крепёжные отверстия основания AC1. Масса ≈65 г (алюминий 6061-T6)."
    principle: "Жёсткая базовая пластина крепит AC1 четырьмя M4 к несущей поверхности по инструкции RoboSense (монтаж без перекрытия оптических апертур и с учётом зоны кабельного вывода); вырез в пластине исключает изгиб кабеля радиусом <10 мм."
  - file: реальные данные/изделия/система_связи/stm32/часть_stm32_mounting/_index.md
