    standards: "ISO 261 (M3);ISO 898-1"
    desc: "Комплект стоек крепления NUCLEO-H743ZI2 (Nucleo-144, плата 103.5×53.3 мм): 4× металлические стойки M3×15 нерж. с винтами M3, envelope набора 55×35×8 мм. Алюминиевые/стальные стойки заземляют плату на шасси через посадочные площадки GND. Масса ≈6 г."
    principle: "Плата Nucleo-144 фиксируется на 4 стойках M3 (крепёжные отверстия по углам платы 103.5×53.3 мм по UM2407); металлический крепёж создаёт контролируемое заземление GND→шасси и снимает вибрационные нагрузки с BGA/LQFP-выводов MCU."
