    material: al_6061-t6
    dims: 70,45,3
    mass: 0.016
    share: 0.16
    standards: "SAE J1962_201607"
    desc: "Кронштейн диагностического разъёма OBD-II (SAE J1962, корпус 2×8 ≈53×34 мм): пластина 70×45×3 мм из алюминия 6061-T6 с центральным вырезом Ø34 мм и 2× винтовыми посадками фланца J1962. Масса ≈16 г; кронштейн позиционирует разъём в зоне досягаемости водителя (600 мм от руля, регламент OBD)."
    principle: "Разъём J1962 фиксируется в вырезе кронштейна двумя фланцевыми винтами (по SAE J1962 — mating face c фиксаторами положения), пластина крепится к кронштейну панели автомобиля; вырез Ø34 обеспечивает доступ ключа-сканера без демонтажа узла."
