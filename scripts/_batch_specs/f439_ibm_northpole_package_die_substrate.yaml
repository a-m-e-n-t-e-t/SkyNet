# Issues #439..#446/#468/#470/#479 — родитель izdelie_ibm_northpole (3 файла: package, die, substrate)
# Данные из web_search 2026-11-06:
#   IBM Research blog (2024): NorthPole — 12 нм, 22 млрд транзисторов в 795 мм², 256 ядер, 16 чипов в 2U по PCIe;
#   TechPowerUp GPU DB: NVIDIA A100 PCIe 80 GB — пакет FCBGA-2743, 55×55 мм для кристалла 826 мм² (референс-класс);
#   Shih et al., PMC10304058 (2023): FCBGA — 8-слойная build-up органическая подложка толщиной 1.2 мм;
#   University Wafer / Wikipedia: стандартная толщина законченной 300-мм пластины 775 мкм;
#   kingsunpcb: BT 2–10 слоёв L/S 30–40 мкм, ABF 8–20+ слоёв L/S 8–15 мкм; aft-website.com: марки ABF GX-92/GZ-41/GL-102;
#   wnie.online: Henkel Loctite ECCOBOND UF 9000AG — высокая Tg, CTE <20 ppm; epoxysetinc: Si 2.6 ppm/K vs подложка 14–17 ppm/K;
#   ASE: HFC-BGA = FCBGA + Cu/Al heat spreader; INEMI: ядро подложки 0.4–0.8 мм, build-up слой 0.03–0.035 мм.
# Массы/доли — канон декомпозиции (0.02/0.015/0.01 кг; 0.3/0.22/0.15), согласуются с суммой реальных компонентов.
files:
  - file: реальные данные/изделия/вычислительная/ibm_northpole/часть_ibm_northpole_package/_index.md
    url: https://www.techpowerup.com/gpu-specs/a100-pcie-80-gb.c3821
    source_note: "TechPowerUp GPU DB: A100 PCIe 80 GB — пакет FCBGA-2743, 55×55 мм для кристалла 826 мм² (референс-класс); ASE: HFC-BGA = FCBGA + Cu heat spreader"
    material: emc_underfill
    dims: 55,55,3.0
    standards: "JEDEC J-STD-020;JEDEC JESD22-A104"
    desc: "Корпус FCBGA (перевёрнутый кристалл на органической подложке с медным теплораспределителем): референс-класс FCBGA-2743 — пакет 55×55 мм NVIDIA A100 PCIe для кристалла 826 мм², ближайший публичный аналог 800-мм² NorthPole (размеры пакета IBM не раскрывает). Высота сборки ~3.0 мм = подложка 1.2 + кристалл 0.775 + теплораспределитель 1.0 мм (см. части substrate/die/thermal_spreader) + underfill/припой. Заполнение — кварценаполненный эпоксидный компаунд: капиллярный underfill в зазоре кристалл-подложка и формовочный компаунд вокруг бампов. Канон 0.02 кг согласуется с суммой реальных компонентов ~18 г (подложка ~8 + Cu-IHS 7.2 + кристалл 1.4 + компаунд ~1.5 г)."
    principle: "Корпус FCBGA выполняет три функции: электрический переход кристалл→карта PCIe через массив BGA (2743 вывода в референсе FCBGA-2743), механическая защита кристалла 800 мм² и отвод тепла через Cu-IHS — ASE классифицирует такой конструктив как термически усиленный HFC-BGA (FCBGA + heat spreader из Cu/Al). Ключевой материал заполнения — кварценаполненный эпоксидный underfill: он жёстко связывает кристалл (CTE 2.6 ppm/K) с органической подложкой (14–17 ppm/K), гася сдвиг в C4-микробамперах при термоциклировании −55…+150 °C по JESD22-A104; класс материала — Henkel Loctite ECCOBOND UF 9000AG с высокой Tg и CTE <20 ppm/K."
  - file: реальные данные/изделия/вычислительная/ibm_northpole/часть_ibm_northpole_die/_index.md
    url: https://research.ibm.com/blog/northpole-llm-inference-results
    source_note: "IBM Research (2024): NorthPole — 12 нм, 22 млрд транзисторов в 795 мм², 16 чипов в 2U-сервере по PCIe; толщина пластины 775 мкм (University Wafer)"
    material: si
    dims: 28.2,28.2,0.775
    standards: "JEDEC JESD47"
    desc: "Кремниевый кристалл нейроинференса IBM NorthPole: 256 вычислительных ядер в матрице 16×16 с распределённой on-chip памятью 224 МБ SRAM (near-memory computing), 22 млрд транзисторов по 12-нм техпроцессу. Площадь 795 мм² (IBM Research, 2024: «22 billion transistors in 795 square millimeters») → сторона √795 ≈ 28.2 мм; толщина 0.775 мм — стандарт законченной 300-мм пластины. Реальная масса Si ≈ 1.45 г; канон 0.01 кг агрегирует кристалл с пассивацией и топ-металлизацией. Конфигурация IBM: 16 чипов на картах PCIe в 2U-сервере."
    principle: "Кристалл объединяет вычисление и память: каждое из 256 ядер оперирует потоком данных непосредственно в банках SRAM (dataflow near-memory computing), устраняя фон-неймановскую узкую шину — отсюда энергоэффективность ~74 Вт на площади 8 см². Топ-металлизация отдаёт питание и сигналы через C4-микробамперы на подложку FCBGA, тепло — через подложку в медный теплораспределитель. Техпроцесс 12 нм задаёт масштаб: 795 мм² — практический верхний предел выхода годных монолитного кристалла на пластине 300 мм."
  - file: реальные данные/изделия/вычислительная/ibm_northpole/часть_ibm_northpole_substrate/_index.md
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10304058
    source_note: "Shih et al., PMC10304058 (2023): FCBGA — 8-слойная build-up органическая подложка толщиной 1.2 мм; Kyocera FC-BGA: до 10-n-10 слоёв, ленд вии от 85 мкм"
    material: bt_abf_substrate
    dims: 55,55,1.2
    standards: "IPC-4101;IPC-6012"
    desc: "Органическая подложка FCBGA чипа NorthPole: жёсткое BT-ядро (бисмалеимид-триазин, MGC) с build-up слоями Ajinomoto Build-up Film (ABF) и медной фольгой — 8-слойная build-up структура толщиной 1.2 мм по референс-модели FCBGA (Shih et al., 2023). Footprint 55×55 мм — референс-класс FCBGA-2743 (пакет A100 PCIe для кристалла 826 мм²; NorthPole 800 мм² того же класса). Топология: ABF-слои L/S 8–15 мкм (до 8/8 мкм), лазерные микровии с лендом от 85 мкм (Kyocera, до 10-n-10), BT-ядро 0.4–0.8 мм (INEMI). Канон 0.015 кг агрегирует подложку с BGA-шарами и маской; реальная масса ламината ~8 г."
    principle: "Подложка транслирует монтажную топологию перевёрнутого кристалла в шаг BGA карты PCIe: C4-микробамперы → разводка build-up слоёв ABF (L/S 8–15 мкм, SAP-металлизация) → BT-ядро → BGA-шары. ABF-диэлектрик формирует лазерные микровии в структуре до 10-n-10 (Kyocera); CTE in-plane 14–17 ppm/K смягчает рассогласование с кремнием 2.6 ppm/K, а сплошные медные полигоны питания/земли под кристаллом 800 мм² поддерживают целостность питания 256 ядер при коммутационных токах инференса."
