    mass: 0.025
    share: 0.05
    standards: "ISO 4762 (M5);Arbe Phoenix Integration Guide"
    desc: "Рёберная опорно-теплосъёмная плита твердотельного радара (блок класса Arbe Phoenix 135×102×42 мм, 1 кг, 26 Вт): алюминиевая плита 100×70×8 мм с рёбрами на тыльной стороне и 4× резьбовыми M5 под штатные лапы блока. Масса ≈25 г (5% номинала 0.5 кг)."
    principle: "Блок притягивается лапами M5 к плите через термопрокладку — плита уносит 26 Вт рассеивания в рёбра и держит антенную панель параллельной базовой плоскости (крен вносит смещение эхо-пеленга), жёсткая посадка исключает резонанс панели на вибрациях носителя."
