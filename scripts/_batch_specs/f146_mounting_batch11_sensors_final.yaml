# Issue #146 — группа «100×50×20mm, 0.1kg» (12 файлов), batch 11 (финальный): остаток сенсоров
# Данные из web_search 2026-11-05: Prophesee EVK4 HD 30×30×36 мм 40 г; iniVation DAVIS346 40×60×25 мм 100 г;
# Fair-Rite Snap-It 0443164151 13.05×29×32.5 мм; Iridium 9603 31.5×29.6×8.1 мм 11.4 г;
