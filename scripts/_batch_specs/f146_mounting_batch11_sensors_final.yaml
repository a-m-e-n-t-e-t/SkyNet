  - file: реальные данные/изделия/сенсоры/dvs/часть_dvs_mounting/_index.md
    url: https://prophesee.ai/wp-content/uploads/2023/09/EVK4-HD-Prophesee-Evaluation-Kit-Brief-13042023.pdf
    source_note: "Prophesee EVK4 HD Product Brief — камера 30×30×36 мм, 40 г (Sony IMX636), несколько mounting options"
    material: al_6061-t6
    dims: 35,30,4
    mass: 0.012
    share: 0.024
    standards: "ISO 4762 (M3);Prophesee EVK4 Product Brief"
    desc: "Посадочная пластина событийной камеры DVS (модуль Prophesee EVK4 HD класса 30×30×36 мм, 40 г на сенсоре Sony IMX636): алюминиевая пластина 35×30×4 мм с центральным резьбовым отверстием под штатное крепление камеры и 2× винтами M3 к базовой раме. Масса ≈12 г (2.4% номинала 0.5 кг)."
    principle: "Камера фиксируется к пластине по штатной резьбовой точке днища, пластина — к раме через M3: жёсткая база держит оптическую ось параллельной посадочной плоскости; алюминий 6061-T6 отводит тепло сенсора и не экранирует антенну USB-модуля."
  - file: реальные данные/изделия/сенсоры/event_cameras/часть_event_cameras_mounting/_index.md
    url: https://inivation.com/wp-content/uploads/2019/08/DAVIS346.pdf
    source_note: "iniVation DAVIS346 datasheet — камера 40×60×25 мм, 100 г без объектива, анодированный корпус, крепления 1/4 дюйма-20 и M3"
    material: al_6061-t6
    dims: 45,30,5
    mass: 0.014
    share: 0.028
    standards: "ISO 4762 (M3);ANSI/ASME B1.1 (1/4-20 UNC)"
    desc: "Переходный кронштейн событийной камеры (модуль iniVation DAVIS346 класса 40×60×25 мм, 100 г без объектива, корпус с точками крепления 1/4-20 UNC и M3): алюминиевый кронштейн 45×30×5 мм с центральным резьбовым гнездом 1/4-20 и рядом отверстий M3. Масса ≈14 г (2.8% номинала 0.5 кг)."
    principle: "Кронштейн связывает штатное резьбовое гнездо 1/4-20 корпуса камеры с посадочными M3 базовой рамы — ориентация сенсора настраивается поворотом вокруг оси до затяжки; анодированный алюминий исключает гальваническую пару с корпусом камеры."
  - file: реальные данные/изделия/сенсоры/ferritovye_klinya_na_kabelyah_sensorov/часть_ferritovye_klinya_na_kabelyah_sensorov_mounting/_index.md
    url: https://fair-rite.com/product_datasheet/PN0443164151.html
    source_note: "Fair-Rite 0443164151 Round Cable Snap-It — хомут 13.05×29×32.5 мм, кабели Ø2.5–25.4 мм, феррит класса 43/31 (MnZn)"
    material: peek
    dims: 30,20,12
    mass: 0.008
    share: 0.016
    standards: "CISPR 25;Fair-Rite Material 43/31 DS"
    desc: "Пружинный хомут ферритового клина на кабельном жгуте сенсоров (клин класса Fair-Rite Round Cable Snap-It 13.05×29×32.5 мм на кабели Ø2.5–25.4 мм, феррит MnZn класса 43/31): корпус-защёлка из PEEK 30×20×12 мм с шарнирной ветвью и двумя зубьями фиксации. Масса ≈8 г (1.6% номинала 0.5 кг)."
    principle: "Половины хомута стягиваются вокруг жгута с клином до щелчка зубьев — упругая ветвь из PEEK держит контактное давление на феррите по всему периметру, а феррит (MnZn 43/31, полоса 1–500 МГц) создаёт частотно-зависимое подавление синфазных токов без разрыва кабеля."
  - file: реальные данные/изделия/сенсоры/iridium_sbd/часть_iridium_sbd_mounting/_index.md
    url: https://www.iridium.com/products/iridium-9603-module
    source_note: "Iridium 9603 Product Specifications — трансивер 31.5×29.6×8.1 мм, 11.4 г, два монтажных отверстия под посадку на PCB"
    material: al_6061-t6
    dims: 35,32,3
    mass: 0.008
    share: 0.016
    standards: "Iridium 9603 Developer Guide;IPC-2221"
    desc: "Посадочная рамка SBD-трансивера (модуль Iridium 9603 класса 31.5×29.6×8.1 мм, 11.4 г, крепление через два монтажных отверстия на PCB): алюминиевая рамка 35×32×3 мм с двумя юстированными втулками под монтажные отверстия модуля и окном под радиочастотный разъём. Масса ≈8 г (1.6% номинала 0.5 кг)."
    principle: "Модуль притягивается к рамке через штатные отверстия по Developer Guide — втулки центрируют посадку и не перекрывают антенный волноводный карман модуля; рамка изолирует пайку PCB от изгибающих нагрузок жгута и задаёт зазор до заземлённой плоскости."
  - file: реальные данные/изделия/сенсоры/kaskadnyi_stirling-kriokuler/часть_kaskadnyi_stirling-kriokuler_mounting/_index.md
    url: https://oxcryo.com/products/two-stage-cryocoolers
    source_note: "Oxford Instruments two-stage Stirling cryocoolers — двухступенчатый криокулер 278×129×150 мм, 2.5 кг"
    material: stal_st3
    dims: 130,110,8
    mass: 0.03
    share: 0.06
    standards: "ISO 4762 (M6);Oxford Instruments Integration Note"
    desc: "Антивибрационная опорная плита каскадного Стирлинг-криокулера (машина класса Oxford two-stage 278×129×150 мм, 2.5 кг): стальная плита Ст3 130×110×8 мм с 4× резьбовыми M6 и рядом сквозных пазов под виброопоры. Масса ≈30 г (6% номинала 0.5 кг)."
    principle: "Криокулер крепится к плите через штатные лапы M6, плита — к раме через демпферы в пазах: стальная плита (E≈200 ГПа) поднимает первую собственную частоту узла выше полосы хода компрессора, снижая передачу вибраций на холодный палец и ФПУ."
  - file: реальные данные/изделия/сенсоры/lidar_robosense_ac1/часть_lidar_robosense_ac1_mounting/_index.md
    url: https://www.robosense.ai/en/IncrementalComponents/AC1
    source_note: "RoboSense AC1 product page (габариты 135×80×40 мм, ~230 г по обзору OpenELab 2026-03) — лидар-камера глубины 120°×60°"
    material: al_6061-t6
    dims: 80,50,6
    mass: 0.015
    share: 0.03
    standards: "ISO 4762 (M4);RoboSense AC1 Datasheet"
    desc: "Юстировочный кронштейн лидара (модуль RoboSense AC1 класса 135×80×40 мм, ~230 г, FOV 120°×60°): алюминиевый кронштейн 80×50×6 мм с прорезью ±3 мм по азимуту и 2× винтами M4 к несущей полке. Масса ≈15 г (3% номинала 0.5 кг)."
    principle: "Лидар ложится на кронштейн штатным днищем и фиксируется M4, прорезь позволяет выставить нулевое направление луча по продольной оси носителя до затяжки; алюминиевая плита работает теплосъёмом корпуса и держит калибровку внешних камер при термоциклировании."
  - file: реальные данные/изделия/сенсоры/metalinza/часть_metalinza_mounting/_index.md
    url: https://www.edmundoptics.com/p/m12-mu-video-lens-holder-for-camera-boards/20897/
    source_note: "Edmund Optics M12 Lens Holder for Camera Boards — резьбовой холдер M12×0.5 под платные камеры"
    material: al_6061-t6
    dims: 16,16,9
    mass: 0.006
    share: 0.012
    standards: "S-mount (M12×0.5);Edmund Optics M12 Lens Holder"
    desc: "Резьбовой холдер металинзы (чип-метаповерхность класса Metalenz на 300-мм полупроводниковой пластине, монтаж поверх фотоматрицы): алюминиевый холдер 16×16×9 мм с резьбовым гнездом M12×0.5 и фланцем на 2× винта M2 к плате сенсора. Масса ≈6 г (1.2% номинала 0.5 кг)."
    principle: "Чип металинзы садится в посадочное окно холдера, резьба M12×0.5 задаёт рабочее расстояние до матрицы вращением на доли оборота — фланец держит параллельность метаповерхности плоскости сенсора, критичную для фазы наноструктур; алюминий не вносит блик в апертурную зону."
  - file: реальные данные/изделия/сенсоры/multispektralnye_cmos-matritsy_s_ik-diapazonom/часть_multispektralnye_cmos-matritsy_s_ik-diapazonom_mounting/_index.md
    url: https://www.sony-semicon.com/files/62/flyer_industry/IMX990_991_992_993_Flyer_en.pdf
    source_note: "Sony IMX990/991/992/993 SenSWIR Flyer — IMX992 5.32 МП, пиксель 3.45 мкм, диапазон 400–1700 нм"
    material: al_6061-t6
    dims: 28,28,5
    mass: 0.01
    share: 0.02
    standards: "Sony IMX992 SenSWIR Flyer;ISO 4762 (M2.5)"
    desc: "Посадочная рамка мультиспектральной матрицы (сенсор класса Sony IMX992 SenSWIR, 5.32 МП, пиксель 3.45 мкм, 400–1700 нм, кристалл ~9.2×7.6 мм в керамическом LGA-корпусе): алюминиевая рамка 28×28×5 мм с окном под корпус и 4× винтами M2.5 к плате. Масса ≈10 г (2% номинала 0.5 кг)."
    principle: "Корпус матрицы центрируется в окне рамки и притягивается к буртику — рамка выравнивает плоскость кристалла относительно посадочной плоскости оптики и отводит тепло LGA-основания; окно не выступает в конус поля зрения и не режет SWIR-канал лучами кромки."
  - file: реальные данные/изделия/сенсоры/poristyi_gazovyi_podshipnik_iz_sic/часть_poristyi_gazovyi_podshipnik_iz_sic_mounting/_index.md
    url: https://www.mdpi.com/2077-0375/12/9/898
    source_note: "Xiao et al. (Micromachines 2022) — аэростатический подшипник с пористым ограничителем; класс New Way Porous Media (пористый углерод/SiC)"
    material: ss_aisi_304
    dims: 50,50,30
    mass: 0.02
    share: 0.04
    standards: "ISO 2768-1 (допуски);New Way Design Guide"
    desc: "Картридж-обойма пористого газового подшипника (вставка из пористого SiC/пористого углерода класса New Way Porous Media, зазор ~5 мкм): обойма из нержавеющей стали AISI 304 50×50×30 мм с посадочным гнездом под пористую вставку, каналом подачи воздуха и уплотнительным буртиком. Масса ≈20 г (4% номинала 0.5 кг)."
    principle: "Пористая вставка запрессовывается в гнездо обоймы и поджимается буртиком — воздух проходит через объём пористой матрицы и выходит в зазор 5–10 мкм, а обойма раздаёт питающий канал и держит геометрию гнезда (допуск по ISO 2768-1), от которой зависит равномерность дросселирования по пятну контакта."
  - file: реальные данные/изделия/сенсоры/sensora_volnovogo_fronta/часть_sensora_volnovogo_fronta_mounting/_index.md
    url: https://www.phasics.com/en/product/sid4-hr-wavefront-sensor
    source_note: "Phasics SID4 HR Wavefront Sensor — прибор 73×71×90 мм, ~450 г, апертура ~10×8.6 мм"
    material: al_6061-t6
    dims: 90,50,6
    mass: 0.015
    share: 0.03
    standards: "ISO 4762 (M4);Phasics SID4 Spec Sheet"
    desc: "Базовая плита сенсора волнового фронта (прибор класса Phasics SID4 HR 73×71×90 мм, ~450 г): алюминиевая плита 90×50×6 мм с коаксиальным резьбовым отверстием под штативную резьбу прибора и 2× винтами M4 к оптической станине. Масса ≈15 г (3% номинала 0.5 кг)."
    principle: "Прибор фиксируется к плите через штатное резьбовое гнездо, плита — к станине через M4: плита держит ось апертуры прибора параллельной базовой линии стенда (высота задаётся распорной втулкой), а массивная алюминиевая база гасит дрожание и не добавляет собственной деформации в измеряемый волновой фронт."
  - file: реальные данные/изделия/сенсоры/starlink_mini/часть_starlink_mini_mounting/_index.md
    url: https://starlink.com/public-files/specification_sheet_mini.pdf
    source_note: "Starlink Mini Specification Sheet — терминал 1.10 кг, 1.16 кг с кикстендом (+0.06 кг), класс IP-конструкции с встроенной опорой"
    material: ss_aisi_304
    dims: 240,30,12
    mass: 0.025
    share: 0.05
    standards: "Starlink Mini Specification Sheet;ISO 2768-1"
    desc: "Откидная опора-кикстенд терминала (антенна Starlink Mini класса 1.10 кг, кикстенд +0.06 кг по спецификации): штанга из нержавеющей стали AISI 304 240×30×12 мм с осевым шарниром и упорной полкой под два угла наклона. Масса ≈25 г (5% номинала 0.5 кг)."
    principle: "Штанга вращается на осевом шарнире и садится полкой в один из упоров — распор между корпусом и основанием держит расчётный угол возвышения ФАР без отдельного кронштейна; нержавеющая сталь держит осевой люфт при ветровой нагрузке и допускает складывание для транспортировки."
  - file: реальные данные/изделия/сенсоры/tverdotelnyi_mmwave_radar/часть_tverdotelnyi_mmwave_radar_mounting/_index.md
