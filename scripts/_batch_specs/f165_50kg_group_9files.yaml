  - file: реальные данные/изделия/энергетическая/mikroreaktor_deleniya/часть_mikroreaktor_deleniya_fuel/_index.md
    url: https://www.pbmr.co.za/index2.asp?Content=224
    source_note: "PBMR fuel pebble — Ø60 мм, 210 г, ~9 г урана (pbmr.co.za; NRC ML031180806); X-energy: ~18000 TRISO-частиц/пеббл; партия 6×6×7 = 252 пеббла ≈ 52.9 кг (упаковка 360×360×420 мм)"
    material: karbon
    dims: 360,360,420
    mass: 52.92
    standards: "PBMR Fuel Specification"
    desc: "Топливная загрузка микрореактора на TRISO-пебблах (референс: пеббл PBMR — Ø60 мм, 210 г, ~9 г урана; в пеббле X-energy ~18 000 TRISO-частиц: ядро UO₂ в слоях буферного PyC, внутреннего PyC, SiC и внешнего PyC, заключённых в графитовую матрицу). Партия 6×6×7 = 252 пеббла суммарно ≈52.9 кг, транспортная упаковка 360×360×420 мм."
    principle: "Многослойное TRISO-покрытие каждой частицы (PyC/SiC/PyC) работает как герметичный микро-контейнер, удерживающий продукты деления при температурах эксплуатации реактора; графитовая матрица пеббла замедляет нейтроны; пебблы двигаются через активную зону в непрерывной перегрузке."
