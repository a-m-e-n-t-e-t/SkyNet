    desc: "Блок искровых коммутаторов Marx-генератора (референс: тригатронные разрядники DMP Photonics — герметичный керамико-металлический корпус, три электрода с соосным триггерным электродом, standoff до 40 кВ, пиковый ток ~10 кА, ресурс 10^8 срабатываний; форм-фактор коммутационного прибора Ø50×76 мм). Группа последовательно срабатывающих тригатронов коммутации с шинными связями — масса узла 50 кг по канону."
