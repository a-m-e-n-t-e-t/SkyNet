# Issue #146 — группа «100×50×20mm, 0.1kg, ti-6al-4v» (26→19 файлов), batch 9: сенсоры MEMS/пьезо/акустика ×7
# Данные из web_search 2026-11-05: Bosch BMI088 datasheet (LGA 3.0×4.5×0.95), Infineon IM69D130 (4.0×3.0×1.2),
# TE LDT0-028K (PVDF 28 µm + полиэстер 0.125 мм), Yang et al. Micromachines 2019 (AlN на (100) Si),
# Vesper VM3000 (3.5×2.65×1.3), Qiu et al. 2015 (pMUT 320 мембран Ø80 µm), Wang et al. Micromachines 2021 (линза Ø25, f#=0.6).
# Все родители группы: nominal 0.5 кг → масса = share × 0.5 кг.
