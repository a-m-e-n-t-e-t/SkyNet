    source_note: "Bosch Sensortec BMI088 datasheet — LGA 3.0×4.5×0.95 мм, 16-pin, виброизолированная посадка по datasheet"
    material: al_6061-t6
    dims: 45,35,10
    mass: 0.025
    share: 0.05
    standards: "ISO 4762 (M3);Bosch Sensortec PCB Guide"
    desc: "Виброизолированный кронштейн MEMS-IMU (ядро Bosch BMI088, LGA 3.0×4.5×0.95 мм, 16-pin): алюминиевая рама 45×35×10 мм с платой-носителем, 4× демпферными опорами M3 и зоной отгиба креплений. Масса ≈25 г (5% номинала 0.5 кг)."
    principle: "Плата с BMI088 сидит на раме через демпферы — корпусной резонанс вынесен выше рабочего диапазона гироскопа по рекомендации Bosch; рама отсекает изгибы несущей конструкции, которые в LGA-корпусе без развязки дают смещение нуля."
  - file: реальные данные/изделия/сенсоры/mems-mikrofonov/часть_mems-mikrofonov_mounting/_index.md
    url: https://www.infineon.com/assets/row/public/documents/30/49/infineon-im69d130-datasheet-en.pdf
    source_note: "Infineon XENSIV IM69D130 datasheet — корпус 4.00×3.00×1.20 мм, цифровая PDM, всенаправленный"
    material: al_6061-t6
    dims: 70,30,8
    mass: 0.02
    share: 0.04
    standards: "IPC-2221;ISO 4762 (M2.5)"
    desc: "Рама микрофонной решётки MEMS (6× Infineon IM69D130, корпус 4.0×3.0×1.2 мм, PDM): алюминиевый профиль 70×30×8 мм с 6× акустическими портами Ø1.0 мм (шаг 10 мм), звуковым лабиринтом внутри и винтами M2.5 к несущей панели. Масса ≈20 г (4% номинала 0.5 кг)."
    principle: "Порты решётки выведены на лицевую плоскость рамы с одинаковым импедансом — фазовая задержка между микрофонами сохраняется для beamforming; лабиринт отделяет заднюю волну и убирает акустическую связь между каналами IM69D130."
  - file: реальные данные/изделия/сенсоры/pezo-sensor/часть_pezo-sensor_mounting/_index.md
    url: https://www.mouser.com/datasheet/2/418/5/ENG_DS_LDT_with_Crimps_A1-1958243.pdf?srsltid=AYCX9vI9gOvh6AoNovT2SQ3X9WldbMua6vsH9eyL5zIdVX9GT5w_3NSz
    source_note: "TE Connectivity LDT0-028K datasheet — плёнка PVDF 28 µm с серебряными электродами на полиэстере 0.125 мм, консольное крепление"
    material: al_6061-t6
    dims: 25,18,6
    mass: 0.008
    share: 0.016
    standards: "ISO 4762 (M2);TE LDT Mounting Note"
    desc: "Консольный зажим пьезоплёнки (TE LDT0-028K: PVDF 28 µm + полиэстер 0.125 мм, лепесток 41×13 мм): алюминиевый блок 25×18×6 мм с пазом 13.4×1.6 мм под корень лепестка и прижимом 2× M2. Масса ≈8 г (1.6% номинала 0.5 кг)."
    principle: "Корень плёнки зажимается в паз на глубину 6 мм (консольная схема по mounting note TE) — контакт идёт через клеммы выводов, плёнка не пережимается в зоне деформации, свободная длина сохраняет расчётный резонанс консоли."
  - file: реальные данные/изделия/сенсоры/pezo-mems/часть_pezo-mems_mounting/_index.md
    url: https://www.mdpi.com/2072-666X/10/9/589
    source_note: "Yang et al., Micromachines 2019 — резонансный AlN тонкоплёночный MEMS на (100) Si с 300 нм SiO2, резонанс 24.66 кГц"
    material: ss_aisi_304
    dims: 16,16,4
    mass: 0.01
    share: 0.02
    standards: "IPC-A-610;ISO 2768-m"
    desc: "Чип-керриер AlN-на-Si резонатора (кристалл (100) Si c 300 нм SiO2 и AlN-плёнкой, резонанс 24.66 кГц по Yang 2019): стальная обойма AISI 304 16×16×4 мм с гнездом 10×10 мм, кавитационным углублением под нижний электрод и выводами к pad-рамке. Масса ≈10 г (2% номинала 0.5 кг)."
    principle: "Кристалл клеится в гнездо обоймы эпоксидной точкой минимального модуля — задняя поверхность Si остаётся свободной (резонанс затухает через заделку); обойма отводит тепло и даёт жёсткую опорную плоскость без натяга тонкой пластины."
  - file: реальные данные/изделия/сенсоры/pezoelektricheskie_mems/часть_pezoelektricheskie_mems_mounting/_index.md
    url: https://media.digikey.com/pdf/Data%20Sheets/Vesper%20Tech/VM3000_DS_Prelim.pdf
    source_note: "Vesper VM3000 datasheet — пьезо-MEMS микрофон, корпус 3.5×2.65×1.3 мм, цифровая выдача"
    material: al_6061-t6
    dims: 30,20,5
    mass: 0.012
    share: 0.024
    standards: "IPC-2221;ISO 4762 (M2)"
    desc: "Отладочная рама пьезо-MEMS микрофона (Vesper VM3000, корпус 3.5×2.65×1.3 мм): алюминиевая плита 30×20×5 мм с углублением под breakout-плату, акустическим портом Ø0.8 мм над мембраной и 2× винтами M2. Масса ≈12 г (2.4% номинала 0.5 кг)."
    principle: "Порт над мембраной выполнен в плите с резонансной полостью 5 мм — пьезоэлемент VM3000 нечувствителен к частицам и влаге (по datasheet), поэтому герметизация не нужна, а рама только держит постоянный акустический импеданс входа."
  - file: реальные данные/изделия/сенсоры/pmut/часть_pmut_mounting/_index.md
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4431219
    source_note: "Qiu et al., IEEE Trans. UFFC 2015 (PMC4431219) — pMUT-массивы до 320 мембран Ø80 µm, согласование импеданса через интерфейсную пластину"
    material: ss_aisi_304
    dims: 20,20,6
    mass: 0.015
    share: 0.03
    standards: "IPC-A-610;ISO 2768-m"
    desc: "Керриер pMUT-массива (чип до 320 мембран Ø80 µm по Qiu 2015): стальная плита AISI 304 20×20×6 мм с гнездом 12×12 мм, сквозным акустическим окном Ø10 мм и контактными площадками под проводную балку. Масса ≈15 г (3% номинала 0.5 кг)."
    principle: "Массив смотрит мембранами в акустическое окно керриера — среда излучения не экранируется корпусом; стальная плита гасит паразитные колебания кристалла и выравнивает тепловое поле, мембраны работают в свободном резонансе."
  - file: реальные данные/изделия/сенсоры/akusticheskaya_linza/часть_akusticheskaya_linza_mounting/_index.md
    url: https://www.mdpi.com/2072-666X/12/11/1315
    source_note: "Wang et al., Micromachines 2021 — ультразвуковой излучатель 5 МГц Ø25 мм с линзой f#=0.6, посадка линзы на торец преобразователя"
    material: al_6061-t6
    dims: 33,33,8
    mass: 0.014
    share: 0.028
    standards: "ISO 4762 (M3);Wang 2021 interface"
    desc: "Обойма акустической линзы (линза на излучателе 5 МГц Ø25 мм, f#=0.6 по Wang 2021): алюминиевое кольцо 33×33×8 мм с бортом Ø25.2 мм, 3× пружинными лепестками и винтами M3; прокладка из EPDM по торцу. Масса ≈14 г (2.8% номинала 0.5 кг)."
    principle: "Линза центрируется бортом и прижимается лепестками к торцу преобразователя с контролируемым натягом — акустический контакт обеспечивается гелем под прокладкой; лепестки допускают замену линзы без разюстировки фокуса f#=0.6."
