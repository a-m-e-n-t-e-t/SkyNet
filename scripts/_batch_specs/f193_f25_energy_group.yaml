files:
  - file: реальные данные/изделия/энергетическая/emi-generator/часть_emi-generator_source/_index.md
    url: https://kth.diva-portal.org/smash/record.jsf?pid=diva2:126779
    source_note: "KTH diva-portal (diva2:126779), «Small helical magnetic flux compression generators»: длина 300 мм, Ø70 мм, заряд ВВ 0.27 кг"
    material: copper
    dims: 70,70,300
    mass: 3.0
    share: 0.015
    desc: "Взрывомагнитный геликовый генератор (ВМГ, FCG) — первичный источник импульса ЭМИ-генератора. Референс — малый геликовый ВМГ KTH (три построенных экземпляра): общая длина 300 мм, диаметр 70 мм, заряд ВВ 0.27 кг. Конструкция: медная трубчатая арматура, заполненная ВВ, внутри спиральной статорной обмотки; детонационная волна 7–8 км/с сжимает арматуру от оси и конвертирует химическую энергию в импульс тока. Масса ≈3 кг — оценка (медная арматура + обмотка + ВВ 0.27 кг + торцевые фланцы); доля 1.5% номинала изделия 200 кг."
    principle: "Заряжаемый от конденсаторной банки начальный ток создаёт магнитный поток внутри арматуры; детонация запускается при максимуме тока, конус расширяющейся арматуры замыкает витки статора по мере движения, индуктивность падает в ~100 раз, а сохранённый поток выталкивается в нагрузку — ток нарастает до сотен килоампер за десятки микросекунд. Одноразовое устройство: арматура разрушается после срабатывания."
  - file: реальные данные/изделия/энергетическая/perovskite_tandem/часть_perovskite_tandem_cells/_index.md
    url: https://www.oxfordpv.com/technology
    source_note: "Oxford PV Technology: перовскитный верхний слой наносится на кремниевую тыловую ячейку; на производстве в Бранденбурге используется кремний HJT (гетеропереход)"
    material: si
    dims: 1000,600,0.18
    mass: 0.25
    share: 0.025
    standards: "IEC 61215;IEC 61730"
    desc: "Слой кремниевых тыловых ячеек перовскитно-кремниевого тандемного модуля (подтип Si_ячейки). Референс — Oxford PV: перовскит наносится непосредственно на фронт стандартной кремниевой ячейки, на пилотной линии в Бранденбурге используется кремний HJT-формата (гетеропереход); толщина кремниевых пластин 150–200 мкм (типовая для HJT). Габариты слоя 1000×600×0.18 мм — по площади модуля; кремний объёмом ~108 см³ на 0.6 м² даёт ≈0.25 кг (плотность 2.33 г/см³, с учётом межэлементных зазоров). Материал — монокристаллический кремний (см. материалы/si.md)."
    principle: "Кремниевая тыловая ячейка поглощает длинноволновую (красную) часть спектра, тогда как нанесённый сверху перовскитный слой толщиной несколько сотен нм поглощает синюю; оба перехода включены последовательно, что поднимает КПД модуля до 25% против ~22–23% у лучших чисто кремниевых панелей. Тыловая ячейка несёт и механическую функцию: подложка, на которую осаждаются тонкоплёночные слои перовскита и металлургическая сетка контактов."
  - file: реальные данные/изделия/энергетическая/vysokotemperaturnyi_sverhprovodyaschii_podshipnik/часть_vysokotemperaturnyi_sverhprovodyaschii_podshipnik_cryostat/_index.md
    url: https://www.mdpi.com/2076-0825/11/8/215
    source_note: "Komori M., MDPI Actuators 11(8):215 (2022): сверхпроводящий статор в вакуумной камере 5×10⁻³ Торр из нержавеющей стали, LN2-охлаждение 77 K сверху"
    material: ss_aisi_304
    dims: 170,170,90
    mass: 4.0
    share: 0.4
    desc: "Криостат HTS-подшипника — вакуумная LN2-камера, окружающая YBCO-статор (30×30×15 мм) над магнитным узлом Ø150 мм. Референс — подвесной супермаховик Komori (MDPI Actuators 2022): статор из нержавеющей стали, вакуум 5×10⁻³ Торр (форвакуумный насос), жидкий азот подаётся сверху через нержавеющие трубопроводы, рабочая температура 77 K, зазор ротор-статор 0.75 мм. Габариты 170×170×90 мм — оценка от магнитного узла 150×150×45 мм и корпуса 180×180×120 мм; масса 4.0 кг (40% номинала) включает корпус криостата и заправку LN2 ~0.5 л."
    principle: "Двойная теплоизоляция: вакуумная полость устраняет конвекцию, а полировка нержавеющих стенок снижает лучистый теплоприток; жидкий азот заливается сверху и заполняет полость вокруг YBCO-блоков, удерживая их ниже 77 K в режиме ожидания. Выпарившийся азот уходит через дренаж, при этом ротор магнитного узла вращается в вакууме без контакта с криогенной частью — подшипник левитирует за счёт захвата магнитного потока в охлаждённом сверхпроводнике."
  - file: реальные данные/изделия/энергетическая/mptm/часть_mptm_engine/_index.md
    url: https://www.microgen-engine.com/engines
    source_note: "Microgen Engine Corporation, базовые спецификации: свободнопоршневой Стирлинг-двигатель 50 Гц, макс. 1050 We, Ø300×450 мм без горелки, масса 49 кг без горелки, КПД 26%, ресурс 50 000 ч"
    material: ss_aisi_304
    dims: 300,300,450
    mass: 4.0
    share: 0.4
    desc: "Свободнопоршневой Стирлинг-преобразователь — тепловое ядро модуля MPTM (линейный альтернатор учтён отдельной частью). Референс — Microgen FSE (50 Гц, серийно с 2010 г.): герметично запаянный стальной корпус Ø300×450 мм без горелки, максимальная электрическая мощность 1050 Вт, КПД 26%, расчётный ресурс 50 000 ч без обслуживания; полноразмерный блок весит 49 кг без горелки. В модуле MPTM (номинал 10 кг, выработка 0.1–2 кВт) двигатель — рабочее ядро без корпусной обвязки и горелки: масса 4.0 кг (40% номинала модуля), корпусная обвязка учтена в части housing. Материал корпуса — нержавеющая аустенитная сталь (оценка по классу герметичных FPS-машин; точный сплав Microgen не раскрывает)."
    principle: "Бета-компоновка свободнопоршневого Стирлинга: вытеснитель и силовой поршень не связаны механически — газовый контур (нагреватель → регенератор → охладитель) задаёт фазовый сдвиг ~90°, резонанс пружинных подвесов настраивается на частоту сети 50 Гц; герметичный корпус удерживает рабочее давление гелия, а отсутствие механических соединений и уплотнений скользящего контакта обеспечивает ресурс 50 000 ч."
  - file: реальные данные/изделия/энергетическая/induktivnyi_nakopitel/часть_induktivnyi_nakopitel_cooling/_index.md
    url: https://www.seongwooinst.com/s1/s1_1.php
    source_note: "Sumitomo RDK-101D, спецификация (SHI): GM-криоохладитель, 2-я ступень 0.1 Вт @ 4.2 K, 1-я ступень 3.0 Вт @ 60 K, мин. температура <3.0 K, холодная головка 7.2 кг; габариты головки 351.7×130×226 мм — каталог SHI"
    material: copper
    dims: 351.7,130,226
    mass: 7.2
    share: 0.072
    desc: "Криогенное обеспечение сверхпроводящей катушки (REBCO, 10.8 Т, рабочий ток 380 А — референс BOSSE 1 МДж SMES, охлаждение жидкостногелиевой ванной 4.2 K). Референс охладителя — GM-криоохладитель Sumitomo RDK-101D: холодная головка массой 7.2 кг (приводной узел 1.0 кг), холодопроизводительность 0.1 Вт на второй ступени при 4.2 K и 3.0 Вт на первой при 60 K, минимальная температура <3.0 K, межсервисный интервал 10 000 ч; габариты головки 351.7×130×226 мм по каталогу SHI. Масса части 7.2 кг (7.2% номинала накопителя 100 кг) — холодная головка с медной регенераторной частью."
    principle: "Двухступенчатый цикл Гиффорда—Макмагона: компрессор подаёт осушенный гелий высокого давления на холодную голову, золотниковый клапан периодически расширяет его в камерах вытеснителя; первая ступень (60 K) экранирует теплоприток радиацией, вторая достигает 4.2 K — уровня жидкого гелия, поддерживая конденсацию паров и температуру сверхпроводящей обмотки; медная матрица регенератора накапливает и возвращает тепло рабочего цикла."
  - file: реальные данные/изделия/энергетическая/induktivnyi_nakopitel/часть_induktivnyi_nakopitel_switch/_index.md
    url: https://shop.fellten.com/shop/gv200qa-1-gigavac-500-a-12-800-v-dc-contactor-hyper9-12957
    source_note: "GIGAVAC GV200QA-1 (Sensata): гермозапаянный DC-контактор, 500 А непрерывно, пик до 4000 А, 12–800 В DC, масса 0.5 кг"
    material: copper
    dims: 68,68,100
    mass: 0.5
    share: 0.005
    desc: "Коммутатор заряда/разряда индуктивного накопителя — гермозапаянный DC-контактор. Референс — GIGAVAC GV200QA-1 (Sensata): 500 А непрерывно и пик до 4000 А при 12–800 В DC, SPST нормально-открытый, герметичный корпус, масса 0.5 кг. Рабочий ток катушки накопителя 380 А (референс BOSSE SMES) — контактор выбран с запасом 1.3× по непрерывному току; габариты 68×68×100 мм — оценка по типоразмеру гермозапаянных HVDC-контакторов GV-серии (в открытой спецификации не публикуются). Контактная группа и силовые выводы — медь; герметизация корпуса исключает окисление контактов и работу дуги в атмосфере."
    principle: "Магнитная дутьевая система контактора растягивает дугу размыкания, а герметичная полость с инертной средой гасит её без окисления меди; нормально-открытая SPST-схема держит цепь заряда катушки разомкнутой при потере питания — предохранительная функция при аварийном обесточивании накопителя с энергией ~1 МДж."
