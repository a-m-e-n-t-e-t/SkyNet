files:
  - file: реальные данные/изделия/вычислительная/kondensatory_keramicheskie/часть_kondensatory_keramicheskie_inner_electrodes/_index.md
    url: https://www.jsap.or.jp/jsapi/Pdf/Number08/04_InvitedReviewPaper.pdf
    source_note: "Kishi et al., JSAP Intl 2003 (BME-MLCC): Ni-внутренние электроды, слой 1.8 мкм, 700 слоёв, ко-спекание с BaTiO3"
    material: nickel
    dims: 1.6,1.0,0.4
    standards: "EIA RS-198;AEC-Q200"
    desc: "Стек внутренних электродов BME-MLCC 0805-класса (корпус 2.0×1.25 мм, класс Murata GRM21: 1 мкФ, 50 В, X7R): никелевые электроды наносятся трафаретной печатью (паста из мелкодисперсного Ni-порошка) на зелёные BaTiO3-плёнки и чередуются с диэлектрическими слоями толщиной ~1–10 мкм (Kishi et al., 2003: слой 1.8 мкм × 700 слоёв для X7R 100 мкФ; ультратонкие промышленные BME-слои ~1 мкм и менее). Footprint электродного стека ~1.6×1.0 мм (корпус 2.0×1.25 минус поля под терминацию), суммарная высота стека ~0.4 мм; сотни чередующихся слоёв задают ёмкость. Ко-спекание при 1150–1300 °C в восстановительной атмосфере (N2/H2) предотвращает окисление Ni."
    principle: "Внутренние электроды образуют параллельную систему противоэлектродов, задающую ёмкость MLCC: C = ε0·εr·N·A/d, где N — число слоёв (сотни), A — активная площадь электрода, d — толщина диэлектрического слоя. Никель выбран как base-metal вместо драгметалльной пары Pd/Ag (PME): на порядки дешевле и совместим с восстанавливающим обжигом BME-диэлектрика — редкоземельное легирование BaTiO3 (Dy/Ho/Y) и акцепторные добавки (Mn, Mg) компенсируют дефектность, возникающую при спекании в контакте с Ni. Каждый слой выводится на противоположные торцы, где гальванически связывается с Cu-терминацией через Ni-барьер."
  - file: реальные данные/изделия/вычислительная/kondensatory_keramicheskie/часть_kondensatory_keramicheskie_ceramic_layers/_index.md
    url: https://www.tme.eu/rs/en/details/gcg21br71h105ma01k/mlcc-smd-capacitors/murata
    source_note: "Murata GRM21-класс (0805, 2.0×1.25 мм): 1 мкФ 50 В X7R (GCG21BR71H105MA01K, TME); X7R-диэлектрик на легированном BaTiO3"
    material: batio3
    standards: "EIA RS-198 (X7R);AEC-Q200"
    desc: "Диэлектрические слои MLCC 0805-класса (2.0×1.25 мм, класс Murata GRM21: 1 мкФ, 50 В): X7R-диэлектрик на легированном BaTiO3 (Dy/Ho/Y-оксиды, Mg, Si, Mn — core-shell BME-структура), εr ~3000, ΔC/C ±15 % в −55…+125 °C (EIA RS-198, класс II). Слои толщиной ~1–10 мкм чередуются с Ni-внутренними электродами и ко-спекаются при 1150–1350 °C в восстановительной атмосфере (NASA NTRS 20150004115: типовое ко-спекание ~1350 °C). Номинал части: εr 3000, V_max 50 В (канон)."
    principle: "Сегнетоэлектрическая поляризация тетрагонального BaTiO3 (P4mm, спонтанная поляризация 0.15–0.26 C/m²) обеспечивает высокую диэлектрическую проницаемость керамики; ёмкость MLCC C = ε0·εr·N·A/d набирается сотнями тонких слоёв между Ni-электродами. Core-shell микроструктура (легированные оболочки вокруг BaTiO3-ядра) сглаживает температурную зависимость εr до класса X7R и делает диэлектрик совместимым с Ni-электродами в восстановительном обжиге: оболочка подавляет восстановление титана и миграцию кислородных вакансий под постоянным смещением. X7R — рабочая керамика для развязки и фильтрации в диапазоне −55…+125 °C."
