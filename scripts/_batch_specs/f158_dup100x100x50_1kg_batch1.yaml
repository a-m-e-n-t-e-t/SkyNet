  - file: реальные данные/изделия/энергетическая/asrg/часть_asrg_regenerator/_index.md
    url: https://ntrs.nasa.gov/api/citations/20080047351/downloads/20080047351.pdf
    source_note: "Wong et al. (NASA NTRS 2008) — Advanced Stirling Convertor: КПД 38%, масса конвертора 1.3 кг, регенератор — пористая матрица на пути рабочего тела"
    material: ss_aisi_304
    dims: 45,45,25
    mass: 0.18
    share: 0.0075
    standards: "NASA NTRS 20080047351;ISO 4115 (металлический фетр)"
    desc: "Регенератор Стирлинг-конвертора ASRG (конвертор класса NASA ASC: 1.3 кг, КПД 38% по Wong 2008): кольцевая пористая матрица из спечённого нержавеющего фетра 316L/304 45×45×25 мм, пористость ~85%, зажата между горячим и холодным теплообменниками. Масса ≈180 г (0.75% номинала 24 кг)."
    principle: "Рабочее тело проходит сквозь поровую матрицу: при сжатии газ отдаёт тепло стенкам пор, при расширении возвращает — регенерация замыкает внутренний цикл и отвечает за основную долю КПД; аксиальный градиент 650→80 °C держится на тонкой матрице, поэтому нужна нержавейка с низкой теплопроводностью вдоль оси."
  - file: реальные данные/изделия/энергетическая/elektromagnitnye_poroshkovye_mufty_i_tormoza/часть_elektromagnitnye_poroshkovye_mufty_i_tormoza_coil/_index.md
    url: https://dl.mitsubishielectric.co.jp/dl/fa/document/catalog/clutch/sh-170030eng/sh170030eng-a.pdf
    source_note: "Mitsubishi Electric magnetic particle clutch/brake catalog SH-170030ENG — катушка возбуждения без тока муфта расцеплена, момент линеен по току"
    material: mednyi_provod
    dims: 120,40,50
    mass: 0.8
    share: 0.16
    standards: "Mitsubishi SH-170030ENG;IEC 60317 (обмоточный провод)"
    desc: "Катушка возбуждения порошковой муфты (муфта 5 кг класса Mitsubishi SH-170030, момент линеен по току возбуждения): кольцевая обмотка 120×40×50 мм из медного обмоточного провода ПЭТВ-2 в пазу магнитопровода. Масса ≈800 г (16% номинала 5 кг)."
    principle: "Ток катушки создаёт аксиальный поток через рабочий зазор с магнитным порошком — цепочки частиц связывают ведущую и ведомую полумуфты, момент растёт практически линейно с током до насыщения магнитопровода; обмотка работает в режиме S1 с перегревом, ограниченным классом изоляции провода."
  - file: реальные данные/изделия/энергетическая/perovskite_tandem/часть_perovskite_tandem_encapsulant/_index.md
    url: https://www.nrel.gov/docs/fy25osti/89857.pdf
    source_note: "Witteck et al. (NREL 2024) — инкапсуляция перовскитных ячеек пероксидно-сшитой EVA (материал Si-PV индустрии), спад PCE 2–3%"
    material: etfe
    dims: 1000,600,0.5
    mass: 0.45
    share: 0.045
    standards: "NREL 89857 (2024);IEC 61215"
    desc: "Инкапсулянтная плёнка перовскитного тандемного модуля (панель 10 кг, ламинат стекло-плёнка-стекло; режим пероксидно-сшитой EVA/POE по NREL 2024, химстойкая альтернатива — фторполимерная плёнка): лист ETFE 1000×600×0.5 мм поверх стекольного слоя тандема. Масса ≈450 г (4.5% номинала 10 кг)."
    principle: "Плёнка диффузионно замыкает перовскитный стек от влаги и кислорода — именно водный перенос деградирует перовскит (стратегия edge-seal с осушителем по Wang 2022), фторполимерная поверхность ETFE держит УФ и гидролиз, а прозрачность в диапазоне 350–1100 нм не режет верхний перовскитный и нижний кремниевый субэлементы тандема."
  - file: реальные данные/изделия/энергетическая/planetarnye_rolikovintovye_elektroprivody_s_neodimovymi_magnitami/часть_planetarnye_rolikovintovye_elektroprivody_s_neodimovymi_magnitami_nut/_index.md
    url: https://www.schaeffler.com/remotemedien/media/_shared_media/08_media_library/01_publications/schaeffler_2/tpi/downloads_8/tpi_291_de_en.pdf
    source_note: "Schaeffler TPI 291 — планетарные роликовинтовые передачи: гайки и ролики из сквознозакаливаемой подшипниковой стали 100Cr6"
    material: 100cr6
    dims: 60,60,40
    mass: 0.9
    share: 0.18
    standards: "Schaeffler TPI 291;DIN 17230 (100Cr6)"
    desc: "Гайка планетарной роликовой передачи (привод 5 кг класса Schaeffler RVP, гайки/ролики из сквознозакаливаемой стали 100Cr6 по TPI 291): корпусная гайка 60×60×40 мм с резьбовыми дорожками и окнами сепаратора роликов, твёрдость 58–62 HRC. Масса ≈900 г (18% номинала 5 кг)."
    principle: "Резьбовые дорожки гайки обкатываются сателлитными роликами, распределяющими нагрузку на несколько витков — контактные напряжения Герца держатся закалённой поверхностью 100Cr6, а сквозная закалка сохраняет сердцевину вязкой под изгибающими нагрузками фланца."
  - file: реальные данные/изделия/энергетическая/planetarnye_rolikovintovye_elektroprivody_s_neodimovymi_magnitami/часть_planetarnye_rolikovintovye_elektroprivody_s_neodimovymi_magnitami_screw/_index.md
    url: https://www.schaeffler.com/remotemedien/media/_shared_media/08_media_library/01_publications/schaeffler_2/tpi/downloads_8/tpi_291_de_en.pdf
    source_note: "Schaeffler TPI 291 — 100Cr6 для гаек и роликов; винт также из 100Cr6 при повышенных температурах эксплуатации"
    material: 100cr6
    dims: 400,20,20
    mass: 1.0
    share: 0.2
    standards: "Schaeffler TPI 291;DIN 17230 (100Cr6)"
    desc: "Винт планетарной роликовой передачи (привод 5 кг, шпиндель Ø20 мм, ход 400 мм; материал 100Cr6 по Schaeffler TPI 291 с возможностью применения при повышенной температуре): шлифованный винт 400×20×20 мм с многозаходной резьбой. Масса ≈1.0 кг (20% номинала 5 кг)."
    principle: "Винт вращается внутри планетарной системы роликов, преобразуя момент в осевое усилие: шаг многозаходной резьбы задаёт передаточное отношение, а соосность шлифованной поверхности (<10 мкм биения) определяет равномерность распределения нагрузки между роликами и ресурс пары трения."
  - file: реальные данные/изделия/энергетическая/svintsovo-kislotnye_akb/часть_svintsovo-kislotnye_akb_case/_index.md
    url: https://www.battery-component.com/lead-acid-battery-container.html
    source_note: "Производитель контейнеров свинцово-кислотных АКБ — корпус 12 В делится на 6 ячеек (по ряду формы кубика для льда), крышка сваривается"
    material: uhmwpe_dyneema
    dims: 240,175,190
    mass: 1.0
    share: 0.0667
    standards: "battery-component.com Container Spec;IEC 60095-2"
    desc: "Корпус свинцово-кислотной АКБ 12 В (батарея 15 кг, класс 40–45 Ач с габаритами контейнера ~240×175×190 мм; серийные корпуса из PP с 6 ячейками по battery-component.com): контейнер 240×175×190 мм из химстойкого сверхвысокомолекулярного полиэтилена с 6-секционной перегородкой. Масса ≈1.0 кг (6.7% номинала 15 кг)."
    principle: "Контейнер держит электролит (раствор H₂SO₄ плотностью 1.28 г/см³) и механику батареи: полиолефиновая стенка инертна к серной кислоте при 60 °C, шестисекционная перегородка разводит последовательно соединённые ячейки и не даёт мостикам шлама замкнуть пластины, а уплотнение крышки тепловым свариванием исключает подтёки электролита."
  - file: реальные данные/изделия/энергетическая/vysokotemperaturnyi_sverhprovodyaschii_podshipnik/часть_vysokotemperaturnyi_sverhprovodyaschii_podshipnik_shaft/_index.md
    url: https://www.magneticbearings.org/app/uploads/publications/ismb7/ismb7_submission_101.pdf
    source_note: "Werfel et al. (ISMB7) — сверхпроводящий магнитный подшипник: ротор с постоянными магнитами левитирует над YBCO-кольцами статора"
    material: ss_aisi_304
    dims: 42,42,150
    mass: 1.2
    share: 0.12
    standards: "Werfel ISMB7;ASTM A240 (AISI 304)"
    desc: "Вал ВТСП магнитного подшипника (узел 10 кг: статор из YBCO-колец, ротор с кольцами NdFeB по Werfel ISMB7): немагнитный вал Ø42×150 мм из аустенитной нержавеющей стали AISI 304 с посадочными поясками под магнитные кольца. Масса ≈1.2 кг (12% номинала 10 кг)."
    principle: "Вал несёт кольца NdFeB ротора, левитирующие над криогенными YBCO-кольцами за счёт захваченного магнитного потока — вал должен быть немагнитным (аустенитная 304), иначе собственное поле ротора замкнётся через вал и разрушит левитационный зазор; посадочные пояски держат сегменты магнитов от сползания при термоциклировании."
  - file: реальные данные/изделия/энергетическая/zeno_power_am-241/часть_zeno_power_am-241_shielding/_index.md
    url: https://www.zenopower.com/tech
    source_note: "Zeno Power — Am-241 РИТЭГ для лунных миссий NASA: novel fuel and shielding system для высокой удельной мощности америция-241"
    material: w-ni-fe
    dims: 45,45,30
    mass: 1.0
    share: 0.5
    standards: "Zeno Power Tech;ISO 2919 (герметичные источники)"
    desc: "Радиационная защита генератора Zeno Power (модуль 2 кг на Am-241, телепорт 60 кэВ требует плотного вольфрамового экрана; Zeno строит Am-241 Стирлинг-генератор для лунных миссий NASA): блок из тяжёлого сплава ВНЖ (W-Ni-Fe, плотность ~17 г/см³) 45×45×30 мм вокруг капсулы источника. Масса ≈1.0 кг (50% номинала 2 кг)."
    principle: "Гамма-линия Am-241 (59.5 кэВ) ослабляется по экспоненте: 30 мм вольфрамового сплава снижают дозу на порядок больше, чем сталь той же толщины (кратность ослабления растёт с плотностью и Z), поэтому экран занимает до половины массы модуля, а слои Ni-Fe матрицы дают сплаву вязкость и обрабатываемость чистого вольфрама."
