    source_note: "Siewert (CERN, 2014) — IPG YLS CW fiber laser module 332×532×52 мм, 11 кг; посадка модуля на направляющие корпуса"
    material: al_6061-t6
    dims: 100,40,6
    mass: 0.03
    share: 0.06
    standards: "ISO 4762 (M4);IPG Mechanical Interface"
    desc: "Направляющий кронштейн CW-лазерного модуля (модуль класса IPG YLS 332×532×52 мм, 11 кг по CERN): алюминиевый профиль 100×40×6 мм с Т-пазом 8 мм под посадочную планку модуля и 2× винтами M4. Масса ≈30 г (6% номинала 0.5 кг)."
    principle: "Модуль скользит по Т-пазу до упора и фиксируется по штатным резьбовым точкам днища — направление ввода волокна сохраняется при съёме; профиль разгружает волоконные разъёмы от изгибающего момента корпуса."
