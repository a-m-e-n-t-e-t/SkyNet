    source_note: "IPG YLS-10000-ECO datasheet — корпус 1004×806×806 мм, масса 410–440 кг, шасси на установочных опорах"
    material: stal_st3
    dims: 150,45,6
    mass: 0.032
    share: 0.064
    standards: "ISO 4762 (M6);IPG Installation Manual"
    desc: "Опорная шина шасси YLS-ECO (корпус лазера 1004×806×806 мм, 410–440 кг по datasheet, масштаб 1:1 модуля 0.5 кг): стальная шина Ст3 150×45×6 мм с двумя пазами под установочные ножки и отверстиями M6. Масса ≈32 г (6.4% номинала 0.5 кг)."
    principle: "Ножки шасси входят в пазы шины и стягиваются M6 — опора не допускает сдвига корпуса при вибрации и выдерживает осевую нагрузку лазера; сталь выбрана под жёсткость на изгиб при минимальной высоте посадки."
