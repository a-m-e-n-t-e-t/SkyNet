    material: becu
    dims: 20,15,5
    mass: 0.012
    share: 0.024
    standards: "ASTM B194 (BeCu);Thorlabs Mounting Note"
    desc: "Зажим D-mount QCL (корпус Thorlabs 12.0×4.5×2.8 мм): клемма из бериллиевой меди BeCu C17200 20×15×5 мм с лыской под D-корпус, пружинным прижимом и пайкой термисторных выводов. Масса ≈12 г (2.4% номинала 0.5 кг)."
    principle: "D-корпус ложится в лыску и стягивается пружинной ветвью клеммы — BeCu (σ≈130–210 Вт/м·К, пружинные свойства по ASTM B194) работает одновременно теплоотводом активатора и контактным прижимом без термомеханического натяга чипа."
  - file: реальные данные/изделия/сенсоры/ultrakorotkoimpulsnye_lazery/часть_ultrakorotkoimpulsnye_lazery_mounting/_index.md
    url: https://www.coherent.com/content/dam/coherent/site/en/resources/datasheet/lasers/monaco-1035-ds.pdf
    source_note: "Coherent Monaco 1035 datasheet — фемтосекундный лазер 280 fs–10 ps, корпус 377.8 мм, 70 кг (154 lbs), одно-боксовый дизайн"
    material: al_6061-t6
    dims: 240,50,8
    mass: 0.035
    share: 0.07
    standards: "ISO 4762 (M5);Coherent Integration Guide"
    desc: "Ребристая посадочная плита фемтосекундного лазера (корпус Monaco-класса длиной 377.8 мм, 70 кг по datasheet, масштаб модуля 0.5 кг): алюминиевая плита 240×50×8 мм с продольными рёбрами жёсткости и 4× резьбовыми M5 под штатные лапы лазера. Масса ≈35 г (7% номинала 0.5 кг)."
    principle: "Лапы лазера фиксируются к плите через M5 с контролируемым моментом — рёбра держат плоскостность базовой линии (<0.1 мм на 240 мм), критичную для юстировки расширителя пучка; плита изолирует резонатор от коробления несущей рамы."
  - file: реальные данные/изделия/сенсоры/flir_lwir_2/часть_flir_lwir_2_mounting/_index.md
