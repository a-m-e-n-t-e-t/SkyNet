    source_note: "Sierra-Olympia/X20 M2 drone gimbal — полностью закрытая гиростабилизированная EO/IR платформа 160 г, посадка на деку дронa"
    material: al_6061-t6
    dims: 70,40,5
    mass: 0.016
    share: 0.032
    standards: "ISO 4762 (M3);X20 Mounting Guide"
    desc: "Деку-пластина EO/IR гиро-платформы (гимбал M2-класса 160 г, полностью закрытый по X20): алюминиевая плита 70×40×5 мм с демпферными подвесами M3 под 4× виброопоры гимбала и монтажными пазами 30 мм. Масса ≈16 г (3.2% номинала 0.5 кг)."
    principle: "Гимбал висит на 4× демпферных подвесах через деку — виброопоры отсекают моторные вибрации дронa от стабилизатора камеры; пазы позволяют смещать центр масс платформы под балансировку, не пересверливая посадку."
