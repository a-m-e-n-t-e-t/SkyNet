files:
  - file: реальные данные/изделия/каркас/hktank/часть_hk_tank_двигатель/_index.md
    material: inconel_718_turbine
    dims: 1600,1020,710
    mass: 1134.0
    share: 0.0167
    standards: "MIL-STD-810H;MIL-E-5007D"
    desc: "Газотурбинный двигатель AGT1500 (Honeywell/Avco-Lycoming) — 1500 л.с., двухвальный осецентробежный турбокомпрессор с рекуператором. Аналог энергоблока HKTank: габариты и масса по datasheet Honeywell (1.6×1.02×0.71 м, 1134 кг)."
    principle: "Двухвальная газовая турбина с рекуперативным теплообменником: воздух → компрессор → рекуператор → камера сгорания → турбины (HP+LP) → выхлоп. Топливо — JP-8/дизель, расход ~3 L/км на 68-тонном шасси."
  - file: реальные данные/изделия/каркас/hktank/часть_hk_tank_башня/_index.md
    material: rha_steel_class_b
    dims: 3400,2400,1100
    mass: 18000.0
    share: 0.264
    standards: "MIL-DTL-12560K"
    desc: "Башня MBT на базе M1A2: лобовая композитная броня (Chobham/DU-усиленный модуль), борта из RHA Class B толщиной 80 мм. Башня вращается на 360°, несёт 120-мм орудие M256."
    principle: "Сварная конструкция из катаных бронеплит RHA Class B, лобальная секция — модульная композитная броня 3-го поколения (сталь+керамика+обеднённый уран)."
  - file: реальные данные/изделия/каркас/hktank/часть_hk_tank_корпус/_index.md
    material: rha_steel_class_a
    dims: 9800,3700,2400
    mass: 28000.0
    share: 0.412
    standards: "MIL-DTL-12560K"
    desc: "Корпус M1A2 Abrams MBT: длина 9.78 м, ширина 3.66 м, высота 2.44 м. Сварная конструкция из катаной гомогенной брони (RHA) Class A, лобальная композитная броня."
    principle: "Сварной корпус из бронеплит RHA Class A толщиной 60–120 мм с композитными вкладышами (сталь+керамика). Внутреннее антирикошетное покрытие."
  - file: реальные данные/изделия/каркас/hktank/часть_hk_tank_гусеница_левая/_index.md
    material: steel_track_links_t158
    dims: 4900,760,180
    mass: 2200.0
    share: 0.032
    standards: "MIL-DTL-11821"
    desc: "Левая гусеница M1A2 Abrams: 158 обрезиненных траков T158, ширина 635 мм (25 дюймов), длина 4.9 м. Стальные звенья с резинометаллическими шарнирами."
    principle: "Сборная гусеница из стальных траков T158 с обрезиненной беговой дорожкой и резинометаллическими шарнирами. Приводится звёздочкой — гусеница образует замкнутый контур с поддерживающими катками."
  - file: реальные данные/изделия/каркас/hktank/часть_hk_tank_навигация/_index.md
    material: gps_ins_an_vsn_8
    dims: 280,220,140
    mass: 14.0
    share: 0.0002
    standards: "MIL-STD-810H;STANAG 4294"
    desc: "Инерциально-спутниковая навигационная система: AN/VSN-8 PLGR + инерциальный блок Honeywell HG1700 (RLG). Габариты блока управления по военным спецификациям."
    principle: "Сплав инерциальной навигации (кольцевой лазерный гироскоп HG1700, точность 1 nm/h CEP) и GPS-приёмника P(Y)-код (AN/VSN-8 PLGR). Фильтр Калмана объединяет данные в realtime."
  - file: реальные данные/изделия/каркас/hktank/часть_hk_tank_связь/_index.md
    material: rt_1523_sincgars
    dims: 380,260,180
    mass: 18.0
    share: 0.0003
    standards: "MIL-STD-810H;MIL-STD-461G"
    desc: "Связной модуль: радиостанция RT-1523 SINCGARS (30–88 МГц, FH) + терминал EPLRS для сетевой связи. Корпус из литого алюминия 6061-T6."
    principle: "Тактический радиомост SINCGARS с псевдослучайной перестройкой частоты (FH) + EPLRS для пакетной передачи данных. Антенны вынесены на крышу башни."
  - file: реальные данные/изделия/каркас/hktank/часть_hk_tank_сенсоры/_index.md
    material: raytheon_an_vlg8_flir
    dims: 520,420,310
    mass: 45.0
    share: 0.0007
    standards: "MIL-STD-810H;MIL-STD-461G"
    desc: "Сенсорный блок: тепловизионная система второго поколения Raytheon AN/VLG-8 (FLIR) + лазерный дальномер Eyesafe LRF. Корпус из литого алюминия с термоэлектрическим охлаждением HgCdTe-матрицы."
    principle: "FLIR 2-го поколения (HgCdTe-матрица 480×4, охлаждаемая до 77 K) + лазерный дальномер (1.54 мкм, eyesafe) + камера TV-канала. Стереоскопическое слияние каналов в боевой вычислитель."
  - file: реальные данные/изделия/каркас/hktank/часть_hk_tank_боеприпасы/_index.md
    material: m829a4_apfsds
    dims: 980,150,150
    mass: 22.0
    share: 0.0003
    standards: "MIL-STD-810H;MIL-DTL-6360"
    desc: "Боекомплект: 42 выстрела 120-мм (M829A4 APFSDS-T, M830A1 HEAT-MP, M1028 canister). Расчётная масса одной M829A4 — 22 кг, длина 980 мм. Боеукладка в кормовой части башни с системой изоляции (blowout panels)."
    principle: "M829A4 — оперённый бронебойный подкалиберный снаряд (APFSDS-T), урановый пенетратор диаметром 22 мм, начальная скорость 1700 м/с. M830A1 — кумулятивный с программным взрывателем. Боеукладка с отделением экипажа бронированной панелью и blowout-клапанами."
