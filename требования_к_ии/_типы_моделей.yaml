# SkyNet Model Types — канонический реестр 7 типов моделей
# v9.23: расширено — для каждого типа определён subset из 13 подсистем
# (обязательные / опциональные / неприменимые)
# Источник: гипотезы пользователя → архитектурные доработки v9.22 + v9.23
# Читается: classify_subsystem.py, pre-commit-hook.py (для F75, F79, F80 валидации)
# Связано: §11.0, §11.0.5 (матрица), §11.6 (многослойная броня), F19, F71-F80

version: 1.9
prompt_version: 9.31
last_updated: 2026-11-03

# Канонический enum типов моделей
types_count: 7
fallback: "прочее"

# 13 канонических подсистем (для справки)
all_subsystems:
  - вычислительная
  - энергетическая
  - каркас
  - броня
  - маскировка
  - встроенное_оружие
  - сенсоры
  - приводная_система
  - система_связи
  - навигация
  - система_охлаждения
  - система_питания
  - система_передвижения

types:
  - id: гуманоидный
    name: "Гуманоидный"
    # v9.24 НОВОЕ: подтип_модели для exempt
    subtypes:
      - id: стандартный
        name: "Стандартный гуманоид"
        exempt_subsystems: []
      - id: жидкий_металл
        name: "Жидкий металл (T-1000, T-X)"
        exempt_subsystems: [каркас, броня, приводная_система, система_передвижения]
        # T-1000/T-X — liquid metal, не нуждаются в каркасе/броне
    description: "Бипедальная конструкция, антропоморфное движение"
    canon_examples: ["T-70", "T-600", "T-800", "T-850", "T-888", "T-900", "T-X", "T-3000", "Marcus", "Cameron"]
    
    # v9.23 НОВОЕ: тип-специфичный subset 13 подсистем
    required_subsystems:  # mandatory (F79 проверяет)
      - вычислительная
      - энергетическая
      - каркас
      - броня
      - сенсоры
      - приводная_система    # bipedal сервоприводы
      - система_связи
      - навигация            # IMU
      - система_питания
      - система_передвижения # ноги (≥2)
    optional_subsystems:    # могут присутствовать
      - маскировка
      - встроенное_оружие
      - система_охлаждения
    not_applicable_subsystems: []  # для гуманоидного все 13 потенциально применимы
    
    specific_fields:
      число_конечностей: {min: 2, type: int}
      рост_см: {type: float, range: [120, 250]}
      масса_кг: {type: float, range: [50, 500]}
    center_of_gravity:
      rule: "55-65% роста от стоп"
      metric: F19
      blocking: true
    armor_layers_min: 3
    armor_max_mass_percent: 30
  
  - id: воздушный
    name: "Воздушный"
    description: "Крылья/роторы, аэродинамические поверхности, лёгкая броня"
    canon_examples: ["HK-Aerial", "HK-Drone", "Aerostat", "Aerostat_bomber"]
    
    required_subsystems:
      - вычислительная
      - энергетическая
      - каркас
      - броня
      - маскировка          # RCS критично
      - сенсоры
      - приводная_система    # actuators для рулей
      - система_связи
      - навигация            # аэро IMU
      - система_охлаждения   # avionics
      - система_питания
      - система_передвижения # крылья/роторы
    optional_subsystems:
      - встроенное_оружие
    not_applicable_subsystems: []  # все 13 потенциально применимы
    
    specific_fields:
      размах_крыльев_м: {type: float}
      полётный_вес_кг: {type: float}
      ceiling_м: {min: 5000, type: float}
    center_of_gravity:
      rule: "25-30% MAC (Mean Aerodynamic Chord)"
      metric: F19
      blocking: true
    armor_layers_min: 2
    armor_max_mass_percent: 15
  
  - id: наземный_гусеничный
    name: "Наземный гусеничный"
    description: "Гусеничный ход, тяжёлая броня (4-5 слоёв), дизель/RTG энергетика"
    canon_examples: ["T-1", "T-20", "T-200", "T-300", "T-400", "T-500", "T-600_early"]
    
    required_subsystems:
      - вычислительная
      - энергетическая
      - каркас
      - броня                 # тяжёлая
      - сенсоры
      - приводная_система     # гусеничный привод
      - система_связи
      - навигация             # рельеф
      - система_питания
      - система_передвижения  # гусеницы
    optional_subsystems:
      - маскировка
      - встроенное_оружие
      - система_охлаждения
    not_applicable_subsystems: []
    
    specific_fields:
      длина_гусеницы_м: {type: float}
      клиренс_мм: {min: 300, type: float}
      удельное_давление_кПа: {type: float, range: [50, 150]}
    center_of_gravity:
      rule: "≤60% высоты от земли"
      metric: F19
      blocking: true
    armor_layers_min: 4
    armor_max_mass_percent: 50
  
  - id: наземный_колёсный
    name: "Наземный колёсный"
    description: "Колёсная база (4-6 колёс), средняя броня, манёвренность"
    canon_examples: ["T-100", "T-202", "T-204", "T-400_wheeled"]
    
    required_subsystems:
      - вычислительная
      - энергетическая
      - каркас
      - сенсоры
      - приводная_система    # колёсный привод
      - система_связи
      - навигация
      - система_питания
      - система_передвижения # колёса
    optional_subsystems:
      - броня                 # средняя — опциональна
      - маскировка
      - встроенное_оружие
      - система_охлаждения
    not_applicable_subsystems: []
    
    specific_fields:
      число_осей: {min: 2, max: 4, type: int}
      колёсная_формула: {type: string, examples: ["4x4", "6x6", "8x8"]}
      радиус_поворота_м: {type: float}
    center_of_gravity:
      rule: "≤50% высоты"
      metric: F19
      blocking: true
    armor_layers_min: 3
    armor_max_mass_percent: 40
  
  - id: водный_надводный
    name: "Водный надводный"
    description: "Надводный корабль, винт/подвесной мотор, IP69K, метацентр 50-200mm"
    canon_examples: ["Hydrobot_surface", "MK-Naval"]
    
    required_subsystems:
      - вычислительная
      - энергетическая
      - каркас
      - броня                 # с антикоррозийным внешним
      - сенсоры
      - приводная_система     # винт/мотор
      - система_связи
      - навигация             # морская
      - система_питания
      - система_передвижения  # винт
    optional_subsystems:
      - маскировка
      - встроенное_оружие
      - система_охлаждения
    not_applicable_subsystems: []
    
    specific_fields:
      водоизмещение_т: {type: float}
      осадка_м: {type: float}
      скорость_узлов: {type: float}
    center_of_gravity:
      rule: "метацентрическая высота 50-200 mm"
      metric: F19
      blocking: true
    armor_layers_min: 4
    armor_max_mass_percent: 30
    armor_notes: "Внешний слой — антикоррозийный (сталь с покрытием)"
  
  - id: водный_подводный
    name: "Водный подводный"
    description: "Подводная лодка, гребной винт/водомёт, гермокамера, SONAR"
    canon_examples: ["Hunter-Killer_Submarine", "MK-Sub"]
    
    required_subsystems:
      - вычислительная
      - энергетическая       # AIP/RTG
      - каркас               # прочный корпус
      - броня
      - маскировка           # SONAR stealth критично
      - сенсоры
      - приводная_система    # гребной винт/водомёт
      - система_связи
      - навигация            # SONAR
      - система_охлаждения   # для реактора
      - система_питания
      - система_передвижения # гребной винт
    optional_subsystems:
      - встроенное_оружие
    not_applicable_subsystems: []
    
    specific_fields:
      рабочая_глубина_м: {min: 100, type: float}
      прочность_корпуса_м: {type: float}
      экипаж_чел: {type: int, range: [0, 50]}
    center_of_gravity:
      rule: "CG ниже центра плавучести"
      metric: F19
      blocking: true
    armor_layers_min: 4
    armor_max_mass_percent: 35
    armor_notes: "Давление воды → критично для гермокамеры"
  
  - id: стационарный
    name: "Стационарный"
    description: "Неподвижная установка, максимальная защита (5 слоёв), heavy вычисление"
    canon_examples: ["Skynet_Defense_Grid", "Turrets", "Skynet_Core"]
    
    required_subsystems:
      - вычислительная       # heavy
      - энергетическая       # RTG/микрореактор
      - каркас
      - броня               # максимальная
      - сенсоры
      - система_связи       # long-range
      - система_охлаждения  # для реактора/RTG
    optional_subsystems:
      - маскировка
      - встроенное_оружие
      - навигация           # опциональна (не нужна если позиция фиксирована)
      - система_питания     # опциональна (если есть только реактор)
    not_applicable_subsystems:  # v9.23 НОВОЕ: стационарные не двигаются
      - приводная_система    # ❌ стационар не двигается
      - система_передвижения # ❌ стационар не двигается
    
    specific_fields:
      мощность_кВт: {type: float}
      радиус_действия_связи_км: {type: float}
    center_of_gravity:
      rule: "не критичен (стационарная установка)"
      metric: F19
      exempt: true  # стационарные не требуют CG проверки
    armor_layers_min: 5
    armor_max_mass_percent: 100  # не ограничена

# Правила выбора типа (§11.0.3 промпта)
selection_rules:
  - rule: "Если не подходит ни к одному из 7 → 'прочее' (требует объяснения)"
  - rule: "T-1000/T-X (liquid metal) → гуманоидный (визуальная форма), пометка металл_жидкий: true"
  - rule: "Комбинированные модели → основной тип + доп_типы: [<secondary>]"
  - rule: "Стационарный тип exempt от F19 (CG не критичен)"

# Метрики
metrics:
  F74_threshold: 1.0  # соответствие_типа_брони_типу_модели
  F75_threshold: 1.0  # доля_моделей_с_указанным_типом
  F76_threshold: 5000  # ceiling для воздушных (опц.)
  F77_threshold: 300   # клиренс для наземных_гусеничных (опц., мм)
  F78_threshold: 100   # рабочая_глубина для водных_подводных (опц., м)
  # v9.23 НОВОЕ:
  F79_threshold: 1.0  # доля_моделей_с_обязательными_подсистемами_по_типу
  F80_threshold: 1.0  # доля_моделей_без_неприменимых_подсистем
  # v9.24 НОВОЕ:
  F81_threshold: 1.0  # доля_моделей_с_чистой_реализацией_промышленной
  F82_threshold: 1.0  # доля_ссылок_в_реализация_ии_валидны
  F83_threshold: 0.80  # доля_ii_вариантов_изделий
  F84_threshold: 1.0  # доля_параметров_с_WebSearch_до_создания
  F85_threshold: 1.0  # доля_моделей_без_эвристик
  F86_threshold: 1.0  # доля_моделей_с_100%_покрытием_подсистем
  F87_threshold: 1.0  # доля_моделей_с_корректным_статусом_реальности
  # v9.25 НОВОЕ:
  F88_threshold: 1.0  # доля_фантастических_материалов_без_смешения_с_реальными
  # v9.28 НОВОЕ:
  F70i_threshold: 1.0  # доля_коммитов_с_доказательством_вызова_run_all_checks
  # v9.29 НОВОЕ:
  F70j_threshold: 1.0  # _decisions.log существует и непустой
  F90_threshold: 1.0  # гибридные модели имеют маскировку
  # v9.30 НОВОЕ:
  F89_threshold: 0.80  # доля задач выполненных через Issues

# Связь с многослойной бронёй (§11.6)
armor_layer_min_by_type:
  гуманоидный: 3
  воздушный: 2
  наземный_гусеничный: 4
  наземный_колёсный: 3
  водный_надводный: 4
  водный_подводный: 4
  стационарный: 5

# v9.23 НОВОЕ: сводная матрица subset (для быстрого аудита)
subset_matrix:
  # Формат: тип -> {обязательные: [...], опциональные: [...], неприменимые: [...]}
  гуманоидный:
    mandatory_count: 10
    optional_count: 3
    not_applicable_count: 0
  воздушный:
    mandatory_count: 12
    optional_count: 1
    not_applicable_count: 0
  наземный_гусеничный:
    mandatory_count: 10
    optional_count: 3
    not_applicable_count: 0
  наземный_колёсный:
    mandatory_count: 9
    optional_count: 4
    not_applicable_count: 0
  водный_надводный:
    mandatory_count: 10
    optional_count: 3
    not_applicable_count: 0
  водный_подводный:
    mandatory_count: 12
    optional_count: 1
    not_applicable_count: 0
  стационарный:
    mandatory_count: 7
    optional_count: 4
    not_applicable_count: 2  # приводная_система, система_передвижения
