# SkyNet Dependabot config — auto-update dependencies
# v9.21: настройка auto-update для pip и github-actions
# Документация: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/scripts/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Omsk"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "auto-generated"
    assignees:
      - "a-m-e-n-t-e-t"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # v9.21: groups for related packages
    groups:
      yaml:
        patterns:
          - "pyyaml"
          - "ruamel.yaml"
      testing:
        patterns:
          - "pytest"
          - "pytest-cov"
          - "mock"
      http:
        patterns:
          - "requests"
          - "urllib3"
          - "aiohttp"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Omsk"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-generated"
    assignees:
      - "a-m-e-n-t-e-t"
    commit-message:
      prefix: "chore(actions)"
      include: "scope"
    groups:
      checkout-actions:
        patterns:
          - "actions/checkout"
          - "actions/setup-python"
          - "actions/upload-artifact"
          - "actions/download-artifact"
      github-script:
        patterns:
          - "actions/github-script"
          - "actions/configure-pages"
          - "actions/deploy-pages"
      codeql:
        patterns:
          - "github/codeql-action"

  # Docker (if Dockerfile added later)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
      - "auto-generated"
    assignees:
      - "a-m-e-n-t-e-t"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
