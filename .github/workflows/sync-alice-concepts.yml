# SkyNet Workflow 6/6 — Sync Alice Concepts (§17 Этап 0.6)
# Промпт-версия: v9.20
# Соответствует: §17 Этап 0.6 (концепции Alice — критический анализ, НИЗКОЕ доверие)
#               §1 pat_source, P034, P038, F41, F42
#
# Триггеры:
#   - schedule: раз в неделю по понедельникам 03:00 UTC (проверяет обновления Alice assets)
#   - workflow_dispatch: ручной запуск с параметром force=true (обновить даже если не менялось)
#
# Что делает:
#   1. Скачивает 43 HTML (папка t, 9.3 MB) с Яндекс.Диска → концепции/html_concepts/
#   2. Скачивает 143 файла (папка SAO v2, 107.8 MB) → концепции/schema_concepts/
#   3. Запускает semantic_analysis.py (если существует)
#   4. Коммитит концепции в репо
#   5. Создаёт ISSUE с меткой `concepts-updated` или `concepts-sync-failed`
#
# NB: archive_empty_v1.295.json.txt и archive_shell_v1.295.html — это файлы-оболочки
#     (не валидные схемы), игнорируются при анализе

name: §17 Etap 0.6 — Sync Alice Concepts

on:
  schedule:
    # Понедельник 03:00 UTC (09:00 Asia/Omsk)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download even if not changed'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write
  issues: write

env:
  PYTHON_VERSION: '3.12'
  YANDEX_HTML_PUBLIC_KEY: https://disk.yandex.ru/d/th0ZyhVrMWYGvA
  YANDEX_SCHEMAS_PUBLIC_KEY: https://disk.yandex.ru/d/h0Too2jkenZ0bw

jobs:
  sync-concepts:
    name: Sync Alice HTML + Schema concepts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "SkyNet-bot"
          git config user.email "bot@skynet.local"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml beautifulsoup4 lxml

      - name: Prepare directories
        run: |
          mkdir -p концепции/html_concepts концепции/schema_concepts
          # Очищаем содержимое (для idempotent re-sync)
          rm -rf концепции/html_concepts/* концепции/schema_concepts/* 2>/dev/null || true
          ls -la концепции/

      - name: Download HTML concepts (43 files, ~9.3 MB)
        id: html
        env:
          YANDEX_PUBLIC_KEY: ${{ env.YANDEX_HTML_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python << 'PYEOF'
          import os, sys, json, urllib.request, urllib.parse, urllib.error
          import zipfile, tempfile, pathlib, shutil

          public_key = os.environ["YANDEX_PUBLIC_KEY"]
          api = "https://cloud-api.yandex.net/v1/disk/public/resources/download"
          url = f"{api}?public_key={urllib.parse.quote(public_key, safe='')}"
          print(f"Fetching download URL for HTML concepts...")
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.load(r)
          download_url = data["href"]

          tmp_zip = pathlib.Path(tempfile.gettempdir()) / "html_concepts.zip"
          print(f"Downloading HTML concepts ZIP ({data.get('size', '?')} bytes)...")
          urllib.request.urlretrieve(download_url, tmp_zip)

          # Распаковываем в концепции/html_concepts/
          target = pathlib.Path("концепции/html_concepts")
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(tmp_zip, 'r') as z:
              z.extractall(target)

          tmp_zip.unlink(missing_ok=True)

          # Считаем файлы
          html_files = list(target.rglob("*.html"))
          print(f"::notice::Downloaded {len(html_files)} HTML files to {target}")
          print(f"html_count={len(html_files)}" >> open(os.environ['GITHUB_OUTPUT'], 'a'))
          PYEOF

      - name: Download Schema concepts (143 files, ~107.8 MB)
        id: schemas
        env:
          YANDEX_PUBLIC_KEY: ${{ env.YANDEX_SCHEMAS_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python << 'PYEOF'
          import os, sys, json, urllib.request, urllib.parse, urllib.error
          import zipfile, tempfile, pathlib

          public_key = os.environ["YANDEX_PUBLIC_KEY"]
          api = "https://cloud-api.yandex.net/v1/disk/public/resources/download"
          url = f"{api}?public_key={urllib.parse.quote(public_key, safe='')}"
          print(f"Fetching download URL for schema concepts...")
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.load(r)
          download_url = data["href"]

          tmp_zip = pathlib.Path(tempfile.gettempdir()) / "schema_concepts.zip"
          print(f"Downloading schemas ZIP ({data.get('size', '?')} bytes)...")
          urllib.request.urlretrieve(download_url, tmp_zip)

          target = pathlib.Path("концепции/schema_concepts")
          target.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(tmp_zip, 'r') as z:
              z.extractall(target)

          tmp_zip.unlink(missing_ok=True)

          # Считаем файлы (всех типов)
          all_files = [f for f in target.rglob("*") if f.is_file()]
          # Категоризация
          shell_files = [f for f in all_files if "archive_empty" in f.name or "archive_shell" in f.name]
          special_files = [f for f in all_files if any(s in f.name for s in ["_final", "_clean", "_fixed", "FINAL"])]
          duplicate_files = [f for f in all_files if "(1)" in f.name or "(2)" in f.name]

          print(f"::notice::Downloaded {len(all_files)} files to {target}")
          print(f"  Shell files (ignore): {len(shell_files)}")
          print(f"  Special versions: {len(special_files)}")
          print(f"  Duplicates: {len(duplicate_files)}")
          print(f"  Unique schemas: {len(all_files) - len(shell_files) - len(special_files) - len(duplicate_files)}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"total_count={len(all_files)}\n")
              f.write(f"shell_count={len(shell_files)}\n")
              f.write(f"special_count={len(special_files)}\n")
              f.write(f"duplicate_count={len(duplicate_files)}\n")
          PYEOF

      - name: Run semantic analysis (if script exists)
        id: semantic
        continue-on-error: true
        run: |
          if [ -f "scripts/semantic_analysis.py" ]; then
            echo "::notice::Running semantic_analysis.py"
            python scripts/semantic_analysis.py 2>&1 | tee semantic_output.log
          else
            echo "::notice::scripts/semantic_analysis.py NOT FOUND — semantic analysis skipped"
            echo "skipped=true" >> $GITHUB_OUTPUT
          fi

      - name: Update _alice_assets.yaml
        run: |
          mkdir -p "требования к ии"
          cat > "требования к ии/_alice_assets.yaml" << EOF
          # Auto-generated by sync-alice-concepts.yml
          # Source: https://disk.yandex.ru/d/th0ZyhVrMWYGvA (HTML)
          #         https://disk.yandex.ru/d/h0Too2jkenZ0bw (Schemas)
          # Updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          html_count: ${{ steps.html.outputs.html_count }}
          schemas_total: ${{ steps.schemas.outputs.total_count }}
          schemas_unique: $(( ${{ steps.schemas.outputs.total_count }} - ${{ steps.schemas.outputs.shell_count }} - ${{ steps.schemas.outputs.special_count }} - ${{ steps.schemas.outputs.duplicate_count }} ))
          schemas_duplicates: ${{ steps.schemas.outputs.duplicate_count }}
          schemas_special: ${{ steps.schemas.outputs.special_count }}
          schemas_shell: ${{ steps.schemas.outputs.shell_count }}
          yandex_html_url: https://disk.yandex.ru/d/th0ZyhVrMWYGvA
          yandex_schemas_url: https://disk.yandex.ru/d/h0Too2jkenZ0bw
          last_sync: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          cat "требования к ии/_alice_assets.yaml"

      - name: Commit changes
        run: |
          git add концепции/ "требования к ии/_alice_assets.yaml"
          if [ -f "концепции/_semantic_cache.json" ]; then
            # _semantic_cache.json — gitignored, не коммитим
            git reset "концепции/_semantic_cache.json" 2>/dev/null || true
          fi
          git commit -m "chore(concepts): auto-sync from Yandex Disk $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || echo "Nothing to commit"
          git push || echo "Push failed"

      - name: Save semantic log artifact
        if: always() && steps.semantic.outputs.skipped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: semantic-log-${{ github.run_id }}
          retention-days: 14
          path: semantic_output.log

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Alice concepts sync FAILED (run ${context.runId})`,
              body: [
                `**§17 Etap 0.6 sync failed**`,
                ``,
                `| Step | Status |`,
                `|---|---|`,
                `| HTML download | ${{ steps.html.outcome }} |`,
                `| Schemas download | ${{ steps.schemas.outcome }} |`,
                `| Semantic analysis | ${{ steps.semantic.outcome }} |`,
                ``,
                `**Possible causes:**`,
                `- Yandex Disk public link expired`,
                `- Network timeout`,
                `- Disk quota exceeded`,
                ``,
                `**Time:** ${new Date().toISOString()}`,
                `**Run:** ${context.runId}`,
              ].join('\n'),
              labels: ['concepts-sync-failed', 'auto-generated'],
            });

      - name: Summary
        if: always()
        run: |
          echo "## §17 Etap 0.6 — Alice Concepts Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Asset | Count | Source |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| HTML concepts | ${{ steps.html.outputs.html_count }} | https://disk.yandex.ru/d/th0ZyhVrMWYGvA |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema files (total) | ${{ steps.schemas.outputs.total_count }} | https://disk.yandex.ru/d/h0Too2jkenZ0bw |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema files (shell, ignored) | ${{ steps.schemas.outputs.shell_count }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema files (special) | ${{ steps.schemas.outputs.special_count }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema files (duplicates) | ${{ steps.schemas.outputs.duplicate_count }} | — |" >> $GITHUB_STEP_SUMMARY
          echo "| Unique schemas | $((${{ steps.schemas.outputs.total_count }} - ${{ steps.schemas.outputs.shell_count }} - ${{ steps.schemas.outputs.special_count }} - ${{ steps.schemas.outputs.duplicate_count }})) | — |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Updated:** \`требования к ии/_alice_assets.yaml\`" >> $GITHUB_STEP_SUMMARY
          echo "**Semantic analysis:** ${{ steps.semantic.outcome }}" >> $GITHUB_STEP_SUMMARY
