# SkyNet Workflow 1/6 — Phase 0: PAT-валидация + SkyNet sync
# Промпт-версия: v9.20
# Соответствует: §0 check_skynet_state(), §9 Phase 0, §19 check_current_state()
#
# Триггеры:
#   - workflow_dispatch: ручной запуск
#   - repository_dispatch: внешний webhook (например, от чат-бота при новом сообщении)
#   - push на .github/workflows/phase0-init.yml (самопроверка)
#
# Что делает:
#   1. Скачивает PAT с Яндекс.Диска через Yandex Public REST API
#   2. Проверяет PAT через GitHub /user endpoint
#   3. Проверяет состояние SkyNet (accessible, empty, has_workflows_dir, has_pipeline_py)
#   4. Если SkyNet пустой или нет скелета → создаёт ISSUE с меткой `skeleton-required`
#   5. Обновляет результаты/_phase0_status.json как артефакт

name: Phase 0 — PAT Validation & SkyNet Sync

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']
  repository_dispatch:
    types: [user-message]
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase0-init.yml'

# Не запускать параллельные инстансы — конфликтуют по state
concurrency:
  group: phase0-init
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

env:
  YANDEX_PAT_PUBLIC_KEY: https://disk.yandex.ru/i/3RiKQucdvHI2Sg
  GITHUB_USER: a-m-e-n-t-e-t
  SKYNET_REPO: a-m-e-n-t-e-t/SkyNet

jobs:
  phase0:
    name: Phase 0 — Validate PAT & Check SkyNet State
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml

      - name: Download PAT from Yandex Disk
        id: pat
        env:
          YANDEX_PUBLIC_KEY: ${{ env.YANDEX_PAT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python << 'PYEOF'
          import os, sys, json, urllib.request, urllib.error
          public_key = os.environ["YANDEX_PUBLIC_KEY"]
          # Step 1: get download URL via Yandex Public REST API
          api = "https://cloud-api.yandex.net/v1/disk/public/resources/download"
          url = f"{api}?public_key={urllib.parse.quote(public_key, safe='')}"
          try:
              with urllib.request.urlopen(url, timeout=15) as r:
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              print(f"::error::Yandex API HTTP {e.code}: {e.reason}")
              sys.exit(1)
          if "href" not in data:
              print(f"::error::No href in Yandex response: {data}")
              sys.exit(1)
          download_url = data["href"]
          # Step 2: download PAT (it's a .docx — extract text)
          # NB: не сохраняем PAT в файл — только в GITHUB_ENV
          import zipfile, xml.etree.ElementTree as ET, re, tempfile, pathlib
          tmp = pathlib.Path(tempfile.gettempdir()) / "token.docx"
          urllib.request.urlretrieve(download_url, tmp)
          with zipfile.ZipFile(tmp, 'r') as z:
              with z.open('word/document.xml') as f:
                  tree = ET.parse(f)
                  root = tree.getroot()
                  ns = '{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'
                  texts = [t.text for t in root.iter(f'{ns}t') if t.text]
                  full = ''.join(texts)
          tmp.unlink(missing_ok=True)
          m = re.search(r'github_pat_[A-Za-z0-9_]+', full)
          if not m:
              print(f"::error::PAT not found in Token.docx, full text: {full!r}")
              sys.exit(1)
          pat = m.group(0)
          # NB: НЕ печатаем PAT в stdout — только в $GITHUB_ENV
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PAT_TOKEN={pat}\n")
          print(f"::notice::PAT downloaded from Yandex Disk (length={len(pat)})")
          PYEOF

      - name: Verify PAT via GitHub API
        env:
          GH_TOKEN: ${{ env.PAT_TOKEN }}
        run: |
          set -euo pipefail
          python << 'PYEOF'
          import os, json, urllib.request, urllib.error, sys
          pat = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              "https://api.github.com/user",
              headers={
                  "Authorization": f"Bearer {pat}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  user = json.load(r)
          except urllib.error.HTTPError as e:
              print(f"::error::PAT verification failed: HTTP {e.code}")
              sys.exit(1)
          login = user.get("login")
          if login != os.environ["GITHUB_USER"]:
              print(f"::error::PAT user mismatch: expected={os.environ['GITHUB_USER']} actual={login}")
              sys.exit(1)
          print(f"::notice::PAT valid for user '{login}' (id={user.get('id')})")
          PYEOF

      - name: Check SkyNet repo state (§0 check_skynet_state)
        id: state
        env:
          GH_TOKEN: ${{ env.PAT_TOKEN }}
        run: |
          set -euo pipefail
          python << 'PYEOF'
          import os, json, urllib.request, urllib.error, sys
          pat = os.environ["GH_TOKEN"]
          repo = os.environ["SKYNET_REPO"]
          headers = {
              "Authorization": f"Bearer {pat}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          # 1. Repo accessible?
          try:
              with urllib.request.urlopen(urllib.request.Request(
                  f"https://api.github.com/repos/{repo}", headers=headers,
              ), timeout=15) as r:
                  repo_data = json.load(r)
              repo_accessible = repo_data.get("full_name") == repo
              repo_size = repo_data.get("size", 0)
              is_empty = repo_size < 10
              perms = repo_data.get("permissions", {})
              print(f"::notice::Repo {repo} accessible={repo_accessible}, size={repo_size} KB, admin={perms.get('admin')}, push={perms.get('push')}")
          except urllib.error.HTTPError as e:
              print(f"::error::Cannot access repo: HTTP {e.code}")
              sys.exit(1)
          # 2. .github/workflows/ exists?
          has_workflows = False
          workflows_count = 0
          try:
              with urllib.request.urlopen(urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/contents/.github/workflows",
                  headers=headers,
              ), timeout=15) as r:
                  files = json.load(r)
              if isinstance(files, list):
                  workflows_count = sum(1 for f in files if f.get("name", "").endswith(".yml"))
                  has_workflows = workflows_count > 0
          except urllib.error.HTTPError:
              pass
          # 3. scripts/pipeline.py exists?
          has_pipeline = False
          try:
              with urllib.request.urlopen(urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/contents/scripts/pipeline.py",
                  headers=headers,
              ), timeout=15) as r:
                  has_pipeline = r.status == 200
          except urllib.error.HTTPError:
              pass
          needs_skeleton = not (has_workflows and has_pipeline)
          # 4. Вывод в $GITHUB_OUTPUT
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"repo_accessible={str(repo_accessible).lower()}\n")
              f.write(f"is_empty={str(is_empty).lower()}\n")
              f.write(f"has_workflows={str(has_workflows).lower()}\n")
              f.write(f"workflows_count={workflows_count}\n")
              f.write(f"has_pipeline={str(has_pipeline).lower()}\n")
              f.write(f"needs_skeleton={str(needs_skeleton).lower()}\n")
          print(f"::notice::State: accessible={repo_accessible}, empty={is_empty}, workflows={workflows_count}, pipeline={has_pipeline}, needs_skeleton={needs_skeleton}")
          if needs_skeleton:
              print("::warning::SkyNet skeleton required — trigger Etap 0.5 §17")
          PYEOF

      - name: Create issue if skeleton required
        if: steps.state.outputs.needs_skeleton == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ env.PAT_TOKEN }}
          script: |
            const state = ${{ toJSON(steps.state.outputs) }};
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 SkyNet skeleton init required (Phase 0)`,
              body: [
                `**Phase 0 detected missing skeleton:**`,
                ``,
                `| Check | Value |`,
                `|---|---|`,
                `| repo_accessible | ${state.repo_accessible} |`,
                `| is_empty | ${state.is_empty} |`,
                `| has_workflows | ${state.has_workflows} (${state.workflows_count} files) |`,
                `| has_pipeline | ${state.has_pipeline} |`,
                ``,
                `**Required action:** Run §17 Etap 0.5 to create:`,
                `- 18 scripts in scripts/`,
                `- 15 files in требования к ии/`,
                `- 26 subsystem subfolders`,
                `- 6 .github/workflows/*.yml files`,
                ``,
                `**Triggered by:** ${context.eventName} @ ${new Date().toISOString()}`,
                `**Run:** ${context.runId}`,
              ].join('\n'),
              labels: ['skeleton-required', 'phase-0', 'auto-generated'],
            });

      - name: Save Phase 0 status artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-status-${{ github.run_id }}
          retention-days: 30
          path: |
            ${{ runner.temp }}/

      - name: Summary
        if: always()
        run: |
          echo "## Phase 0 Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| repo_accessible | ${{ steps.state.outputs.repo_accessible }} |" >> $GITHUB_STEP_SUMMARY
          echo "| is_empty | ${{ steps.state.outputs.is_empty }} |" >> $GITHUB_STEP_SUMMARY
          echo "| has_workflows | ${{ steps.state.outputs.has_workflows }} (${{ steps.state.outputs.workflows_count }} files) |" >> $GITHUB_STEP_SUMMARY
          echo "| has_pipeline | ${{ steps.state.outputs.has_pipeline }} |" >> $GITHUB_STEP_SUMMARY
          echo "| needs_skeleton | ${{ steps.state.outputs.needs_skeleton }} |" >> $GITHUB_STEP_SUMMARY
