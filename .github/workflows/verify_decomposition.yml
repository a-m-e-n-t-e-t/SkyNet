# SkyNet Decomposition Verification — auto-create issues for files needing verification
# v9.57 (HYBRID): группировка violations по file_id — один issue на файл.
#   - Если открытый issue с этим file_id уже есть → supplement: добавляем комментарий
#     с новыми violations, не покрытыми исходным чек-листом (dedup_keys сравниваются).
#   - Если issue для файла закрыт, но появились новые violations → создаём новый.
#   - Auto-close: только когда у файла 0 violations в текущем выводе валидатора
#     (не per-violation — раньше закрывалось при исчезновении одного dedup_key).
#   - Лимит поднят: MAX_NEW_ISSUES=200 (было 6), MAX_SUPPLEMENT_PER_RUN=500.
#   - Sleep 500ms между create, 300ms между supplement — soft rate limit.
#   - Legacy issues без маркера <!-- file: ... --> работают по старой логике.
# v9.36: оптимизация — единый модуль scripts/_dedup_keys.js для normalizeViolationKey
#   (устранён copy-rot: auto-close копия не знала про F26 → ложное закрытие F26 issues);
#   пагинация списка issues в шаге создания (>100 issues больше не теряются);
#   schedule сокращён до каждые 3 ч (push-триггеры покрывают основной поток).
# v9.34: полный список violations через --json-out (исправление критичного бага v9.33)
#
# БАГ v9.33 и ранее: нарушения парсились из человеческого лога валидатора,
# который печатает только ПЕРВЫЕ 3 violations на метрику (violations[:3], v[:100]).
# Следствия:
#   (а) issues создавались только для случайного вращающегося подмножества из 3×4 нарушений;
#   (б) auto-close stale сверял ВСЕ открытые issues с этим же обрезанным списком
#       → ложно закрывал бы актуальные issues (нарушение «исчезло», потому что
#         не попало в первые 3 напечатанные строки).
# v9.34: валидатор запускается с --json-out violations.json — ПОЛНЫЙ список (сейчас ~900).
# Лог-парсинг оставлен только как fallback; при fallback авто-закрытие ЗАПРЕЩЕНО (partial=1).
# Создание issues: справедливый round-robin между метриками + лимит MAX_NEW_ISSUES
# за прогон (защита от флуда issue-очереди одним коммитом). + schedule
#
# Триггеры:
#   - push на main с изменениями в реальные данные/ или фантастические данные/
#   - push с правками самого workflow, валидатора или scripts/_dedup_keys.js
#   - schedule: каждые 3 часа в :15 (закрытие stale issues без ожидания push;
#     push-триггеры покрывают основной поток — агент пушит после каждой партии)
#   - workflow_dispatch (ручной запуск)
#
# Что делает:
#   1. Запускает validate_decomposition.py --json-out — ПОЛНЫЙ список violations F22-F25
#   2. Создаёт GitHub issues с меткой `verify-task` для первых MAX_NEW_ISSUES нарушений
#      (round-robin между метриками; БЕЗ дублирования — проверяет все issues:
#       open+closed, использует стабильный dedup_key в теле issue)
#   3. AUTO-CLOSE STALE (только при ПОЛНОМ списке, partial=0): для каждого открытого
#      verify-task issue, чей dedup_key отсутствует в текущих violations, автоматически
#      закрывает как stale (НЕ трогает issues с меткой in-progress — cron-агент работает)
#   4. Issues обрабатываются cron-агентом (job 504119)
#
# ANTI-PARALLEL:
#   - concurrency.group = verify-decomposition-${{ github.ref }}
#     с cancel-in-progress: false — параллельные push'и становятся в очередь,
#     а не запускают параллельные runs (что вызывало дубли issues #153/#154 и т.п.)
#
# ANTI-DUPLICATE:
#   - Запрашиваем ВСЕ issues с меткой verify-task (state=all),
#     включая закрытые — если задача была решена ранее, новый issue не создаём
#   - dedup_key хранится в HTML-комментарии в теле issue
#     (стабилен между запусками, не зависит от количества файлов в F25)
#   - existingKeys Set обновляется после каждого create — нет дубликатов внутри одного run
#   - Regex для fileId поддерживает кириллицу (часть_...)
#
# AUTO-CLOSE STALE (новое в v9.33):
#   - Проблема: workflow создавал issue по старому checkout'у, фикс устранял нарушение,
#     но issue оставался открытым — cron-агент тратил циклы на ручное закрытие (#133 и др.)
#   - Решение: после создания новых issues проходим по всем открытым verify-task,
#     извлекаем dedup_key, и если его нет в текущих violations — закрываем как stale
#     с комментарием «Auto-closed: violation gone from current validator output»
#   - in-progress issues НЕ закрываем (cron-агент в работе)
#   - Issues без извлекаемого dedup_key (очень старые) не трогаем

name: Decomposition — create verification tasks

on:
  push:
    branches: [main]
    paths:
      - 'реальные данные/**'
      - 'фантастические данные/**'
      - 'scripts/validate_decomposition.py'
      - 'scripts/_dedup_keys.js'
      - '.github/workflows/verify_decomposition.yml'
  workflow_dispatch:
  schedule:
    # Каждые 3 часа в :15 — закрытие stale issues даже без push.
    # v9.36: было каждый час; push-триггеры (агент пушит каждую партию) покрывают
    # основной поток, ежечасный запуск лишь сжигал минуты Actions.
    - cron: '15 */3 * * *'

concurrency:
  group: verify-decomposition-${{ github.ref }}
  # НЕ отменяем queued runs — пусть дождутся своей очереди.
  # Это гарантирует что параллельные push'и НЕ создадут дубликаты issues.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  create-tasks:
    name: Create verification issues for F22-F25 violations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Run validate_decomposition.py — get F22-F28 violations
        id: violations
        run: |
          set +e
          # v9.34: полный machine-readable список violations через --json-out.
          # v9.35: добавлена метрика F26 (внутри-родительские дубликаты).
          # v9.40: добавлена метрика F27 (незаполненные материалы, используемые изделиями).
          # v9.42: добавлена метрика F28 (альтернативные формы материалов для AI-вариантов изделий).
          # v9.53: добавлена метрика F27b (битые ссылки на материалы: файл отсутствует
          #        в каталоге — F27 итерирует существующие файлы, F27b ловит пробел
          #        и даёт cron-агенту явный сигнал «СОЗДАЙ файл через web_search»).)
          # v9.54: добавлена метрика F27c (mirror F27b для каталога технологии/:
          #        проверяет структурные id-ссылки в frontmatter — `технологии_частей`
          #        для часть-level и `технологии` для изделия-level).
          # v9.55: добавлена метрика F27d (обратная связь F27b/F27c): проверяет
          #        валидность id в `материалы_для_процесса` файлов технологий —
          #        замыкает треугольник изделие↔технология↔материал.
          # v9.56: F27d переориентирована на soft-check `типичные_материалы_для_процесса`
          #        в файлах технологий (опциональное). Конкретные материалы процесса
          #        перенесены в ИЗДЕЛИЕ, в поле `материалы_для_процесса` внутри
          #        `технологии_частей[]` (одна технология — разные материалы в разных
          #        изделиях). Добавлены:
          #        F27e — обязательность технологии_частей для частей с материалы_частей
          #        F27f — обязательность материалы_для_процесса внутри технологии_частей
          #        F27g — валидность id материалов в технологии_частей.материалы_для_процесса
          # v9.41: расширение F27 — критерий (e): вариант_структуры должен быть
          #        указан (preventive); checklist уточнён — web_search ищет ВСЕ
          #        структурные формы (mono/poly/amorphous/...), полиморфные кристаллы
          #        требуют конкретной фазы; добавлено поле структурные_формы_альтернативы.
          # Человеческий лог (validate_output.log) печатает только первые 3 violations
          # на метрику — его парсинг НЕ использовать, он обрезает ~900 до 9.
          python scripts/validate_decomposition.py --json-out violations.json 2>&1 | tee validate_output.log
          VALIDATOR_EXIT=$?

          # Явная проверка: violations.json должен существовать и быть непустым
          if [ ! -s violations.json ]; then
            echo "::error::validate_decomposition.py did not produce violations.json (exit=$VALIDATOR_EXIT). Auto-close step will be skipped."
            echo "total_violations=0" >> $GITHUB_OUTPUT
            echo "partial=1" >> $GITHUB_OUTPUT
            exit 0   # не падаем весь workflow — Summary всё равно полезен
          fi

          echo "partial=0" >> $GITHUB_OUTPUT
          echo "using complete --json-out violations list"

          # v9.36: один вызов python вместо 6 — печатает total и per-metric в одном subprocess
          # v9.39.5 fix: в GITHUB_OUTPUT допустимы ТОЛЬКО строки key=value — отладочные
          # print() вида "Total violations: N" ломали парсер (Invalid format) и делали
          # workflow failure хроническим с a0c14b1. Отладка — только в stdout шага.
          # v9.35: список метрик читается из scripts/_metrics.py (единый источник истины)
          python3 - <<'PYEOF' >> $GITHUB_OUTPUT
          import json, sys
          sys.path.insert(0, 'scripts')
          from _metrics import ALL_METRICS
          d = json.load(open('violations.json'))
          total = sum(len(v) for v in d.values())
          print(f"total_violations={total}")
          for M in ALL_METRICS:
              print(f"{M}_count={len(d.get(M, []))}")
          PYEOF
          # info-лог в stdout шага (одинарные кавычки — без bash-интерполяции):
          python3 - <<'PYEOF'
          import json, sys
          sys.path.insert(0, 'scripts')
          from _metrics import ALL_METRICS
          d = json.load(open('violations.json'))
          print(f"[info] Total violations: {sum(len(v) for v in d.values())}")
          for M in ALL_METRICS:
              print(f"[info]   {M}: {len(d.get(M, []))} violations")
          PYEOF

      - name: Create issues per file (hybrid - supplement-or-create, capped)
        if: steps.violations.outputs.total_violations != '0'
        uses: actions/github-script@v7
        env:
          MAX_NEW_ISSUES: '200'            # v9.57: было 6 — теперь можно создать до 200 новых issue за прогон
          MAX_SUPPLEMENT_PER_RUN: '500'   # v9.57: max комментариев-supplement за прогон
          SLEEP_BETWEEN_CREATE_MS: '500'  # v9.57: soft rate limit между create
          SLEEP_BETWEEN_SUPPLEMENT_MS: '300'  # v9.57: soft rate limit между supplement
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const violations = JSON.parse(fs.readFileSync('violations.json', 'utf-8'));
            const { normalizeViolationKey, legacyMetricFromTitle, extractFileId } = require('./scripts/_dedup_keys.js');
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            // === v9.57: ГРУППИРОВКА violations по file_id ===
            const grouped = new Map();  // file_id -> [{metric, violation, dedupKey}]
            for (const [metric, arr] of Object.entries(violations)) {
              for (const v of arr) {
                const fid = extractFileId(metric, v);
                if (!grouped.has(fid)) grouped.set(fid, []);
                grouped.get(fid).push({ metric, violation: v, dedupKey: normalizeViolationKey(metric, v) });
              }
            }
            const totalViolations = [...grouped.values()].reduce((s, a) => s + a.length, 0);
            console.log(`Grouped: ${grouped.size} files, ${totalViolations} total violations`);

            // === Загрузка ОТКРЫТЫХ verify-task issues (для supplement) ===
            const openByFile = new Map();  // file_id -> issue
            for (let page = 1; page <= 10; page++) {
              const resp = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'verify-task', state: 'open',
                per_page: 100, page: page,
              });
              if (resp.data.length === 0) break;
              for (const issue of resp.data) {
                const body = issue.body || '';
                const m = body.match(/<!--\s*file:\s*(.+?)\s*-->/);
                if (m) openByFile.set(m[1].trim(), issue);
              }
              if (resp.data.length < 100) break;
            }
            console.log(`Open verify-task with <!-- file: --> marker: ${openByFile.size}`);

            // === Загрузка ЗАКРЫТЫХ issues (anti-recreate при полном решении файла) ===
            const closedKeysByFile = new Map();
            for (let page = 1; page <= 10; page++) {
              const resp = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'verify-task', state: 'closed',
                per_page: 100, page: page,
              });
              if (resp.data.length === 0) break;
              for (const issue of resp.data) {
                const body = issue.body || '';
                const m = body.match(/<!--\s*file:\s*(.+?)\s*-->/);
                if (!m) continue;
                const fid = m[1].trim();
                if (!closedKeysByFile.has(fid)) closedKeysByFile.set(fid, new Set());
                for (const dm of body.matchAll(/<!--\s*dedup:\s*(.+?)\s*-->/g)) {
                  closedKeysByFile.get(fid).add(dm[1].trim());
                }
              }
              if (resp.data.length < 100) break;
            }
            console.log(`Closed verify-task files: ${closedKeysByFile.size} (anti-recreate cache)`);

            const maxNew = parseInt(process.env.MAX_NEW_ISSUES || '200', 10);
            const maxSup = parseInt(process.env.MAX_SUPPLEMENT_PER_RUN || '500', 10);
            const sleepCreate = parseInt(process.env.SLEEP_BETWEEN_CREATE_MS || '500', 10);
            const sleepSup = parseInt(process.env.SLEEP_BETWEEN_SUPPLEMENT_MS || '300', 10);
            let created = 0, supplemented = 0, deferred = 0, skipped = 0, allResolved = 0;

            // === ИТЕРАЦИЯ по файлам ===
            for (const [fileId, viols] of grouped) {
              const existing = openByFile.get(fileId);

              if (existing) {
                // --- SUPPLEMENT MODE: добавить новые violations в существующий issue ---
                // v9.57: сравниваем по ПОЛНОМУ тексту violation (metric|violation_text),
                // не по dedup_key — F27f на одном файле с разными технологиями
                // может давать одинаковый dedup_key (F27f:часть_X), но violations разные.
                const existingBody = existing.body || '';
                const existingViolations = new Set();
                // Из тела issue: парсим строки "- [ ] **METRIC** — VIOLATION_TEXT"
                for (const m of existingBody.matchAll(/- \[ \] \*\*(\w+)\*\* — (.+)/g)) {
                  existingViolations.add(m[1] + '|' + m[2].trim());
                }
                const newViols = viols.filter(v => !existingViolations.has(v.metric + '|' + v.violation));
                if (newViols.length === 0) { skipped++; continue; }
                if (supplemented >= maxSup) { deferred++; continue; }

                const commentBody = [
                  `## ➕ Дополнительные нарушения (supplement v9.57)`,
                  ``,
                  `Файл \`${fileId}\` — обнаружены новые нарушения, не покрытые исходным чек-листом:`,
                  ``,
                  ...newViols.map(v => `- [ ] **${v.metric}** — ${v.violation}`),
                  ...newViols.map(v => `<!-- dedup: ${v.dedupKey} -->`),
                  ``,
                  `**Источник:** новый прогон verify_decomposition.yml (commit ${context.sha.substring(0, 8)})`,
                  `*Авто-supplement v9.57.*`,
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body: commentBody,
                });

                // Добавить labels для новых метрик
                const existingLabels = new Set(existing.labels.map(l => l.name));
                const newMetricLabels = [...new Set(newViols.map(v => v.metric.toLowerCase()))]
                  .filter(l => !existingLabels.has(l));
                if (newMetricLabels.length > 0) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: existing.number, labels: newMetricLabels,
                  });
                }

                supplemented++;
                await sleep(sleepSup);
                continue;
              }

              // --- NEW ISSUE MODE ---
              const closedKeys = closedKeysByFile.get(fileId);
              if (closedKeys && viols.every(v => closedKeys.has(v.dedupKey))) {
                allResolved++;  // файл был полностью решён в прошлой жизни — пропускаем
                continue;
              }
              if (created >= maxNew) { deferred++; continue; }

              // Сборка issue для ВСЕХ violations файла
              const metrics = [...new Set(viols.map(v => v.metric))];
              
              // v9.58: определить сложность issue для priority-picking
              const COMPLEX_METRICS = new Set(['F27b', 'F27c', 'F-ai-lineage', 'F-fant-children']);
              const MEDIUM_METRICS = new Set(['F27', 'F27d', 'F27e', 'F27f', 'F27g', 'F28', 'F15g', 'F15b', 'F15d', 'F15h', 'F22', 'F29', 'F-scal', 'F34']);
              function determineComplexity(violsArr) {
                const n = violsArr.length;
                const hasComplex = violsArr.some(v => COMPLEX_METRICS.has(v.metric));
                const hasMedium = violsArr.some(v => MEDIUM_METRICS.has(v.metric));
                if (hasComplex || n >= 8) return 'complex';
                if (n >= 2 || hasMedium) return 'medium';
                return 'quick';
              }
              const complexity = determineComplexity(viols);
              
              const labels = ['verify-task', ...metrics.map(m => m.toLowerCase()), 'auto-generated', `complexity:${complexity}`];
              const title = `[${metrics.join('/')}] Verify: ${fileId}`;

              const bodyParts = [
                `<!-- file: ${fileId} -->`,
                ...viols.map(v => `<!-- dedup: ${v.dedupKey} -->`),
                ``,
                `## Задача верификации: ${metrics.join(', ')}`,
                ``,
                `**Файл / сигнатура:** \`${fileId}\``,
                `**Количество нарушений:** ${viols.length}`,
                ``,
                `### Нарушения`,
                ``,
                ...viols.map(v => `- [ ] **${v.metric}** — ${v.violation}`),
                ``,
                `### Что нужно сделать`,
                ``,
                `1. Найти файл в репозитории по id выше.`,
                `2. Для каждой метрики выполнить соответствующий чек-лист (см. критерии метрики в SkyNet_PROMPT).`,
                `3. Зафиксировать изменения, отметить пункты чек-листа [x] и закрыть issue.`,
                ``,
                `### Чек-листы по метрикам`,
                ``,
              ];

              // Краткие чек-листы по каждой метрике (полные версии в SkyNet_PROMPT_v9.XX.md)
              for (const metric of metrics) {
                const metricViols = viols.filter(v => v.metric === metric);
                bodyParts.push(`#### ${metric} (${metricViols.length} наруш.)`, ``);
                for (const mv of metricViols) {
                  bodyParts.push(`- [ ] **${mv.metric}**: ${mv.violation}`);
                }
                bodyParts.push(``);
                bodyParts.push(`**Чек-лист ${metric}:**`);
                if (metric === 'F27' || metric === 'F27b' || metric === 'F27c' || metric === 'F27d') {
                  bodyParts.push(`- свойства: плотность_kg_m3, теплопроводность_W_mK, температура_плавления_C (или макс_рабочая_температура_C)`);
                  bodyParts.push(`- химический_состав, класс, стандарты`);
                  bodyParts.push(`- вариант_структуры: КОНКРЕТНАЯ форма (mono/poly/amorphous/...)`);
                  bodyParts.push(`- источник_url + источник_дата (web_search)`);
                } else if (metric === 'F27e') {
                  bodyParts.push(`- для КАЖДОЙ части с материалы_частей → создать/дополнить технологии_частей`);
                  bodyParts.push(`- формат записи: {часть, технология, доля_использования, материалы_для_процесса[{материал, роль}]}`);
                } else if (metric === 'F27f') {
                  bodyParts.push(`- для КАЖДОЙ технологии_частей → заполнить материалы_для_процесса`);
                  bodyParts.push(`- роль: обрабатываемый/покрываемый_контакт/прекурсор/катализатор/...`);
                } else if (metric === 'F27g') {
                  bodyParts.push(`- проверить id материалов в технологии_частей.материалы_для_процесса`);
                  bodyParts.push(`- если материала нет в каталоге → создать файл (см. F27b-чек-лист)`);
                  bodyParts.push(`- ВНИМАНИЕ: дедупликация по (изделие, технология, материал) — разные части с одинаковой парой считаются дублем (используйте разные технологии)`);
                } else if (metric === 'F22') {
                  bodyParts.push(`- источник_url заполнить конкретным URL`);
                  bodyParts.push(`- тип источника: web_search/datasheet/catalog/spec`);
                } else if (metric === 'F15b' || metric === 'F15d' || metric === 'F15g' || metric === 'F15h') {
                  bodyParts.push(`- проверить баланс (parent vs Σ/max/MIN children)`);
                  bodyParts.push(`- заполнить реальные значения в YAML основные/ или дополнительные/`);
                  bodyParts.push(`- перегенерировать графы: python3 scripts/generate_graphs.py --all`);
                } else if (metric === 'F-scal') {
                  bodyParts.push(`- блок масштабируемость в front-matter (P087 §12.6)`);
                  bodyParts.push(`- режим: масштабируемая/квантуемая/фиксированная`);
                  bodyParts.push(`- параметры, пределы (min/max), закон_масштабирования`);
                } else if (metric === 'F29') {
                  bodyParts.push(`- для КАЖДОГО материала в материалы_частей → указать форма (через альтернативные_формы/сравнение_структур)`);
                  bodyParts.push(`- форма выбирается из реальных вариантов (datasheet/catalog)`);
                } else if (metric === 'F34') {
                  bodyParts.push(`- выбрать стратегию: атомарная (неделимый) или составная (создать sub-parts)`);
                  bodyParts.push(`- глубина не ограничена (м.б. уровни 5, 6, 7, ...)`);
                } else if (metric === 'F-ai-lineage') {
                  bodyParts.push(`- поля: предок, предок_путь, улучшения[], real_check{}`);
                  bodyParts.push(`- тип улучшения: замена_материала/замена_технологии/...`);
                } else {
                  bodyParts.push(`- веб-поиск компонента (datasheet/catalog/spec)`);
                  bodyParts.push(`- заполнить реальные данные в front-matter`);
                  bodyParts.push(`- источник_url заполнить конкретным URL`);
                }
                bodyParts.push(``);
              }

              bodyParts.push(
                `### Критерии закрытия`,
                ``,
                `- Все нарушения из чек-листа выше отмечены [x]`,
                `- validate_decomposition.py больше не выдаёт violations для этого file_id`,
                `- графы обновлены (graphs/graph1_data.json)`,
                ``,
                `**Авто-создано:** ${new Date().toISOString()}`,
                `**Коммит:** ${context.sha.substring(0, 8)}`,
                `**Run:** ${context.runId}`,
              );

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: bodyParts.join('\n'),
                labels: labels,
              });

              created++;
              await sleep(sleepCreate);
            }

            console.log(`Created: ${created}, Supplemented: ${supplemented}, All-resolved (skip): ${allResolved}, Skipped (no new): ${skipped}, Deferred (cap): ${deferred}`);

      - name: Split large issues into sub-issues (v9.58)
        # v9.58: issue с ≥6 violations разбивается на sub-issues по 2-3 пункта.
        # Parent помечается 'parent' + 'split-done'; sub-issues получают 'sub-issue'.
        if: steps.violations.outputs.total_violations != '0'
        uses: actions/github-script@v7
        env:
          SPLIT_THRESHOLD: '6'
          MAX_VIOLATIONS_PER_SUB: '3'
          MAX_SPLITS_PER_RUN: '50'
          SLEEP_BETWEEN_SPLITS_MS: '500'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));
            const threshold = parseInt(process.env.SPLIT_THRESHOLD || '6', 10);
            const maxPerSub = parseInt(process.env.MAX_VIOLATIONS_PER_SUB || '3', 10);
            const maxSplits = parseInt(process.env.MAX_SPLITS_PER_RUN || '50', 10);
            const sleepMs = parseInt(process.env.SLEEP_BETWEEN_SPLITS_MS || '500', 10);

            // 1. Найти ОТКРЫТЫЕ parent-candidates: complexity:complex БЕЗ parent/sub-issue/split-done labels
            const candidates = [];
            for (let page = 1; page <= 5; page++) {
              const resp = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'verify-task,complexity:complex', state: 'open',
                per_page: 100, page,
              });
              if (resp.data.length === 0) break;
              for (const issue of resp.data) {
                const labels = issue.labels.map(l => l.name);
                if (labels.includes('parent') || labels.includes('sub-issue') || labels.includes('split-done')) continue;
                candidates.push(issue);
              }
              if (resp.data.length < 100) break;
            }
            console.log(`Split candidates (complex, not yet split): ${candidates.length}`);

            // Complexity classifier (mirror from Create step)
            const COMPLEX_METRICS = new Set(['F27b', 'F27c', 'F-ai-lineage', 'F-fant-children']);
            const MEDIUM_METRICS = new Set(['F27', 'F27d', 'F27e', 'F27f', 'F27g', 'F28', 'F15g', 'F15b', 'F15d', 'F15h', 'F22', 'F29', 'F-scal', 'F34']);
            function determineComplexity(violsArr) {
              const n = violsArr.length;
              const hasComplex = violsArr.some(v => COMPLEX_METRICS.has(v.metric));
              const hasMedium = violsArr.some(v => MEDIUM_METRICS.has(v.metric));
              if (hasComplex || n >= 8) return 'complex';
              if (n >= 2 || hasMedium) return 'medium';
              return 'quick';
            }

            let splitsCreated = 0, parentsMarked = 0, skipped = 0;

            for (const parent of candidates) {
              if (splitsCreated >= maxSplits) {
                console.log(`Reached MAX_SPLITS_PER_RUN=${maxSplits} — defer remaining`);
                break;
              }
              const body = parent.body || '';
              const viols = [];
              for (const m of body.matchAll(/- \[ \] \*\*(\w+)\*\* — (.+)/g)) {
                viols.push({ metric: m[1], violation: m[2].trim() });
              }
              if (viols.length < threshold) { skipped++; continue; }

              // Group violations by metric, then chunk by maxPerSub
              const byMetric = {};
              for (const v of viols) {
                if (!byMetric[v.metric]) byMetric[v.metric] = [];
                byMetric[v.metric].push(v);
              }
              const groups = [];
              let current = [];
              for (const [metric, vList] of Object.entries(byMetric)) {
                for (const v of vList) {
                  current.push(v);
                  if (current.length >= maxPerSub) {
                    groups.push({ viols: [...current], complexity: determineComplexity(current) });
                    current = [];
                  }
                }
              }
              if (current.length > 0) {
                groups.push({ viols: current, complexity: determineComplexity(current) });
              }

              console.log(`  #${parent.number}: ${viols.length} viols → ${groups.length} sub-issues`);

              // Create sub-issues
              const fileId = (body.match(/<!--\s*file:\s*(.+?)\s*-->/) || [])[1]?.trim() || 'unknown';
              for (let i = 0; i < groups.length; i++) {
                if (splitsCreated >= maxSplits) break;
                const group = groups[i];
                const subTitle = `[Sub ${i+1}/${groups.length}] ${parent.title.replace(/^\[[^\]]+\]\s*/, '')}`;
                const subLabels = ['verify-task', 'sub-issue', `complexity:${group.complexity}`];

                // Collect metric labels too (for filtering)
                const metricsSet = new Set(group.viols.map(v => v.metric.toLowerCase()));
                for (const m of metricsSet) subLabels.push(m);

                const subBody = [
                  `<!-- parent: ${parent.number} -->`,
                  `<!-- file: ${fileId} -->`,
                  ...group.viols.map(v => `<!-- dedup: ${v.metric}:${v.violation} -->`),
                  ``,
                  `## Sub-задача ${i+1}/${groups.length} для parent #${parent.number}`,
                  ``,
                  `**Parent:** #${parent.number}`,
                  `**Файл / сигнатура:** \`${fileId}\``,
                  `**Пунктов в подзадаче:** ${group.viols.length}`,
                  `**Сложность:** complexity:${group.complexity}`,
                  ``,
                  `### Нарушения`,
                  ``,
                  ...group.viols.map(v => `- [ ] **${v.metric}** — ${v.violation}`),
                  ``,
                  `### Что нужно сделать`,
                  ``,
                  `1. Найти файл в репозитории по id выше.`,
                  `2. Для каждой метрики выполнить соответствующий чек-лист (см. SkyNet_PROMPT).`,
                  `3. Зафиксировать изменения, отметить пункты [x], закрыть sub-issue.`,
                  ``,
                  `### Критерии закрытия`,
                  ``,
                  `- Все пункты чек-листа отмечены [x]`,
                  `- Parent #${parent.number} автоматически закроется, когда все sub-issues закрыты`,
                  ``,
                  `**Авто-создано v9.58 split step.**`,
                  `**Коммит:** ${context.sha.substring(0, 8)}`,
                  `**Run:** ${context.runId}`,
                ].join('\n');

                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: subTitle, body: subBody, labels: subLabels,
                });
                splitsCreated++;
                await sleep(sleepMs);
              }

              // Mark parent: add 'parent' + 'split-done' labels
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: parent.number, labels: ['parent', 'split-done'],
              });
              parentsMarked++;

              // Roadmap comment
              const roadmap = [
                `## 📋 Sub-issues roadmap (auto-split v9.58)`,
                ``,
                `Parent issue разбит на ${groups.length} подзадач:`,
                ``,
                `| Sub # | Метрики | Сложность |`,
                `|---|---|---|`,
                ...groups.map((g, i) => `| ${i+1} | ${[...new Set(g.viols.map(v => v.metric))].join(', ')} | complexity:${g.complexity} |`),
                ``,
                `**Parent закроется автоматически** когда все sub-issues закрыты (проверяется в шаге Parent-auto-close).`,
                `*Авто-split v9.58.*`,
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: parent.number, body: roadmap,
              });
            }

            console.log(`Splits created: ${splitsCreated}, Parents marked: ${parentsMarked}, Skipped (under threshold): ${skipped}`);

      - name: Auto-close parent when all sub-issues closed (v9.58)
        # v9.58: если у parent все sub-issues закрыты → закрыть parent автоматически.
        if: always() && steps.violations.outputs.partial != '1'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Найти все ОТКРЫТЫЕ parent issues
            const parents = [];
            for (let page = 1; page <= 5; page++) {
              const resp = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'verify-task,parent', state: 'open',
                per_page: 100, page,
              });
              if (resp.data.length === 0) break;
              parents.push(...resp.data);
              if (resp.data.length < 100) break;
            }
            if (parents.length === 0) {
              console.log('No open parent issues — skip parent-auto-close');
              return;
            }
            console.log(`Open parents: ${parents.length}`);

            // 2. Найти все sub-issues (state=all)
            const allSubs = [];
            for (let page = 1; page <= 10; page++) {
              const resp = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'verify-task,sub-issue', state: 'all',
                per_page: 100, page,
              });
              if (resp.data.length === 0) break;
              allSubs.push(...resp.data);
              if (resp.data.length < 100) break;
            }
            console.log(`All sub-issues: ${allSubs.length}`);

            // 3. Для каждого parent — проверить, все ли sub закрыты
            let closed = 0;
            for (const parent of parents) {
              const parentNum = parent.number;
              const subsForParent = allSubs.filter(s => {
                const body = s.body || '';
                const m = body.match(/<!--\s*parent:\s*(\d+)\s*-->/);
                return m && parseInt(m[1]) === parentNum;
              });

              if (subsForParent.length === 0) {
                console.log(`  #${parentNum}: no sub-issues found — skip`);
                continue;
              }

              const openSubs = subsForParent.filter(s => s.state === 'open');
              if (openSubs.length > 0) {
                console.log(`  #${parentNum}: ${openSubs.length}/${subsForParent.length} sub-issues still open`);
                continue;
              }

              // Все sub-issues закрыты — закрыть parent
              const closeBody = [
                `## ✅ Parent closed — all sub-issues done (v9.58)`,
                ``,
                `Все ${subsForParent.length} sub-issues закрыты. Parent автоматически закрывается.`,
                ``,
                `| Sub # | Title | State |`,
                `|---|---|---|`,
                ...subsForParent.map(s => `| #${s.number} | ${s.title} | ${s.state} |`),
                ``,
                `**Коммит-инициатор:** [${context.sha.substring(0, 8)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})`,
                `**Run:** ${context.runId}`,
                ``,
                `*Авто-закрыто verify_decomposition.yml v9.58 — parent auto-close.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: parentNum, body: closeBody,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: parentNum, state: 'closed', state_reason: 'completed',
              });
              console.log(`  ✓ closed parent #${parentNum}`);
              closed++;
            }
            console.log(`Parents auto-closed: ${closed}`);

      - name: Auto-close stale issues (file-level - file has 0 current violations)
        if: always() && steps.violations.outputs.partial != '1'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { normalizeViolationKey, legacyMetricFromTitle, extractFileId } = require('./scripts/_dedup_keys.js');

            let violations;
            try {
              violations = JSON.parse(fs.readFileSync('violations.json', 'utf-8'));
            } catch (e) {
              console.log('violations.json not found — skip auto-close');
              return;
            }

            // === v9.57: текущий список file_ids (не dedup_keys) ===
            const currentFiles = new Set();
            const currentKeys = new Set();  // legacy fallback
            for (const [metric, violList] of Object.entries(violations)) {
              for (const v of violList) {
                currentFiles.add(extractFileId(metric, v));
                currentKeys.add(normalizeViolationKey(metric, v));
              }
            }
            console.log(`Current: ${currentFiles.size} files, ${currentKeys.size} dedup_keys`);

            // === Загрузка всех ОТКРЫТЫХ verify-task issues ===
            const openIssues = [];
            for (let page = 1; page <= 10; page++) {
              const resp = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                labels: 'verify-task', state: 'open',
                per_page: 100, page: page,
              });
              if (resp.data.length === 0) break;
              openIssues.push(...resp.data);
              if (resp.data.length < 100) break;
            }
            console.log(`Open verify-task issues: ${openIssues.length}`);

            let closed = 0, protectedInProgress = 0, noFileMarker = 0, stillHasViolations = 0;

            for (const issue of openIssues) {
              const labels = issue.labels.map(l => l.name);
              if (labels.includes('in-progress')) {
                protectedInProgress++;
                continue;  // cron-агент в работе — не трогаем
              }

              const body = issue.body || '';
              const fileMarker = body.match(/<!--\s*file:\s*(.+?)\s*-->/);

              // === v9.57: новый путь — для issues с маркером <!-- file: ... -->
              if (fileMarker) {
                const fileId = fileMarker[1].trim();
                if (currentFiles.has(fileId)) {
                  stillHasViolations++;  // у файла ещё есть violations — не закрываем
                  continue;
                }
                // Файл полностью очищен — закрываем
                const staleBody = [
                  `## ⏱️ Auto-closed as stale (file-level, v9.57)`,
                  ``,
                  `**file_id:** \`${fileId}\``,
                  ``,
                  `Файл \`${fileId}\` больше не присутствует в текущем выводе \`validate_decomposition.py\` — все нарушения этого файла были исправлены в предыдущих коммитах.`,
                  ``,
                  `Раньше (v9.36) auto-close закрывал per-violation (по dedup_key), что приводило к ложным закрытиям, когда один violation исчезал, а другие по тому же файлу оставались. Теперь (v9.57) закрытие происходит только когда у файла 0 violations в текущем выводе валидатора.`,
                  ``,
                  `**Коммит-инициатор:** [${context.sha.substring(0, 8)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})`,
                  `**Run:** ${context.runId}`,
                  ``,
                  `*Авто-закрыто verify_decomposition.yml v9.57 — auto-close stale (file-level).*`,
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, body: staleBody,
                });

                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed', state_reason: 'completed',
                });

                console.log(`  closed #${issue.number} (file: ${fileId})`);
                closed++;
                continue;
              }

              // === LEGACY fallback: для старых issues без маркера <!-- file: -->
              // Сохраняем старую логику: extract dedup_key → close если нет в currentKeys
              const marker = body.match(/<!--\s*dedup:\s*(.+?)\s*-->/);
              let key = null;
              if (marker) {
                key = marker[1].trim();
              } else {
                const viol = body.match(/\*\*Нарушение:\*\*\s*(.+)/);
                if (viol) {
                  const metric = legacyMetricFromTitle(issue.title, viol[1].trim());
                  key = normalizeViolationKey(metric, viol[1].trim());
                }
              }

              if (!key) {
                noFileMarker++;
                continue;  // очень старый issue без маркера — пропускаем
              }

              if (currentKeys.has(key)) {
                continue;  // нарушение ещё актуально
              }

              // Нарушение исчезло — закрываем как stale (legacy path)
              const staleBody = [
                `## ⏱️ Auto-closed as stale (legacy v9.33 path, v9.57-compatible)`,
                ``,
                `**dedup_key:** \`${key}\``,
                ``,
                `Нарушение \`${key}\` больше не присутствует в текущем выводе валидатора.`,
                ``,
                `Issue создан по старой логике (без маркера \<!-- file: --\>), поэтому auto-close v9.57 использует legacy-путь per-violation.`,
                ``,
                `**Коммит-инициатор:** [${context.sha.substring(0, 8)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})`,
                `**Run:** ${context.runId}`,
                ``,
                `*Авто-закрыто verify_decomposition.yml v9.57 — auto-close stale (legacy).*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, body: staleBody,
              });

              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed', state_reason: 'completed',
              });

              console.log(`  closed #${issue.number} (legacy key: ${key})`);
              closed++;
            }

            console.log(`Auto-closed stale: ${closed}`);
            console.log(`Protected (in-progress): ${protectedInProgress}`);
            console.log(`Skipped (no marker, legacy): ${noFileMarker}`);
            console.log(`Skipped (file still has violations): ${stillHasViolations}`);

      - name: Summary
        if: always()
        run: |
          echo "## Decomposition Verification Tasks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Violations (full list) | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| F22 | ${{ steps.violations.outputs.F22_count }} | Source URL required |" >> $GITHUB_STEP_SUMMARY
          echo "| F23 | ${{ steps.violations.outputs.F23_count }} | Anti-template detection |" >> $GITHUB_STEP_SUMMARY
          echo "| F24 | ${{ steps.violations.outputs.F24_count }} | Subtype compliance |" >> $GITHUB_STEP_SUMMARY
          echo "| F25 | ${{ steps.violations.outputs.F25_count }} | Data uniqueness |" >> $GITHUB_STEP_SUMMARY
          echo "| F26 | ${{ steps.violations.outputs.F26_count }} | Within-parent duplicates |" >> $GITHUB_STEP_SUMMARY
          echo "| F27 | ${{ steps.violations.outputs.F27_count }} | Unfilled materials (used by izdeliya) |" >> $GITHUB_STEP_SUMMARY
          echo "| F27b | ${{ steps.violations.outputs.F27b_count }} | Missing material files (referenced in frontmatter but file does not exist) |" >> $GITHUB_STEP_SUMMARY
          echo "| F27c | ${{ steps.violations.outputs.F27c_count }} | Missing technology files (referenced in frontmatter but file does not exist) |" >> $GITHUB_STEP_SUMMARY
          echo "| F27d | ${{ steps.violations.outputs.F27d_count }} | Broken typical material refs in tech frontmatter (типичные_материалы_для_процесса, soft) |" >> $GITHUB_STEP_SUMMARY
          echo "| F27e | ${{ steps.violations.outputs.F27e_count }} | Parts with материалы_частей missing технологии_частей (обязательность связи) |" >> $GITHUB_STEP_SUMMARY
          echo "| F27f | ${{ steps.violations.outputs.F27f_count }} | технологии_частей entries missing материалы_для_процесса (обязательность) |" >> $GITHUB_STEP_SUMMARY
          echo "| F27g | ${{ steps.violations.outputs.F27g_count }} | Broken material refs in технологии_частей.материалы_для_процесса |" >> $GITHUB_STEP_SUMMARY
          echo "| F28 | ${{ steps.violations.outputs.F28_count }} | Materials without alternative forms/variants (for AI product variants) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **${{ steps.violations.outputs.total_violations }}** | — |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Violation source:** ${{ steps.violations.outputs.partial == '1' && 'TRUNCATED log fallback (auto-close DISABLED)' || 'complete --json-out' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Anti-parallel:** concurrency group `verify-decomposition-${{ github.ref }}` serializes runs." >> $GITHUB_STEP_SUMMARY
          echo "**Anti-duplicate:** dedup checks ALL issues (open+closed) via stable `dedup_key`." >> $GITHUB_STEP_SUMMARY
          echo "**Hybrid model (v9.57):** one issue per file_id; supplement comments add new violations to existing open issues." >> $GITHUB_STEP_SUMMARY
          echo "**Issue cap:** max `MAX_NEW_ISSUES`=200 new per run + `MAX_SUPPLEMENT_PER_RUN`=500 supplements (file-grouped, v9.57)." >> $GITHUB_STEP_SUMMARY
          echo "**Auto-close stale:** open verify-task issues whose `file_id` has 0 current violations are auto-closed (skips `in-progress`); legacy issues (no `<!-- file: -->` marker) use per-dedup_key path." >> $GITHUB_STEP_SUMMARY

