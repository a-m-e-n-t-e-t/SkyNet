# SkyNet Decomposition Verification — auto-create issues for files needing verification
# v9.32: anti-duplicate / anti-parallel hardening
#
# Триггеры:
#   - push на main с изменениями в реальные данные/ или фантастические данные/
#   - workflow_dispatch (ручной запуск)
#
# Что делает:
#   1. Запускает validate_decomposition.py — получает список violations F22-F25
#   2. Для каждого violation создаёт GitHub issue с меткой `verify-task`
#      (БЕЗ дублирования — проверяет все issues: open+closed,
#       использует стабильный dedup_key в теле issue)
#   3. Issues обрабатываются cron-агентом (job 502055)
#
# ANTI-PARALLEL:
#   - concurrency.group = verify-decomposition-${{ github.ref }}
#     с cancel-in-progress: false — параллельные push'и становятся в очередь,
#     а не запускают параллельные runs (что вызывало дубли issues #153/#154 и т.п.)
#
# ANTI-DUPLICATE:
#   - Запрашиваем ВСЕ issues с меткой verify-task (state=all),
#     включая закрытые — если задача была решена ранее, новый issue не создаём
#   - dedup_key хранится в HTML-комментарии в теле issue
#     (стабилен между запусками, не зависит от количества файлов в F25)
#   - existingKeys Set обновляется после каждого create — нет дубликатов внутри одного run
#   - Regex для fileId поддерживает кириллицу (часть_...)

name: Decomposition — create verification tasks

on:
  push:
    branches: [main]
    paths:
      - 'реальные данные/**'
      - 'фантастические данные/**'
      - 'scripts/validate_decomposition.py'
  workflow_dispatch:

concurrency:
  group: verify-decomposition-${{ github.ref }}
  # НЕ отменяем queued runs — пусть дождутся своей очереди.
  # Это гарантирует что параллельные push'и НЕ создадут дубликаты issues.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  create-tasks:
    name: Create verification issues for F22-F25 violations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Run validate_decomposition.py — get F22-F25 violations
        id: violations
        run: |
          set +e
          python scripts/validate_decomposition.py 2>&1 | tee validate_output.log
          # Извлечь violations из вывода и сохранить в JSON (с dedup_key)
          python -c "
          import json, re, sys
          
          violations = {'F22': [], 'F23': [], 'F24': [], 'F25': []}
          current_metric = None
          
          with open('validate_output.log') as f:
              for line in f:
                  m = re.match(r'=== (F2[2-5]):', line.strip())
                  if m:
                      current_metric = m.group(1)
                      continue
                  if current_metric and line.strip().startswith('- '):
                      violations[current_metric].append(line.strip()[2:])
          
          with open('violations.json', 'w') as f:
              json.dump(violations, f, ensure_ascii=False, indent=2)
          
          total = sum(len(v) for v in violations.values())
          print(f'Total violations: {total}')
          for metric, vs in violations.items():
              print(f'  {metric}: {len(vs)} violations')
          "
          
          echo "total_violations=$(python -c 'import json; d=json.load(open(\"violations.json\")); print(sum(len(v) for v in d.values()))')" >> $GITHUB_OUTPUT

      - name: Create issues for each violation (anti-duplicate)
        if: steps.violations.outputs.total_violations != '0'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const violations = JSON.parse(fs.readFileSync('violations.json', 'utf-8'));
            
            // ---------------------------------------------------------------
            // Query ALL issues (open + closed) with label verify-task.
            // Anti-duplicate: if a task was already solved (closed), we don't recreate.
            // ---------------------------------------------------------------
            const existingIssues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'verify-task',
              state: 'all',
              per_page: 100
            });
            
            // Key normalization shared by new violations AND legacy issue bodies.
            //   F22/F23/F24: '<metric>:<fileId>'  — fileId is everything before the first colon
            //   F25:         '<metric>:<param_signature>'  — from 'с габаритами' until next ':'
            function normalizeViolationKey(metric, violation) {
              if (metric === 'F25' || violation.startsWith('Дубликат:')) {
                const m = violation.match(/с габаритами\s+([^:]+?)\s*:/);
                if (m) return `${metric}:${m[1].trim()}`;
                const idx = violation.indexOf(': [');
                return `${metric}:${idx > 0 ? violation.substring(0, idx) : violation}`;
              }
              const colonIdx = violation.indexOf(':');
              const fileId = colonIdx > 0 ? violation.substring(0, colonIdx).trim() : violation.substring(0, 80);
              return `${metric}:${fileId}`;
            }
            
            // Build Set of existing dedup_keys from issue bodies:
            //   1) primary: hidden marker '<!-- dedup: <key> -->' (issues created after 6573aea)
            //   2) fallback: legacy issues — parse '**Нарушение:**' from body and normalize
            //      (old titles are truncated to 50 chars and cannot be used for matching)
            const existingKeys = new Set();
            for (const issue of existingIssues.data) {
              const body = issue.body || '';
              const marker = body.match(/<!--\s*dedup:\s*(.+?)\s*-->/);
              if (marker) {
                existingKeys.add(marker[1].trim());
                continue;
              }
              // Legacy fallback: full violation text lives in the body
              const viol = body.match(/\*\*Нарушение:\*\*\s*(.+)/);
              if (viol) {
                const metricMatch = issue.title.match(/\[(F2[2-5])\]/);
                const metric = metricMatch ? metricMatch[1] : 'F25';
                existingKeys.add(normalizeViolationKey(metric, viol[1].trim()));
              }
            }
            console.log(`Existing dedup_keys: ${existingKeys.size} (open+closed, marker+legacy-body fallback)`);
            
            let created = 0;
            let skipped = 0;
            
            for (const [metric, violList] of Object.entries(violations)) {
              for (const v of violList) {
                const dedupKey = normalizeViolationKey(metric, v);
                
                if (existingKeys.has(dedupKey)) {
                  skipped++;
                  continue;  // уже есть issue (open ИЛИ closed) — не создаём дубль
                }
                
                // Build readable title
                let title;
                if (metric === 'F25') {
                  // F25: title uses param signature (without count)
                  const m = v.match(/с габаритами\s+([^:]+?)\s*:/);
                  const sig = m ? m[1].trim() : v.substring(0, 60);
                  title = `[${metric}] Verify: Дубликат габаритов: ${sig}`;
                } else {
                  const colonIdx = v.indexOf(':');
                  const fileId = colonIdx > 0 ? v.substring(0, colonIdx).trim() : v.substring(0, 50);
                  title = `[${metric}] Verify: ${fileId}`;
                }
                
                // Build body — include hidden dedup_key marker for future runs
                const body = [
                  `<!-- dedup: ${dedupKey} -->`,
                  ``,
                  `## Задача верификации: ${metric}`,
                  ``,
                  `**Метрика:** ${metric}`,
                  `**Файл / сигнатура:** \`${dedupKey.substring(metric.length + 1)}\``,
                  `**Нарушение:** ${v}`,
                  ``,
                  `### Что нужно сделать`,
                  ``,
                  `1. Найти файл в репозитории по id из нарушения выше`,
                  `2. Провести реальный веб-поиск для этого компонента`,
                  `3. Заполнить реальные данные:`,
                  `   - материал (конкретный, не generic_material)`,
                  `   - габариты (из datasheet/canon)`,
                  `   - источник_url (URL веб-источника)`,
                  `   - описание (не шаблонное)`,
                  `4. Зафиксировать изменения и закрыть issue`,
                  ``,
                  `### Критерии закрытия`,
                  ``,
                  `- F22: источник_url заполнен конкретным URL`,
                  `- F23: нет generic_material, нет шаблонного описания`,
                  `- F24: все ожидаемые поля для подтипа присутствуют`,
                  `- F25: параметры уникальны (≤2 файлов с одинаковыми)`,
                  ``,
                  `**Авто-создано:** ${new Date().toISOString()}`,
                  `**Коммит:** ${context.sha.substring(0, 8)}`,
                  `**Run:** ${context.runId}`,
                ].join('\n');
                
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['verify-task', metric.toLowerCase(), 'auto-generated'],
                });
                
                // CRITICAL: update Set to prevent within-run duplicates
                existingKeys.add(dedupKey);
                created++;
              }
            }
            
            console.log(`Created: ${created}, Skipped (duplicates): ${skipped}`);

      - name: Summary
        if: always()
        run: |
          echo "## Decomposition Verification Tasks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Violations | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| F22 | ${{ steps.violations.outputs.total_violations }} | Source URL required |" >> $GITHUB_STEP_SUMMARY
          echo "| F23 | — | Anti-template detection |" >> $GITHUB_STEP_SUMMARY
          echo "| F24 | — | Subtype compliance |" >> $GITHUB_STEP_SUMMARY
          echo "| F25 | — | Data uniqueness |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Anti-parallel:** concurrency group \`verify-decomposition-\${{ github.ref }}\` serializes runs." >> $GITHUB_STEP_SUMMARY
          echo "**Anti-duplicate:** dedup checks ALL issues (open+closed) via stable \`dedup_key\`." >> $GITHUB_STEP_SUMMARY
