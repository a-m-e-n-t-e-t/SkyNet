# SkyNet Decomposition Verification — auto-create issues for files needing verification
# v9.36: оптимизация — единый модуль scripts/_dedup_keys.js для normalizeViolationKey
#   (устранён copy-rot: auto-close копия не знала про F26 → ложное закрытие F26 issues);
#   пагинация списка issues в шаге создания (>100 issues больше не теряются);
#   schedule сокращён до каждые 3 ч (push-триггеры покрывают основной поток).
# v9.34: полный список violations через --json-out (исправление критичного бага v9.33)
#
# БАГ v9.33 и ранее: нарушения парсились из человеческого лога валидатора,
# который печатает только ПЕРВЫЕ 3 violations на метрику (violations[:3], v[:100]).
# Следствия:
#   (а) issues создавались только для случайного вращающегося подмножества из 3×4 нарушений;
#   (б) auto-close stale сверял ВСЕ открытые issues с этим же обрезанным списком
#       → ложно закрывал бы актуальные issues (нарушение «исчезло», потому что
#         не попало в первые 3 напечатанные строки).
# v9.34: валидатор запускается с --json-out violations.json — ПОЛНЫЙ список (сейчас ~900).
# Лог-парсинг оставлен только как fallback; при fallback авто-закрытие ЗАПРЕЩЕНО (partial=1).
# Создание issues: справедливый round-robin между метриками + лимит MAX_NEW_ISSUES
# за прогон (защита от флуда issue-очереди одним коммитом). + schedule
#
# Триггеры:
#   - push на main с изменениями в реальные данные/ или фантастические данные/
#   - push с правками самого workflow, валидатора или scripts/_dedup_keys.js
#   - schedule: каждые 3 часа в :15 (закрытие stale issues без ожидания push;
#     push-триггеры покрывают основной поток — агент пушит после каждой партии)
#   - workflow_dispatch (ручной запуск)
#
# Что делает:
#   1. Запускает validate_decomposition.py --json-out — ПОЛНЫЙ список violations F22-F25
#   2. Создаёт GitHub issues с меткой `verify-task` для первых MAX_NEW_ISSUES нарушений
#      (round-robin между метриками; БЕЗ дублирования — проверяет все issues:
#       open+closed, использует стабильный dedup_key в теле issue)
#   3. AUTO-CLOSE STALE (только при ПОЛНОМ списке, partial=0): для каждого открытого
#      verify-task issue, чей dedup_key отсутствует в текущих violations, автоматически
#      закрывает как stale (НЕ трогает issues с меткой in-progress — cron-агент работает)
#   4. Issues обрабатываются cron-агентом (job 504119)
#
# ANTI-PARALLEL:
#   - concurrency.group = verify-decomposition-${{ github.ref }}
#     с cancel-in-progress: false — параллельные push'и становятся в очередь,
#     а не запускают параллельные runs (что вызывало дубли issues #153/#154 и т.п.)
#
# ANTI-DUPLICATE:
#   - Запрашиваем ВСЕ issues с меткой verify-task (state=all),
#     включая закрытые — если задача была решена ранее, новый issue не создаём
#   - dedup_key хранится в HTML-комментарии в теле issue
#     (стабилен между запусками, не зависит от количества файлов в F25)
#   - existingKeys Set обновляется после каждого create — нет дубликатов внутри одного run
#   - Regex для fileId поддерживает кириллицу (часть_...)
#
# AUTO-CLOSE STALE (новое в v9.33):
#   - Проблема: workflow создавал issue по старому checkout'у, фикс устранял нарушение,
#     но issue оставался открытым — cron-агент тратил циклы на ручное закрытие (#133 и др.)
#   - Решение: после создания новых issues проходим по всем открытым verify-task,
#     извлекаем dedup_key, и если его нет в текущих violations — закрываем как stale
#     с комментарием «Auto-closed: violation gone from current validator output»
#   - in-progress issues НЕ закрываем (cron-агент в работе)
#   - Issues без извлекаемого dedup_key (очень старые) не трогаем

name: Decomposition — create verification tasks

on:
  push:
    branches: [main]
    paths:
      - 'реальные данные/**'
      - 'фантастические данные/**'
      - 'scripts/validate_decomposition.py'
      - 'scripts/_dedup_keys.js'
      - '.github/workflows/verify_decomposition.yml'
  workflow_dispatch:
  schedule:
    # Каждые 3 часа в :15 — закрытие stale issues даже без push.
    # v9.36: было каждый час; push-триггеры (агент пушит каждую партию) покрывают
    # основной поток, ежечасный запуск лишь сжигал минуты Actions.
    - cron: '15 */3 * * *'

concurrency:
  group: verify-decomposition-${{ github.ref }}
  # НЕ отменяем queued runs — пусть дождутся своей очереди.
  # Это гарантирует что параллельные push'и НЕ создадут дубликаты issues.
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  create-tasks:
    name: Create verification issues for F22-F25 violations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Run validate_decomposition.py — get F22-F28 violations
        id: violations
        run: |
          set +e
          # v9.34: полный machine-readable список violations через --json-out.
          # v9.35: добавлена метрика F26 (внутри-родительские дубликаты).
          # v9.40: добавлена метрика F27 (незаполненные материалы, используемые изделиями).
          # v9.42: добавлена метрика F28 (альтернативные формы материалов для AI-вариантов изделий).
          # v9.41: расширение F27 — критерий (e): вариант_структуры должен быть
          #        указан (preventive); checklist уточнён — web_search ищет ВСЕ
          #        структурные формы (mono/poly/amorphous/...), полиморфные кристаллы
          #        требуют конкретной фазы; добавлено поле структурные_формы_альтернативы.
          # Человеческий лог (validate_output.log) печатает только первые 3 violations
          # на метрику — его парсинг НЕ использовать, он обрезает ~900 до 9.
          python scripts/validate_decomposition.py --json-out violations.json 2>&1 | tee validate_output.log
          VALIDATOR_EXIT=$?

          # Явная проверка: violations.json должен существовать и быть непустым
          if [ ! -s violations.json ]; then
            echo "::error::validate_decomposition.py did not produce violations.json (exit=$VALIDATOR_EXIT). Auto-close step will be skipped."
            echo "total_violations=0" >> $GITHUB_OUTPUT
            echo "partial=1" >> $GITHUB_OUTPUT
            exit 0   # не падаем весь workflow — Summary всё равно полезен
          fi

          echo "partial=0" >> $GITHUB_OUTPUT
          echo "using complete --json-out violations list"

          # v9.36: один вызов python вместо 6 — печатает total и per-metric в одном subprocess
          # v9.39.5 fix: в GITHUB_OUTPUT допустимы ТОЛЬКО строки key=value — отладочные
          # print() вида "Total violations: N" ломали парсер (Invalid format) и делали
          # workflow failure хроническим с a0c14b1. Отладка — только в stdout шага.
          python3 - <<'PYEOF' >> $GITHUB_OUTPUT
          import json
          d = json.load(open('violations.json'))
          total = sum(len(v) for v in d.values())
          print(f"total_violations={total}")
          for M in ('F22','F23','F24','F25','F26','F27','F28','F31','F32','F34'):
              print(f"{M}_count={len(d.get(M, []))}")
          PYEOF
          # info-лог в stdout шага (одинарные кавычки — без bash-интерполяции):
          python3 - <<'PYEOF'
          import json
          d = json.load(open('violations.json'))
          print(f"[info] Total violations: {sum(len(v) for v in d.values())}")
          for M in ('F22','F23','F24','F25','F26','F27','F28','F31','F32','F34'):
              print(f"[info]   {M}: {len(d.get(M, []))} violations")
          PYEOF

      - name: Create issues for each violation (anti-duplicate, round-robin, capped)
        if: steps.violations.outputs.total_violations != '0'
        uses: actions/github-script@v7
        env:
          MAX_NEW_ISSUES: '6'   # защита от флуда очереди одним прогоном; остальные нарушения поймает следующий push
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const violations = JSON.parse(fs.readFileSync('violations.json', 'utf-8'));
            const { normalizeViolationKey, legacyMetricFromTitle } = require('./scripts/_dedup_keys.js');
            
            // Round-robin очередь между метриками: F22, F23, F24, F25, F22, F23, ...
            // (иначе лимит MAX_NEW_ISSUES выбирал бы только первую метрику)
            const roundRobinQueue = [];
            const lists = Object.entries(violations).map(([metric, arr]) => ({ metric, arr, i: 0 }));
            let progressed = true;
            while (progressed) {
              progressed = false;
              for (const l of lists) {
                if (l.i < l.arr.length) {
                  roundRobinQueue.push([l.metric, l.arr[l.i++]]);
                  progressed = true;
                }
              }
            }
            console.log(`Round-robin queue: ${roundRobinQueue.length} violations total`);
            
            // ---------------------------------------------------------------
            // Query ALL issues (open + closed) with label verify-task.
            // Anti-duplicate: if a task was already solved (closed), we don't recreate.
            // v9.36: пагинация — без неё при >100 issues дедуп-проверка теряла
            //        старые ключи и создавала дубликаты (#153/#154 инцидент).
            // ---------------------------------------------------------------
            const existingIssues = [];
            for (let page = 1; page <= 10; page++) {  // safety cap: 1000 issues
              const resp = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'verify-task',
                state: 'all',
                per_page: 100,
                page: page,
              });
              if (resp.data.length === 0) break;
              existingIssues.push(...resp.data);
              if (resp.data.length < 100) break;
            }
            console.log(`Loaded ${existingIssues.length} existing verify-task issues (open+closed)`);
            
            // Key normalization — единый источник: scripts/_dedup_keys.js
            // v9.36: ранее функция была скопирована в 2 места (create + auto-close)
            // auto-close копия не получила F26-ветку → F26 issues ложно закрывались как stale.
            // Теперь оба шага require() один модуль — copy-rot структурно невозможен.
            // (Определение см. в scripts/_dedup_keys.js)
            
            // Legacy fallback для старых issues: extract violation text + metric
            const existingKeys = new Set();
            for (const issue of existingIssues) {
              const body = issue.body || '';
              const marker = body.match(/<!--\s*dedup:\s*(.+?)\s*-->/);
              if (marker) {
                existingKeys.add(marker[1].trim());
                continue;
              }
              const viol = body.match(/\*\*Нарушение:\*\*\s*(.+)/);
              if (viol) {
                const metric = legacyMetricFromTitle(issue.title, viol[1].trim());
                existingKeys.add(normalizeViolationKey(metric, viol[1].trim()));
              }
            }
            console.log(`Existing dedup_keys: ${existingKeys.size} (open+closed, marker+legacy-body fallback)`);
            
            const maxNew = parseInt(process.env.MAX_NEW_ISSUES || '6', 10);
            let created = 0;
            let skipped = 0;
            let deferred = 0;
            
            for (const [metric, v] of roundRobinQueue) {
              const dedupKey = normalizeViolationKey(metric, v);
              
              if (existingKeys.has(dedupKey)) {
                skipped++;
                continue;  // уже есть issue (open ИЛИ closed) — не создаём дубль
              }
              
              if (created >= maxNew) {
                deferred++;  // лимит прогона — нарушение останется в полном списке для следующего push
                continue;
              }
                
                // Build readable title
                let title;
                if (metric === 'F25') {
                  // F25: title uses param signature (without count)
                  const m = v.match(/с габаритами\s+([^:]+?)\s*:/);
                  const sig = m ? m[1].trim() : v.substring(0, 60);
                  title = `[${metric}] Verify: Дубликат габаритов: ${sig}`;
                } else if (metric === 'F26') {
                  // F26: "Родитель X: подтип 'Y' имеет N файлов..."
                  const m = v.match(/Родитель\s+(\S+?):\s*подтип\s+'([^']+)'/);
                  const parent = m ? m[1] : v.substring(0, 50);
                  title = `[${metric}] Verify: Дубликат внутри родителя: ${parent}`;
                } else {
                  const colonIdx = v.indexOf(':');
                  const fileId = colonIdx > 0 ? v.substring(0, colonIdx).trim() : v.substring(0, 50);
                  title = `[${metric}] Verify: ${fileId}`;
                }
                
                // Build body — include hidden dedup_key marker for future runs
                // v9.40: F27 (материалы) — свой чек-лист: свойства материала вместо габаритов части
                // v9.41: добавлен раздел про структурные формы (mono/poly/amorphous/...) —
                //        web_search должен искать ВСЕ формы материала, выбрать конкретную
                //        под применение и зафиксировать в вариант_структуры; альтернативы
                //        (для AI-генерации вариантов изделий) — в структурные_формы_альтернативы.
                // v9.42: F28 — отдельный чек-лист перечня форм (полиморфы/составы) в
                //        схемных полях сравнение_структур / варианты_по_применению.
                const isMaterial = metric === 'F27' || metric === 'F28';
                const isForms = metric === 'F28';
                const isDedup = metric === 'F31' || metric === 'F32';
                const isDepth = metric === 'F34';
                const checklist = isDedup
                  ? [
                      `   - ВНИМАНИЕ: веб-поиск НЕ нужен — это метрика дедупликации (v9.44)`,
                      metric === 'F31'
                        ? `   - F31 (id/алиасы): проверить симметрию алиас-связи — файл с канонический_id=X должен быть перечислен в псевдонимах X и наоборот`
                        : `   - F32 (семантический дубль): сравнить химический_состав и ключевые свойства пары — один материал или разные`,
                      metric === 'F31'
                        ? `   - исправить: scripts/migrate_aliases.py (обновить DUPLICATE_PAIRS) или вручную выровнять канонический_id/псевдонимы в паре файлов`
                        : `   - если один материал: слить через python3 scripts/migrate_dedup_materials.py --alias <дубль> --canonical <канонический> (заполняет псевдонимы, перезаписывает ссылки, удаляет алиас-файл)`,
                      metric === 'F31'
                        ? `   - нормализованная коллизия (id отличаются только [-_]) без алиас-связи → объявить связь или переименовать файл`
                        : `   - если разные материалы (false-positive): закрыть issue с обоснованием в комментарии (пример известного FP: material_pbo2 vs material_spongy_lead — общий источник_url, разные материалы)`,
                    ]
                  : isForms
                  ? [
                      `   - перечислить ВСЕ распространённые формы материала: монокристалл | поликристалл | аморфный | полиморфы (SiC: 3C/4H/6H; SiO₂: α/β-кварц/кристобалит; C: графит/алмаз; TiO₂: рутил/анатаз/брукит; ...)`,
                      `   - для аморфных материалов (термореактивы, стёкла) ось кристалличности вырождена — перечислить варианты составов/конфигураций: наполненный/ненаполненный, гибкий/жёсткий, разные отвердители/наполнители`,
                      `   - по каждой форме указать ключевые свойства (запрещённая зона, теплопроводность, плотность, Tg/CTE — что применимо)`,
                      `   - записать в схемные поля: сравнение_структур (полиморфы) и/или варианты_по_применению (составы) — формат: ключ → {описание, свойства, применение}`,
                      `   - допустимо альтернативное поле структурные_формы_альтернативы (массив, как в чек-листе F27 v9.41)`,
                      `   - источник_url по каждой форме/варианту (или общий источник с обоснованием)`,
                    ]
                  : isDepth
                  ? [
                      `   - ВНИМАНИЕ: веб-поиск НЕ нужен — это метрика глубины декомпозиции (v9.47)`,
                      `   - найти указанную часть (уровень 2) в реальные данные/изделия/<подсистема>/<top-level>/часть_<...>_*/_index.md`,
                      `   - решить: GENUINELY неделимая (закупочный компонент, не разборная в полевых условиях) ИЛИ требуется дальнейшая декомпозиция`,
                      `   - ЕСЛИ атомарная (sensor ASIC,connector,body of mounting hardware): поставить уровень_иерархии='неделимый' + уровень_номер=4 + дочерние_части=[] в YAML front matter`,
                      `   - ЕСЛИ атомарная и подтип указан явно (например 'корпус','крепёж','разъёмы'): можно оставить промежуточный — но лучше всё равно понизить до 'неделимый'`,
                      `   - ЕСЛИ составная (статор+ротор+обмотки+магниты для 'основной_элемент' мотора; anode+electrolyte+cathode для ячейки):`,
                      `     · создать директорию реальные данные/изделия/<подсистема>/<top-level>/часть_<...>_<sub>/ с _index.md`,
                      `     · поднять уровень_номер родителя до 2 (если был 2) или оставить, уровень_иерархии='промежуточный'`,
                      `     · для каждого ребёнка: уровень_номер=3, уровень_иерархии='неделимый' (если действительно неделимый) или 'промежуточный' (если ещё декомпозируется до уровня 4)`,
                      `     · заполнить дочерние_части родителя списком id новых частей`,
                      `     · в каждой новой части: родитель=id_родителя, основные (масса_kg, ...), материалы_частей`,
                      `   - обновить родительский top-level _index.md: добавить id новых sub-parts в иерархию (если нужно)`,
                      `   - перегенерировать графы: python3 scripts/generate_graphs.py --all --mermaid`,
                    ]
                  : isMaterial
                  ? [
                      `   - свойства: плотность_kg_m3, теплопроводность_W_mK, температура_плавления_C (или макс_рабочая_температура_C) из datasheet/справочника`,
                      `   - химический_состав, класс, стандарты`,
                      `   - вариант_структуры: КОНКРЕТНАЯ форма — web_search ищет ВСЕ формы материала:`,
                      `     · monocrystalline | polycrystalline | amorphous | nanocrystalline | thin_film | layered | fiber_reinforced | composite | porous_foam | ...`,
                      `     · для полиморфных кристаллов (Si, SiO₂, Al₂O₃, TiO₂, C, BaTiO₃, YBCO, Si₃N₄-α/β, ZrO₂-cubic/tetragonal/monoclinic, ...) — конкретная фаза (α-quartz, fused_silica_amorphous, rutile, graphite, α-Al₂O₃, γ-Al₂O₃, orthorhombic_YBCO, ...); НЕ generic 'single_phase'`,
                      `     · для сплавов/полимеров/стёкол 'single_phase' допустим (металлургическая/морфологическая корректность)`,
                      `   - альтернативные формы — сразу в сравнение_структур/варианты_по_применению (см. чек-лист F28; заодно закроет F28 для этого файла)`,
                      `   - источник_url (URL веб-источника) + источник_дата`,
                      `   - снять маркер исследовательская_группа='требует_верификации'`,
                      `   - заполнить пустые остальные поля основные/дополнительные (null → реальные значения или обоснованный null)`,
                    ]
                  : [
                      `   - материал (конкретный, не generic_material)`,
                      `   - габариты (из datasheet/canon)`,
                      `   - источник_url (URL веб-источника)`,
                      `   - описание (не шаблонное)`,
                    ];
                const criteriaList = isDedup
                  ? [
                      metric === 'F31'
                        ? `- F31: алиас-связь симметрична (канонический_id ↔ псевдонимы), нет нормализованных коллизий без связи`
                        : `- F32: пара слита (алиас удалён, ссылки перезаписаны, у канона псевдонимы пополнен) ИЛИ закрыта как false-positive с обоснованием`,
                      `- дедуп-ключ issue исчезает из violations (auto-close не сработает — закрыть вручную)`,
                    ]
                  : isForms
                  ? [
                      `- F28: сравнение_структур (полиморфы: свойства по каждой форме) ИЛИ варианты_по_применению (составы: свойства + применение) ИЛИ структурные_формы_альтернативы заполнено`,
                      `- F28: формы/варианты из реального вебпоиска, свойства по каждой форме указаны`,
                      `- F22: источник_url заполнен (если источник=web_search)`,
                    ]
                  : isDepth
                  ? [
                      `- F34: указанная часть имеет уровень_номер ≥ 3 (декомпозирована) ИЛИ помечена уровень_иерархии='неделимый' ИЛИ имеет подтип из atomic-whitelist (корпус/крепёж/разъёмы/инкапсулянт/припой/...)`,
                      `- F34: для новых sub-parts созданы _index.md с корректным родитель/уровень_номер/уровень_иерархии`,
                      `- F12a: граф parent↔children остаётся целостным (дети включены в дочерние_части родителя и обратно)`,
                      `- F16: иерархия уровней корректна (ребёнок = родитель + 1)`,
                      `- графы обновлены (graphs/graph1_data.json)`,
                    ]
                  : isMaterial
                  ? [
                      `- F27: плотность_kg_m3 и теплопроводность_W_mK заполнены реальными значениями из источника`,
                      `- F27: вариант_структуры заполнен конкретной формой (для полиморфных кристаллов — НЕ 'single_phase' generic; для сплавов/полимеров 'single_phase' допустим)`,
                      `- F27: маркер 'требует_верификации' снят (исследовательская_группа заполнена или null)`,
                      `- F22: источник_url заполнен конкретным URL (если источник=web_search)`,
                    ]
                  : [
                      `- F22: источник_url заполнен конкретным URL`,
                      `- F23: нет generic_material, нет шаблонного описания`,
                      `- F24: все ожидаемые поля для подтипа присутствуют`,
                      `- F25: параметры уникальны (≤2 файлов с одинаковыми)`,
                      `- F26: 2+ частей с одним подтипом в родителе объединены через количество=N (запустить scripts/migrate_dedup_quantity.py)`,
                    ];
                const body = [
                  `<!-- dedup: ${dedupKey} -->`,
                  ``,
                  `## Задача верификации: ${metric}`,
                  ``,
                  `**Метрика:** ${metric}`,
                  `**Файл / сигнатура:** \`${dedupKey.substring(metric.length + 1)}\``,
                  `**Нарушение:** ${v}`,
                  ``,
                  `### Что нужно сделать`,
                  ``,
                  `1. Найти файл в репозитории по id из нарушения выше${isMaterial ? ' (реальные данные/материалы/<id без префикса material_>.md)' : ''}${isDepth ? ' (реальные данные/изделия/<подсистема>/<top-level>/часть_<...>_*/_index.md)' : ''}`,
                  isDedup ? `2. Проверить пару по чек-листу ниже (веб-поиск не требуется)` : isDepth ? `2. Оценить атомарность части по чек-листу ниже (веб-поиск опционален, для datasheet-driven компонентов)` : `2. Провести реальный веб-поиск для этого компонента`,
                  `3. Заполнить реальные данные:`,
                  ...checklist,
                  `4. Зафиксировать изменения и закрыть issue`,
                  ``,
                  `### Критерии закрытия`,
                  ``,
                  ...criteriaList,
                  ``,
                  `**Авто-создано:** ${new Date().toISOString()}`,
                  `**Коммит:** ${context.sha.substring(0, 8)}`,
                  `**Run:** ${context.runId}`,
                ].join('\n');
                
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  labels: ['verify-task', metric.toLowerCase(), 'auto-generated'],
                });
                
                // CRITICAL: update Set to prevent within-run duplicates
                existingKeys.add(dedupKey);
                created++;
            }
            
            console.log(`Created: ${created}, Skipped (duplicates): ${skipped}, Deferred (cap ${maxNew}): ${deferred}`);

      - name: Auto-close stale issues (violations gone)
        # v9.34: КРИТИЧНО — только при ПОЛНОМ списке violations (partial=0).
        # При fallback-парсинге лога (первые 3 на метрику) авто-закрытие отключено:
        # иначе ложно закрывались бы актуальные issues, чьи нарушения не попали в первые 3 строки.
        if: always() && steps.violations.outputs.partial != '1'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { normalizeViolationKey, legacyMetricFromTitle } = require('./scripts/_dedup_keys.js');
            let violations = {F22:[], F23:[], F24:[], F25:[], F26:[], F27:[], F28:[], F31:[], F32:[]};
            try {
              violations = JSON.parse(fs.readFileSync('violations.json', 'utf-8'));
            } catch (e) {
              console.log('violations.json not found (validator step failed?) — skip auto-close');
              return;
            }

            // Текущие ключи нарушений
            const currentKeys = new Set();
            for (const [metric, violList] of Object.entries(violations)) {
              for (const v of violList) {
                currentKeys.add(normalizeViolationKey(metric, v));
              }
            }
            console.log(`Current violations: ${currentKeys.size} dedup_keys`);

            // Получаем ВСЕ открытые verify-task issues (с пагинацией)
            const openIssues = [];
            let page = 1;
            while (true) {
              const resp = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'verify-task',
                state: 'open',
                per_page: 100,
                page: page,
              });
              if (resp.data.length === 0) break;
              openIssues.push(...resp.data);
              if (resp.data.length < 100) break;
              page++;
            }
            console.log(`Open verify-task issues: ${openIssues.length}`);

            // Извлечение dedup_key (тот же алгоритм, что при создании — из _dedup_keys.js)
            function parseKey(issue) {
              const body = issue.body || '';
              const marker = body.match(/<!--\s*dedup:\s*(.+?)\s*-->/);
              if (marker) return marker[1].trim();
              // Legacy fallback для старых issues
              const viol = body.match(/\*\*Нарушение:\*\*\s*(.+)/);
              if (viol) {
                const metric = legacyMetricFromTitle(issue.title, viol[1].trim());
                return normalizeViolationKey(metric, viol[1].trim());
              }
              return null;
            }

            let closed = 0;
            let protectedInProgress = 0;
            let noKey = 0;

            for (const issue of openIssues) {
              const labels = issue.labels.map(l => l.name);
              if (labels.includes('in-progress')) {
                protectedInProgress++;
                continue;  // cron-агент в работе — не трогаем
              }

              const key = parseKey(issue);
              if (!key) {
                noKey++;
                continue;  // очень старый issue без dedup_key — пропускаем
              }

              if (currentKeys.has(key)) {
                continue;  // нарушение ещё актуально
              }

              // Нарушение исчезло — закрываем как stale
              const staleBody = [
                `## ⏱️ Auto-closed as stale`,
                ``,
                `**dedup_key:** \`${key}\``,
                ``,
                `Нарушение **${key}** больше не присутствует в текущем выводе \`validate_decomposition.py\` — соответствующий файл был исправлен в предыдущем коммите.`,
                ``,
                `Issue был создан по устаревшему срезу репозитория (фикс пришёл после запуска workflow). Раньше такие issues оставались открытыми и cron-агент закрывал их вручную — теперь workflow делает это автоматически.`,
                ``,
                `**Коммит-инициатор:** [${context.sha.substring(0, 8)}](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha})`,
                `**Run:** ${context.runId}`,
                ``,
                `*Авто-закрыто verify_decomposition.yml v9.33 — auto-close stale step.*`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: staleBody,
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });

              console.log(`  closed #${issue.number} (${key})`);
              closed++;
            }

            console.log(`Auto-closed stale: ${closed}`);
            console.log(`Protected (in-progress): ${protectedInProgress}`);
            console.log(`Skipped (no dedup_key): ${noKey}`);

      - name: Summary
        if: always()
        run: |
          echo "## Decomposition Verification Tasks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Violations (full list) | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| F22 | ${{ steps.violations.outputs.F22_count }} | Source URL required |" >> $GITHUB_STEP_SUMMARY
          echo "| F23 | ${{ steps.violations.outputs.F23_count }} | Anti-template detection |" >> $GITHUB_STEP_SUMMARY
          echo "| F24 | ${{ steps.violations.outputs.F24_count }} | Subtype compliance |" >> $GITHUB_STEP_SUMMARY
          echo "| F25 | ${{ steps.violations.outputs.F25_count }} | Data uniqueness |" >> $GITHUB_STEP_SUMMARY
          echo "| F26 | ${{ steps.violations.outputs.F26_count }} | Within-parent duplicates |" >> $GITHUB_STEP_SUMMARY
          echo "| F27 | ${{ steps.violations.outputs.F27_count }} | Unfilled materials (used by izdeliya) |" >> $GITHUB_STEP_SUMMARY
          echo "| F28 | ${{ steps.violations.outputs.F28_count }} | Materials without alternative forms/variants (for AI product variants) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total** | **${{ steps.violations.outputs.total_violations }}** | — |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Violation source:** ${{ steps.violations.outputs.partial == '1' && 'TRUNCATED log fallback (auto-close DISABLED)' || 'complete --json-out' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Anti-parallel:** concurrency group \`verify-decomposition-\${{ github.ref }}\` serializes runs." >> $GITHUB_STEP_SUMMARY
          echo "**Anti-duplicate:** dedup checks ALL issues (open+closed) via stable \`dedup_key\`." >> $GITHUB_STEP_SUMMARY
          echo "**Issue cap:** max \`MAX_NEW_ISSUES\` per run (round-robin across F22–F28)." >> $GITHUB_STEP_SUMMARY
          echo "**Auto-close stale:** open verify-task issues whose dedup_key is no longer in current violations are auto-closed (skips \`in-progress\`; runs only on complete violation list)." >> $GITHUB_STEP_SUMMARY
