# SkyNet Workflow 7/14 — Issue Triage (auto-parse model requests)
# Промпт-версия: v9.21
# Соответствует: §9.2 разбор типа запроса (command_create), §9.0 AI-45 (немедленный старт)
#
# Триггеры:
#   - issues: [opened, edited, labeled] c фильтром labels [todo, model-request]
#     (v9.36.1: без фильтра КАЖДЫЙ issue-иверн — включая ~50 verify-task/telemetry
#     issues в день — порождал запуск воркфлоу, который тут же скипался job-if'ом)
#   - workflow_dispatch
#
# Что делает:
#   1. Парсит текст issue (через GitHub Models API — бесплатно)
#   2. Если issue — запрос модели → создаёт фантастические данные/<модель>.md
#   3. Меняет метки: todo → in_progress → done (или blocked при FAIL)
#   4. Добавляет комментарий с результатом (файлы созданы, метрики)
#   5. При FAIL: помечает `blocked` и комментирует с причиной

name: Issue Triage — auto-parse model requests

on:
  issues:
    types: [opened, edited, labeled]
    # v9.36.1: фильтр меток — не порождаем пустые прогоны на посторонних issues
    labels: [todo, model-request]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: string

permissions:
  issues: write
  contents: write
  models: read  # v9.21: для GitHub Models API

concurrency:
  # v9.36.1: два одновременных triage-прогона гонялись за git push
  # (non-fast-forward) и дважды создавали файл модели
  group: triage-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

env:
  # v9.36.1: было захардкожено a-m-e-n-t-e-t/SkyNet — ломалось при форке/переименовании
  SKYNET_REPO: ${{ github.repository }}

jobs:
  triage:
    name: Parse issue & create model file
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'model-request') ||
      contains(github.event.issue.labels.*.name, 'todo')

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "SkyNet-bot"
          git config user.email "bot@skynet.local"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests

      - name: Determine issue number
        id: issue
        env:
          ISSUE_INPUT: ${{ github.event.inputs.issue_number }}
        run: |
          # v9.36.1: ввод через env, а не прямую интерполяцию в shell
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${ISSUE_INPUT}" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: Read issue content
        id: read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          python << 'PYEOF'
          import os, json, urllib.request
          # Get issue via GitHub API
          url = f"https://api.github.com/repos/${{ env.SKYNET_REPO }}/issues/${os.environ['ISSUE_NUMBER']}"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req) as r:
              issue = json.load(r)
          title = issue.get("title", "")
          body = issue.get("body", "") or ""
          labels = [l["name"] for l in issue.get("labels", [])]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"title={title!r}\n")
          # Write body to file for next steps
          with open("issue_body.txt", "w", encoding="utf-8") as f:
              f.write(f"# Issue #{issue['number']}: {title}\n\n")
              f.write(f"Labels: {labels}\n\n")
              f.write(body)
          print(f"::notice::Issue #{issue['number']}: {title[:80]}")
          print(f"  Labels: {labels}")
          PYEOF

      - name: Parse model name & params via GitHub Models
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python << 'PYEOF'
          import os, json, urllib.request
          # v9.21: используем GitHub Models API (бесплатно, rate-limited)
          # Если нет доступа — fallback на простой regex
          prompt = f"""Analyze this GitHub issue and extract model parameters in JSON format.
          Issue title and body:
          ---
          {open('issue_body.txt').read()}
          ---
          Return JSON with fields: model_name, canon_source, year, expected_subsystems (list), status (canon|real|canon_with_real_analogue)"""
          
          try:
              req = urllib.request.Request(
                  "https://models.inference.ai.azure.com/chat/completions",
                  data=json.dumps({
                      "model": "gpt-4o-mini",
                      "messages": [
                          {"role": "system", "content": "You are SkyNet knowledge engineer. Return only valid JSON, no markdown."},
                          {"role": "user", "content": prompt}
                      ],
                      "max_tokens": 500,
                      "temperature": 0
                  }).encode('utf-8'),
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Content-Type": "application/json",
                  },
                  method='POST',
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  resp = json.load(r)
              content = resp["choices"][0]["message"]["content"]
              # Strip markdown code fences if present
              if content.startswith("```"):
                  content = content.split("\n", 1)[1].rsplit("```", 1)[0]
              parsed = json.loads(content)
              # v9.36.1 САНТИЗАЦИЯ LLM-ВЫВОДА (prompt-injection → RCE):
              # раньше сырое model_name шло в путь файла и в shell/имя метки.
              # Разрешаем только [A-Za-z0-9_-], максимум 64 символа.
              import re as _re
              def _safe(s, fallback):
                  s = _re.sub(r"[^A-Za-z0-9_\-]+", "_", str(s)).strip("_")[:64]
                  return s or fallback
              parsed["model_name"] = _safe(parsed.get("model_name", "unknown"), "unknown")
              parsed["canon_source"] = str(parsed.get("canon_source", "unknown"))[:120].replace("\n", " ").replace("\r", " ")
              parsed["status"] = _safe(parsed.get("status", "canon"), "canon")
              print(f"::notice::GitHub Models parsed: {parsed.get('model_name', 'unknown')}")
              with open("parsed.json", "w") as f:
                  json.dump(parsed, f, ensure_ascii=False, indent=2)
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"model_name={parsed.get('model_name', 'unknown')}\n")
                  f.write(f"canon_source={parsed.get('canon_source', 'unknown')}\n")
                  f.write(f"status={parsed.get('status', 'canon')}\n")
          except Exception as e:
              print(f"::warning::GitHub Models failed: {e}")
              print("Falling back to simple regex parse")
              # Fallback: extract model name from title
              import re
              text = open('issue_body.txt').read()
              m = re.search(r'\b(T-\d+|T\d+|Marcus|T-X|T-3000|T-850)\b', text)
              model_name = m.group(1) if m else "unknown"
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"model_name={model_name}\n")
                  f.write("canon_source=unknown\n")
                  f.write("status=canon\n")
          PYEOF

      - name: Create model file (фантастические данные/<model>.md)
        id: create
        if: steps.parse.outputs.model_name != 'unknown'
        env:
          MODEL_NAME: ${{ steps.parse.outputs.model_name }}
          CANON_SOURCE: ${{ steps.parse.outputs.canon_source }}
          STATUS: ${{ steps.parse.outputs.status }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          mkdir -p "фантастические данные"
          FILE="фантастические данные/${MODEL_NAME}.md"
          
          # Если файл уже есть — не перезаписываем, добавляем ссылку на issue
          if [ -f "$FILE" ]; then
            echo "::notice::$FILE already exists — skipping creation"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            cat > "$FILE" << YAMLEOF
          ---
          id: "${MODEL_NAME}"
          название: "${MODEL_NAME}"
          канон_источник: "${CANON_SOURCE}"
          статус_реальности: "${STATUS}"
          источники:
            - тип: github_issue
              url: ${{ github.server_url }}/${{ env.SKYNET_REPO }}/issues/${ISSUE_NUMBER}
              дата: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          ожидаемые_подсистемы:
            - каркас
            - привод
            - энергетика
            - сенсоры
            - вычисление
            - связь
            - встроенное_оружие
            - маскировка
            - логистика
            - ремонт
            - навигация
            - взаимодействие
            - прочее
          статус_заполнения: scaffold
          декомпозиция_статус: pending
          ---
          
          # ${MODEL_NAME}
          
          > Запрос на создание модели из issue #${ISSUE_NUMBER}
          
          ## Описание
          
          [Требует заполнения из канона — веб-поиск + анализ произведения]
          
          ## Источник
          
          - GitHub Issue: #${ISSUE_NUMBER}
          - Произведение: ${CANON_SOURCE}
          
          ## Чек-лист фаз (§9.0)
          
          - [ ] Phase 1: Извлечение из произведения
          - [ ] Phase 2: Декомпозиция по подсистемам
          - [ ] Phase 3: Верификация параметров
          - [ ] Phase 4: Schema validation
          - [ ] Phase 5: Pre-commit checks
          - [ ] Phase 6: README/INDEX/Article update
          - [ ] Phase 7: Dialog close
          - [ ] Phase 8: Final sync
          YAMLEOF
            echo "::notice::Created $FILE"
            echo "exists=false" >> $GITHUB_OUTPUT
            git add "$FILE"
            git commit -m "feat(модель): ${MODEL_NAME} — создан из issue #${ISSUE_NUMBER} [skip ci]"
            git push
          fi

      - name: Update issue labels (todo → in_progress)
        if: steps.parse.outputs.model_name != 'unknown'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          MODEL_NAME: ${{ steps.parse.outputs.model_name }}
        run: |
          # Remove `todo` label, add `in_progress` and `model:<name>`
          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "todo" \
            --add-label "in_progress,model:${MODEL_NAME}" \
            --repo "${{ env.SKYNET_REPO }}" || true

      - name: Comment on issue with result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          MODEL_NAME: ${{ steps.parse.outputs.model_name }}
        run: |
          cat > /tmp/comment.md << 'MDEOF'
          ## 🤖 SkyNet-bot processed this issue
          
          **Model:** `${{ env.MODEL_NAME }}`
          **Status:** ${{ steps.parse.outputs.status }}
          **Canon source:** ${{ steps.parse.outputs.canon_source }}
          
          ### Actions taken
          MDEOF
          
          if [ -f "фантастические данные/${MODEL_NAME}.md" ]; then
            echo "✅ Created: \`фантастические данные/${MODEL_NAME}.md\`" >> /tmp/comment.md
            echo "🏷️ Labels updated: todo → in_progress, model:${MODEL_NAME}" >> /tmp/comment.md
          else
            echo "⚠️ File creation skipped (already exists or unknown model)" >> /tmp/comment.md
          fi
          
          echo "" >> /tmp/comment.md
          echo "### Next steps" >> /tmp/comment.md
          echo "- Валидация: workflow \`pre-commit-checks.yml\` запустится на следующем push" >> /tmp/comment.md
          echo "- Декомпозиция задач: workflow verify_decomposition.yml (каждые 3 ч + на push)" >> /tmp/comment.md
          echo "- Track progress: GitHub Project 'SkyNet Models Pipeline'" >> /tmp/comment.md
          
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/comment.md --repo "${{ env.SKYNET_REPO }}"

      - name: Summary
        if: always()
        run: |
          echo "## Issue Triage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Issue:** #${{ steps.issue.outputs.number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Model:** ${{ steps.parse.outputs.model_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.parse.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **File created:** ${{ steps.create.outputs.exists == 'false' && '✅ yes' || '⚠️ already existed' }}" >> $GITHUB_STEP_SUMMARY
