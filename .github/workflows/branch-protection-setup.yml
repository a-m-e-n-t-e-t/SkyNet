# SkyNet Workflow 9/14 — Branch Protection setup (one-time + drift detection)
# Промпт-версия: v9.21
# Соответствует: §9 Phase 5 (pre-commit hook обязателен), F47 (GitHub sync)
#
# Триггеры:
#   - workflow_dispatch (ручной запуск для первичной настройки)
#   - schedule: daily (drift detection — проверка что protection не снят)
#
# Что делает:
#   1. Настраивает Branch Protection на main:
#      - required_status_checks: ["Pre-commit Checks (49 F-метрик)", "F47 — GitHub Sync Verification"]
#      - enforce_admins: true (даже admin не может пушить в main напрямую)
#      - required_pull_request_reviews: 0 (для AI-only репо, можно поднять)
#      - restrict_pushes: только a-m-e-n-t-e-t
#      - allows_force_pushes: false
#      - allows_deletions: false
#   2. Проверяет каждые 24 часа что protection на месте
#   3. Если protection снят — пересоздаёт + создаёт issue с меткой `protection-drift`

name: Branch Protection — setup & drift detection

on:
  workflow_dispatch:
    inputs:
      enforce_admins:
        description: 'Enforce admins (block direct push even for admin)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      required_approving_review_count:
        description: 'Required PR approvals (0 for AI-only)'
        required: false
        default: '0'
        type: string
  schedule:
    # Daily at 02:00 UTC (08:00 Asia/Omsk) — drift detection
    - cron: '0 2 * * *'
  # v9.31 fix: НЕ добавляем `on: push` — этот workflow только для ручного
  # запуска и daily drift detection. Запуск на каждом push создавал empty
  # run с conclusion=failure (24 раза подряд), засоряя CI статус.
  # Branch Protection API требует GitHub Pro для приватных репо (или
  # публичного репо) — поэтому все шаги, вызывающие protection API,
  # помечены continue-on-error: true ниже.

permissions:
  contents: read
  issues: write
  administration: write  # required for branch protection

env:
  SKYNET_REPO: a-m-e-n-t-e-t/SkyNet
  REQUIRED_CHECKS: '["Pre-commit Checks (49 F-метрик)", "F47 — GitHub Sync Verification", "build", "deploy"]'

jobs:
  setup-protection:
    name: Setup/verify branch protection on main
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check current protection status
        id: current
        continue-on-error: true
        # v9.31: continue-on-error — приватный репо без GitHub Pro получает
        # HTTP 403 "Upgrade to GitHub Pro or make this repository public".
        # Branch Protection — опциональная фича, не должна блокировать CI.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          STATUS=$(curl -s -o /tmp/protection.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ env.SKYNET_REPO }}/branches/main/protection")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          if [ "$STATUS" = "200" ]; then
            echo "protected=true" >> $GITHUB_OUTPUT
            # Check key fields
            ENFORCE_ADMINS=$(jq -r '.enforce_admins.enabled' /tmp/protection.json)
            REQUIRED_CHECKS=$(jq -r '.required_status_checks.contexts | length' /tmp/protection.json)
            echo "enforce_admins=$ENFORCE_ADMINS" >> $GITHUB_OUTPUT
            echo "required_checks_count=$REQUIRED_CHECKS" >> $GITHUB_OUTPUT
            echo "::notice::Main is protected (enforce_admins=$ENFORCE_ADMINS, checks=$REQUIRED_CHECKS)"
          elif [ "$STATUS" = "403" ]; then
            echo "protected=skip" >> $GITHUB_OUTPUT
            echo "::notice::Branch Protection API requires GitHub Pro or public repo (HTTP 403). Skipping protection setup — not blocking CI."
          else
            echo "protected=false" >> $GITHUB_OUTPUT
            echo "::warning::Main is NOT protected (HTTP $STATUS)"
          fi

      - name: Apply/refresh branch protection
        continue-on-error: true  # v9.31: skip on HTTP 403 (private repo without GitHub Pro)
        if: steps.current.outputs.status != '403'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENFORCE_ADMINS: ${{ github.event.inputs.enforce_admins || 'true' }}
          REQUIRED_REVIEWS: ${{ github.event.inputs.required_approving_review_count || '0' }}
        run: |
          # v9.21: setup full branch protection on main
          # See: https://docs.github.com/rest/branches/branch-protection#update-branch-protection
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ env.SKYNET_REPO }}/branches/main/protection" \
            -d "{
              \"required_status_checks\": {
                \"strict\": true,
                \"contexts\": ${{ env.REQUIRED_CHECKS }}
              },
              \"enforce_admins\": $ENFORCE_ADMINS,
              \"required_pull_request_reviews\": {
                \"required_approving_review_count\": $REQUIRED_REVIEWS,
                \"dismiss_stale_reviews\": true,
                \"require_code_owner_reviews\": false,
                \"require_last_push_approval\": false
              },
              \"restrictions\": null,
              \"required_linear_history\": true,
              \"allow_force_pushes\": false,
              \"allow_deletions\": false,
              \"block_creations\": false,
              \"required_conversation_resolution\": false
            }")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
          if [ "$HTTP_CODE" = "200" ]; then
            echo "::notice::Branch protection applied successfully"
          elif [ "$HTTP_CODE" = "403" ]; then
            echo "::notice::Branch Protection API not available (HTTP 403 — requires GitHub Pro or public repo). Skipping — not blocking CI."
          else
            echo "::error::Branch protection failed: HTTP $HTTP_CODE"
            echo "$BODY" | head -20
            exit 1
          fi

      - name: Create issue on drift (protection was missing)
        if: steps.current.outputs.protected == 'false' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Branch protection drift detected — restored`,
              body: [
                `**Branch protection on \`main\` was missing — auto-restored.**`,
                ``,
                `**Detection:** scheduled drift check at ${new Date().toISOString()}`,
                `**Action taken:** Re-applied protection with:`,
                `- Required status checks: ${{ env.REQUIRED_CHECKS }}`,
                `- Enforce admins: true`,
                `- Required PR approvals: 0`,
                `- Allow force pushes: false`,
                `- Allow deletions: false`,
                ``,
                `**Run:** ${context.runId}`,
                ``,
                `If this was intentional, disable this workflow.`,
              ].join('\n'),
              labels: ['protection-drift', 'auto-generated'],
            });

      - name: Summary
        if: always()
        run: |
          echo "## Branch Protection (main)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Was protected | ${{ steps.current.outputs.protected }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Enforce admins | ${{ github.event.inputs.enforce_admins || 'true' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Required reviews | ${{ github.event.inputs.required_approving_review_count || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP response | ${{ env.HTTP_CODE || '?' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Required checks:" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.REQUIRED_CHECKS }}" | tr ',' '\n' | sed 's/[][]//g' | sed 's/"//g' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
