# SkyNet Workflow 3/6 — Batch processing (§9.1)
# Промпт-версия: v9.20
# Соответствует: §9.1 Пакетная обработка
#
# Триггеры:
#   - schedule: каждые 6 часов (04:00, 10:00, 16:00, 22:00 UTC)
#   - workflow_dispatch: ручной запуск с параметрами
#
# Что делает:
#   1. Запускает pipeline.py --batch с max_models_per_session=3
#   2. Сохраняет checkpoint в .cache/checkpoints/batch_{N}.json
#   3. Если контекст approaching limit → пишет в результаты/_batch_progress.md
#   4. Коммитит результаты обратно в репо

name: Batch Processing (§9.1)

on:
  schedule:
    # Каждые 6 часов: 04:00, 10:00, 16:00, 22:00 UTC
    # В Asia/Omsk (UTC+6): 10:00, 16:00, 22:00, 04:00
    - cron: '0 4,16 * * *'
  workflow_dispatch:
    inputs:
      max_models:
        description: 'Max models per batch (default: 3)'
        required: false
        default: '3'
        type: string
      max_web_queries:
        description: 'Max web queries per batch (default: 30)'
        required: false
        default: '30'
        type: string
      priority_order:
        description: 'Priority order'
        required: false
        default: 'canon_first'
        type: choice
        options:
          - canon_first
          - real_first
          - by_date

# Только один batch одновременно
concurrency:
  group: batch-processing
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PYTHON_VERSION: '3.12'
  YANDEX_PAT_PUBLIC_KEY: https://disk.yandex.ru/i/3RiKQucdvHI2Sg
  MAX_MODELS_DEFAULT: '3'
  MAX_WEB_QUERIES_DEFAULT: '30'

jobs:
  batch:
    name: §9.1 Batch processing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "SkyNet-bot"
          git config user.email "bot@skynet.local"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema requests beautifulsoup4

      - name: Download PAT from Yandex Disk
        env:
          YANDEX_PUBLIC_KEY: ${{ env.YANDEX_PAT_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python << 'PYEOF'
          import os, sys, json, urllib.request, urllib.parse, urllib.error
          import zipfile, xml.etree.ElementTree as ET, re, tempfile, pathlib
          public_key = os.environ["YANDEX_PUBLIC_KEY"]
          api = "https://cloud-api.yandex.net/v1/disk/public/resources/download"
          url = f"{api}?public_key={urllib.parse.quote(public_key, safe='')}"
          with urllib.request.urlopen(url, timeout=15) as r:
              data = json.load(r)
          download_url = data["href"]
          tmp = pathlib.Path(tempfile.gettempdir()) / "token.docx"
          urllib.request.urlretrieve(download_url, tmp)
          with zipfile.ZipFile(tmp, 'r') as z:
              with z.open('word/document.xml') as f:
                  tree = ET.parse(f)
                  root = tree.getroot()
                  ns = '{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'
                  texts = [t.text for t in root.iter(f'{ns}t') if t.text]
                  full = ''.join(texts)
          tmp.unlink(missing_ok=True)
          m = re.search(r'github_pat_[A-Za-z0-9_]+', full)
          if not m:
              print(f"::error::PAT not found in Token.docx")
              sys.exit(1)
          pat = m.group(0)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PAT_TOKEN={pat}\n")
          print(f"::notice::PAT downloaded for batch processing")
          PYEOF

      - name: Check pipeline.py exists
        id: pipeline
        run: |
          if [ -f "scripts/pipeline.py" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::scripts/pipeline.py NOT FOUND — skeleton missing"
          fi

      - name: Run batch processing
        id: batch
        if: steps.pipeline.outputs.exists == 'true'
        env:
          PAT_TOKEN: ${{ env.PAT_TOKEN }}
          SKYNET_REPO: ${{ github.workspace }}
          MAX_MODELS: ${{ github.event.inputs.max_models || env.MAX_MODELS_DEFAULT }}
          MAX_WEB_QUERIES: ${{ github.event.inputs.max_web_queries || env.MAX_WEB_QUERIES_DEFAULT }}
          PRIORITY_ORDER: ${{ github.event.inputs.priority_order || 'canon_first' }}
        run: |
          set +e
          python scripts/pipeline.py \
            --batch \
            --max-models "$MAX_MODELS" \
            --max-web-queries "$MAX_WEB_QUERIES" \
            --priority-order "$PRIORITY_ORDER" \
            --commit-on-success 2>&1 | tee batch_output.log
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "::notice::Batch exit code: $EXIT_CODE"
          exit 0

      - name: Commit batch progress
        if: steps.pipeline.outputs.exists == 'true' && always()
        run: |
          if [ -f "результаты/_batch_progress.md" ] || [ -d ".cache/checkpoints" ]; then
            git add результаты/ .cache/checkpoints/ 2>/dev/null || true
            git commit -m "chore(batch): batch processing result $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || true
            git push || true
          fi

      - name: Save batch log artifact
        if: always() && steps.pipeline.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: batch-log-${{ github.run_id }}
          retention-days: 30
          path: batch_output.log

      - name: Create issue on batch failure
        if: steps.batch.outputs.exit_code != '0' && steps.batch.outputs.exit_code != ''
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Batch processing FAILED (run ${context.runId})`,
              body: [
                `**Pipeline batch processing failed**`,
                ``,
                `- **Exit code:** ${{ steps.batch.outputs.exit_code }}`,
                `- **Trigger:** ${context.eventName}`,
                `- **Time:** ${new Date().toISOString()}`,
                `- **Run:** ${context.runId}`,
                ``,
                `See artifact \`batch-log-${context.runId}\` for details.`,
              ].join('\n'),
              labels: ['batch-failed', 'auto-generated'],
            });

      - name: Summary
        if: always()
        run: |
          echo "## Batch Processing (§9.1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max models:** ${{ github.event.inputs.max_models || '3' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max web queries:** ${{ github.event.inputs.max_web_queries || '30' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Priority:** ${{ github.event.inputs.priority_order || 'canon_first' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pipeline.outputs.exists }}" != "true" ]; then
            echo "⚠️ scripts/pipeline.py NOT FOUND — skeleton init required" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.batch.outputs.exit_code }}" = "0" ]; then
            echo "✅ Batch completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Batch FAILED (exit ${{ steps.batch.outputs.exit_code }})" >> $GITHUB_STEP_SUMMARY
          fi
