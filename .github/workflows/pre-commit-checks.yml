# SkyNet Workflow 2/6 — Pre-commit checks (49 F-метрик)
# Промпт-версия: v9.20
# Соответствует: §9 Phase 5, §13 метрики B01-B10, M11-M19, F1-F30, F34, F43-F44, F46, F48, F52, F70
#
# Триггеры:
#   - push на любую ветку
#   - pull_request на main
#   - workflow_dispatch (ручной запуск)
#
# Что делает:
#   1. Запускает scripts/pre-commit-hook.py — все 49 F-метрик
#   2. Если FAIL → создаёт ISSUE с меткой `pre-commit-failed`, FAIL details
#   3. Блокирует merge при FAIL (Branch Protection должна быть настроена)
#
# NB: GitHub Contents API push НЕ вызывает client-side .git/hooks/pre-commit
#     Этот workflow — единственная реальная защита для v9.20

name: Pre-commit Checks (49 F-метрик)

on:
  push:
    branches: ['**']
    # v9.36.1: path-фильтр — doc/диалог/концепция коммиты не меняют данные,
    # полные 49-метрические прогоны на них были чистым сжиганием минут Actions
    paths:
      - 'реальные данные/**'
      - 'фантастические данные/**'
      - 'scripts/**'
      - 'требования_к_ии/**'
      - 'graphs/**'
      - '.github/workflows/pre-commit-checks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

# Блокируем параллельные запуски на одной ветке
concurrency:
  group: precommit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  pre-commit:
    name: Run pre-commit-hook.py (49 F-метрик)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # достаточно: git-метрики в pre-commit-hook.py не используются

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip          # кэш зависимостей между запусками
          cache-dependency-path: |
            .github/workflows/pre-commit-checks.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml jsonschema requests

      - name: Check scripts/pre-commit-hook.py exists
        id: hook_exists
        run: |
          if [ -f "scripts/pre-commit-hook.py" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::pre-commit-hook.py found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::scripts/pre-commit-hook.py NOT FOUND — skeleton missing (Phase 0 issue)"
          fi

      - name: Run pre-commit-hook.py
        id: precommit
        if: steps.hook_exists.outputs.exists == 'true'
        continue-on-error: true
        run: |
          set +e
          python scripts/pre-commit-hook.py 2>&1 | tee precommit_output.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "::notice::pre-commit-hook.py exit code: $EXIT_CODE"
          exit 0  # не падаем на шаге, чтобы сохранить лог

      - name: Save pre-commit log artifact
        if: always() && steps.hook_exists.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: precommit-log-${{ github.run_id }}
          retention-days: 14
          path: precommit_output.log

      - name: Create issue on failure
        if: steps.precommit.outputs.exit_code != '0' && steps.precommit.outputs.exit_code != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('precommit_output.log', 'utf8'); } catch (e) {}
            const failedBranch = context.ref.replace('refs/heads/', '');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 Pre-commit checks FAILED on ${failedBranch} (${context.sha.slice(0,7)})`,
              body: [
                `**Pre-commit-hook.py failed with exit code ${{ steps.precommit.outputs.exit_code }}**`,
                ``,
                `**Branch:** ${failedBranch}`,
                `**Commit:** ${context.sha}`,
                `**Pushed by:** ${context.actor}`,
                `**Run:** ${context.runId}`,
                ``,
                `### Log:`,
                '```',
                log.slice(-3000),
                '```',
                ``,
                `### Метрики которые должны проверяться:`,
                `B01-B10, M11-M19, F1, F2, F3, F4, F5, F7, F8, F9-F30, F34, F43, F44, F46, F48, F52, F70a-f`,
                ``,
                `**Required:** Fix the issues and re-push, OR add \`pre-commit-failed\` label to acknowledge.`,
              ].join('\n'),
              labels: ['pre-commit-failed', 'auto-generated'],
            });

      - name: Fail job if pre-commit failed
        if: steps.precommit.outputs.exit_code != '0' && steps.precommit.outputs.exit_code != ''
        run: |
          echo "::error::pre-commit-hook.py failed with exit code ${{ steps.precommit.outputs.exit_code }}"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## Pre-commit Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.hook_exists.outputs.exists }}" != "true" ]; then
            echo "⚠️ scripts/pre-commit-hook.py NOT FOUND — skeleton init required (see Phase 0 issue)" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.precommit.outputs.exit_code }}" = "0" ]; then
            echo "✅ All 49 F-метрик PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Pre-commit FAILED (exit ${{ steps.precommit.outputs.exit_code }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See artifact \`precommit-log-${{ github.run_id }}\` for details." >> $GITHUB_STEP_SUMMARY
          fi
