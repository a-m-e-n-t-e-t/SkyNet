# SkyNet Workflow 11/14 — CodeQL static analysis
# Промпт-версия: v9.21
# Соответствует: §13 метрика F16 (кибербезопасность), P026 (cybersecurity)
#
# Триггеры:
#   - push на main с изменениями в scripts/
#   - pull_request на main
#   - schedule: weekly (понедельник 01:00 UTC)
#   - workflow_dispatch
#
# Что делает:
#   1. Запускает CodeQL analysis на Python (scripts/*.py)
#   2. Находит: SQL injection, path traversal, hardcoded secrets, unsafe deserialization
#   3. Загружает результаты в Security tab
#   4. При critical/high alerts: создаёт issue с меткой `codeql-alert`

name: CodeQL Analysis — static security analysis

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/codeql-analysis.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
  schedule:
    # Weekly on Monday 01:00 UTC (07:00 Asia/Omsk)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

# Cancel in-progress runs for the same branch
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python (scripts/)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: ['python']

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use default security queries + security-extended
          queries: security-extended,security-and-quality
          # v9.21: also enable security-experimental for latest queries
          packs: +github/codeql-python-queries

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        id: analyze
        with:
          category: "/language:${{ matrix.language }}"

      - name: Check for critical alerts
        id: alerts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query the CodeQL alerts via API
          ALERTS=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/code-scanning/alerts?state=open&severity=critical,high&language=${{ matrix.language }}")
          
          CRITICAL_COUNT=$(echo "$ALERTS" | jq '[.[] | select(.rule.security_severity_level == "critical")] | length' 2>/dev/null || echo 0)
          HIGH_COUNT=$(echo "$ALERTS" | jq '[.[] | select(.rule.security_severity_level == "high")] | length' 2>/dev/null || echo 0)
          TOTAL_COUNT=$(echo "$ALERTS" | jq 'length' 2>/dev/null || echo 0)
          
          echo "critical=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
          echo "high=$HIGH_COUNT" >> $GITHUB_OUTPUT
          echo "total=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          
          echo "::notice::CodeQL alerts: $CRITICAL_COUNT critical, $HIGH_COUNT high, $TOTAL_COUNT total (open)"

      - name: Create issue if critical/high alerts found
        if: steps.alerts.outputs.critical != '0' || steps.alerts.outputs.high != '0'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const critical = '${{ steps.alerts.outputs.critical }}';
            const high = '${{ steps.alerts.outputs.high }}';
            const total = '${{ steps.alerts.outputs.total }}';
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 CodeQL: ${critical} critical, ${high} high alerts found`,
              body: [
                `**CodeQL analysis found security issues in \`scripts/\`**`,
                ``,
                `| Severity | Count |`,
                `|---|---|`,
                `| 🔴 Critical | ${critical} |`,
                `| 🟠 High | ${high} |`,
                `| Total (open) | ${total} |`,
                ``,
                `**Action required:** Review alerts at`,
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/security/code-scanning`,
                ``,
                `**Run:** ${context.runId}`,
                `**Trigger:** ${context.eventName}`,
                `**Time:** ${new Date().toISOString()}`,
                ``,
                `See P026 (кибербезопасность) and F16 (доля_моделей_с_кибербезопасностью) for context.`,
              ].join('\n'),
              labels: ['codeql-alert', 'security', 'auto-generated'],
            });

      - name: Fail if critical alerts
        if: steps.alerts.outputs.critical != '0'
        run: |
          echo "::error::CodeQL found ${{ steps.alerts.outputs.critical }} critical security alerts"
          echo "::error::See Security tab: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## CodeQL Analysis (${{ matrix.language }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 Critical | ${{ steps.alerts.outputs.critical || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 High | ${{ steps.alerts.outputs.high || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Total (open) | ${{ steps.alerts.outputs.total || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.alerts.outputs.critical || '0' }}" = "0" ]; then
            echo "✅ No critical security alerts" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Critical alerts found — see Security tab" >> $GITHUB_STEP_SUMMARY
          fi
