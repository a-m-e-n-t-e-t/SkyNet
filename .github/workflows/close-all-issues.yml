можно ли поставить опен коде на флешку (переносная версия) 

Thought Process
Да, OpenCode можно сделать портативным — он компилируется в один статический бинарник (на Go), без зависимостей. Вот как это сделать правильно.

Почему это вообще возможно
Один исполняемый файл на платформу (Linux/macOS/Windows), без DLL и пакетов.
Конфиг читается из ~/.config/opencode/ по умолчанию, но можно перенаправить через env или флаг.
Не требует прав администратора, не пишет в реестр (на Windows) и не трогает системные директории.
Шаг 1 — скачать бинарники
Зайдите на страницу релизов и скачайте под нужные ОС:

opencode-linux-amd64
opencode-darwin-amd64 (Intel Mac) / opencode-darwin-arm64 (Apple Silicon)
opencode-windows-amd64.exe
На флешку положите их в структуру:

text
E:\
└── opencode-portable\
    ├── bin\
    │   ├── opencode-linux
    │   ├── opencode-macos-arm
    │   ├── opencode-macos-x86
    │   └── opencode.exe
    ├── config\
    │   └── opencode.json
    ├── auth\
    │   └── github_token.txt   ← НЕ храните токен в открытом виде
    └── run.sh / run.bat
Шаг 2 — конфиг рядом с бинарником
По умолчанию OpenCode пишет настройки в ~/.config/opencode/. Чтобы всё держать на флешке, перенаправьте через переменную окружения:

Linux/macOS (run.sh):

bash
#!/usr/bin/env bash
HERE="$(cd "$(dirname "$0")" && pwd)"
export XDG_CONFIG_HOME="$HERE/config"
export OPENCODE_CONFIG="$HERE/config/opencode.json"
"$HERE/bin/opencode" "$@"
Windows (run.bat):

bat
@echo off
set HERE=%~dp0
set XDG_CONFIG_HOME=%HERE%config
set OPENCODE_CONFIG=%HERE%config\opencode.json
"%HERE%bin\opencode.exe" %*
После этого история чатов, настройки агентов, MCP-серверы — всё остаётся на флешке, а не на хост-машине.

Шаг 3 — GitHub-токен безопасно
Не пишите токен в auth/github_token.txt в открытом виде. Лучше:

Храните токен в менеджере паролей (1Password, KeePassXC, Bitwarden).
Перед запуском OpenCode подставляйте его в env:
bash
export GH_TOKEN=$(pass github/opencode-token)
./run.sh
После работы — unset GH_TOKEN.
Если очень нужно хранить на флешке, зашифруйте том (VeraCrypt / LUKS / BitLocker To Go). Флешку легко потерять.

Шаг 4 — MCP-серверы для GitHub
В config/opencode.json добавьте GitHub MCP:

json
{
  "mcp": {
    "github": {
      "type": "local",
      "command": ["npx", "-y", "@modelcontextprotocol/server-github"],
      "env": { "GITHUB_PERSONAL_ACCESS_TOKEN": "${GH_TOKEN}" }
    }
  }
}
Сам npx требует Node.js на хост-машине — это единственная внешняя зависимость. Если хотите полной автономии, можно скачать server-github как standalone-бинарник и класть на флешку.

Что НЕ переносится на флешке
Локальные модели (Ollama) — модель остаётся на хосте (~/.ollama/models/). Если хотите полностью портативно, кладите ollama + GGUF-файлы на флешку и запускайте так же через env (OLLAMA_MODELS=$HERE/models).
Node.js / npm — если используете MCP-серверы через npx. Решение: portable Node.js на флешку.
Git — должен быть установлен на хосте, но репозиторий можно клонировать прямо на флешку.
Проверка
После настройки на любой машине достаточно:

bash
cd /path/to/repo
/media/your-usb/opencode-portable/run.sh
И OpenCode подхватит свой конфиг, историю, MCP — без следов на хосте (только временные файлы в /tmp, можно вычистить).

Альтернатива — Devbox / Distrobox
Если хочется «всё включено»:

Положите на флешку portable Docker + образ с OpenCode и всем стеком.
Запуск через docker run -v $(pwd):/work ....
Полностью изолированно, но требует Docker на хосте.
