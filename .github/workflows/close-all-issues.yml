name: Close All Open Issues (Turbo)

# Максимально быстрая версия: GraphQL batch mutations с aliases.
# Скорость: ~50-100x быстрее оригинала (1 314 issues ≈ 10-30 секунд).
# Использует GraphQL напрямую через curl, без gh CLI overhead.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/close-all-issues-turbo.yml'

permissions:
  issues: write
  contents: read

concurrency:
  group: close-all-issues-turbo
  cancel-in-progress: false

jobs:
  close-all:
    name: GraphQL batch close
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Fetch all open issue node IDs and close in batches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BATCH: "50"        # issues per GraphQL request (GitHub limit ~100)
          PARALLEL: "4"      # одновременных GraphQL-запросов
        run: |
          set -euo pipefail
          OWNER_REPO=("$REPO")
          OWNER="${OWNER_REPO%%/*}"
          NAME="${OWNER_REPO##*/}"
          echo "==> Repository: $REPO (owner=$OWNER, name=$NAME)"

          # --- Шаг 1. Получаем все node_id открытых issues одним GraphQL-запросом.
          # GraphQL pagination: берём по 100 за страницу, идём до конца.
          : > /tmp/issue_nodes.txt
          END_CURSOR=""

          while true; do
            if [ -z "$END_CURSOR" ]; then
              AFTER="null"
            else
              AFTER="\"$END_CURSOR\""
            fi

            QUERY='query($owner:String!,$name:String!,$after:String){
              repository(owner:$owner,name:$name){
                issues(first:100,after:$after,states:OPEN){
                  pageInfo{endCursor hasNextPage}
                  nodes{number id}
                }
              }
            }'

            RESPONSE=$(jq -n \
              --arg owner "$OWNER" \
              --arg name "$NAME" \
              --argjson after "$AFTER" \
              '{query:$query,variables:{owner:$owner,name:$name,after:$after}}' \
              --arg query "$QUERY" \
              | curl -sS -X POST https://api.github.com/graphql \
                  -H "Authorization: bearer $GH_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @-)

            # Проверка на ошибку.
            if echo "$RESPONSE" | jq -e '.errors' >/dev/null 2>&1; then
              echo "GraphQL error on fetch:"
              echo "$RESPONSE" | jq '.errors'
              exit 1
            fi

            echo "$RESPONSE" | jq -r '.data.repository.issues.nodes[] | "\(.number)\t\(.id)"' >> /tmp/issue_nodes.txt

            HAS_NEXT=$(echo "$RESPONSE" | jq -r '.data.repository.issues.pageInfo.hasNextPage')
            END_CURSOR=$(echo "$RESPONSE" | jq -r '.data.repository.issues.pageInfo.endCursor')

            if [ "$HAS_NEXT" != "true" ]; then break; fi
          done

          TOTAL=$(wc -l < /tmp/issue_nodes.txt | tr -d ' ')
          echo "==> Found $TOTAL open issues with node IDs."

          # --- Шаг 2. Делим список на чанки по $BATCH, генерируем GraphQL-mutation.
          #   В одном запросе закрываем N issues через aliased closeIssue mutations.
          mkdir -p /tmp/batches /tmp/results
          split -l "$BATCH" /tmp/issue_nodes.txt /tmp/batches/chunk_

          BATCH_COUNT=$(ls /tmp/batches/chunk_* | wc -l | tr -d ' ')
          echo "==> Created $BATCH_COUNT batches (batch size=$BATCH)."
          echo "==> Running with concurrency=$PARALLEL..."

          close_batch() {
            local chunk="$1"
            local idx="$2"
            local out="/tmp/results/result_${idx}.json"

            # Строим GraphQL mutation с N aliased closeIssue мутаций.
            local mutations=""
            local i=0
            while IFS=$'\t' read -r number node_id; do
              [ -z "$node_id" ] && continue
              local alias="i${i}"
              # stateReason: COMPLETED  ( GraphQL enum, в верхнем регистре )
              mutations+="${alias}: closeIssue(input:{issueId:\"${node_id}\",stateReason:COMPLETED}){ issue{ number } } "
              i=$((i + 1))
            done < "$chunk"

            local payload
            payload=$(jq -n --arg m "mutation { ${mutations} }" '{query:$m}')

            curl -sS -X POST https://api.github.com/graphql \
              -H "Authorization: bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload" > "$out"

            # Считаем успешные закрытия в ответе.
            local ok_count fail_count
            ok_count=$(jq -r '[.data | to_entries[] | select(.value.issue != null)] | length' "$out" 2>/dev/null || echo 0)
            fail_count=$(jq -r '[.data | to_entries[] | select(.value.issue == null)] | length' "$out" 2>/dev/null || echo 0)

            # Логируем ошибки, если есть.
            if [ "$fail_count" != "0" ]; then
              jq -r '.errors[]? | .message' "$out" 2>/dev/null | head -5
            fi

            echo "$ok_count $fail_count" > "/tmp/results/summary_${idx}.txt"
          }
          export -f close_batch
          export GH_TOKEN

          # Параллельный запуск по батчам. Имя файла чанка = уникальный ключ.
          close_batch_file() {
            local chunk="$1"
            # Имя файла без слэшей используем как уникальный индекс.
            local idx
            idx=$(echo "$chunk" | tr '/.' '__')
            close_batch "$chunk" "$idx"
          }
          export -f close_batch_file
          export -f close_batch

          # Параллельный запуск: каждый чанк получает свой индекс (по имени файла).
          ls /tmp/batches/chunk_* | \
            xargs -P "$PARALLEL" -I {} bash -c 'close_batch_file "{}"'

          # --- Шаг 3. Сводный отчёт.
          CLOSED=0
          FAILED=0
          for s in /tmp/results/summary_*.txt; do
            [ -f "$s" ] || continue
            read -r ok fail < "$s"
            CLOSED=$((CLOSED + ${ok:-0}))
            FAILED=$((FAILED + ${fail:-0}))
          done

          echo ""
          echo "==> Done."
          echo "    Closed: $CLOSED / $TOTAL"
          echo "    Failed: $FAILED"

      - name: Final check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          REMAINING=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --json number \
            --limit 10000 \
            -q 'length')
          echo "==> Remaining open issues: $REMAINING"
            --json number \
            --limit 10000 \
            -q 'length')
          echo "==> Remaining open issues: $REMAINING"
