name: Close All Open Issues

# Workflow закрывает все открытые issues в репозитории со статусом "completed".
# Запускается вручную (workflow_dispatch) или автоматически при пуше в этот файл.
# После выполнения файл можно удалить.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/close-all-issues.yml'

permissions:
  issues: write
  contents: read

concurrency:
  group: close-all-issues
  cancel-in-progress: false

jobs:
  close-all:
    name: Close every open issue as completed
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: List and close all open issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "==> Repository: $REPO"
          echo "==> Fetching list of open issues (paginated, up to 10000)..."

          # Получаем номера всех открытых issues.
          ISSUE_NUMBERS=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --json number \
            --limit 10000 \
            -q '.[].number' | sort -n)

          TOTAL=$(echo "$ISSUE_NUMBERS" | wc -l | tr -d ' ')
          echo "==> Found $TOTAL open issues. Starting closure..."

          CLOSED=0
          FAILED=0

          for n in $ISSUE_NUMBERS; do
            if gh issue close "$n" --repo "$REPO" --reason completed 2>/dev/null; then
              CLOSED=$((CLOSED + 1))
              if (( CLOSED % 50 == 0 )); then
                echo "    ... closed $CLOSED issues so far"
              fi
            else
              FAILED=$((FAILED + 1))
              echo "    ! failed to close #$n"
            fi
          done

          echo ""
          echo "==> Done."
          echo "    Closed: $CLOSED"
          echo "    Failed: $FAILED"
          echo "    Total processed: $TOTAL"

      - name: Final check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          REMAINING=$(gh issue list \
            --repo "$REPO" \
            --state open \
            --json number \
            --limit 10000 \
            -q 'length')
          echo "==> Remaining open issues: $REMAINING"
