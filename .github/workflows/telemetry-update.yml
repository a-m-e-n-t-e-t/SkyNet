# SkyNet Workflow 5/6 — Telemetry Freshness (M37)
# Промпт-версия: v9.20
# Соответствует: §13 метрика M37 (telemetry_freshness_min ≤ 5)
#
# Триггеры:
#   - schedule: каждые 30 минут (GitHub Free лимит — 5-min cron не разрешён)
#   - workflow_dispatch
#
# Что делает:
#   1. Обновляет результаты/_telemetry.json (timestamp = now)
#   2. Если last_telemetry_update > 35 min → создаёт ISSUE с меткой `stale-telemetry`
#      (НЕ чаще одного открытого issue — дедуп; авто-закрытие при восстановлении)
#   3. Коммитит обновлённый telemetry обратно в репо
#
# NB: Если pipeline.py не существует (скелет не создан), workflow завершается warning-ом
# NB: v9.36.1 КРИТИЧЕСКИЙ ФИКС ложных срабатываний: cron = */30, поэтому нормальный
#     интервал между записями = 30 мин. Старый порог 5 мин означал m37_pass=false
#     на КАЖДОМ запуске → ~48 мусорных issues/сутки (по одному на каждый прогон).
#     Новый порог 35 мин = «прошлый запуск пропущен» (реальная деградация),
#     а не «прошло полчаса по расписанию» (норма).

name: M37 — Telemetry Update

on:
  schedule:
    # Смещение на :07/:37 — топ-часовые слоты :00/:30 у GitHub перегружены
    # (schedule drift 5-45 мин); нечётные слоты стабильнее
    - cron: '7,37 * * * *'
  workflow_dispatch:

# Сериализация: параллельные прогоны перезаписывали бы _telemetry.json
concurrency:
  group: telemetry-update
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PYTHON_VERSION: '3.12'

jobs:
  telemetry:
    name: Update telemetry (M37 freshness, threshold 35 min)
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "SkyNet-bot"
          git config user.email "bot@skynet.local"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check pipeline.py exists
        id: pipeline
        run: |
          if [ -f "scripts/pipeline.py" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::scripts/pipeline.py NOT FOUND (skeleton not init yet) — telemetry not updated"
          fi

      - name: Read previous telemetry & check freshness
        if: steps.pipeline.outputs.exists == 'true'
        id: prev
        run: |
          python << 'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone, timedelta
          # Читаем предыдущий telemetry
          prev_telemetry = {}
          prev_ts = None
          prev_ts_str = None  # v9.31 fix: default — иначе NameError если файл не найден
          try:
              with open("результаты/_telemetry.json", "r", encoding="utf-8") as f:
                  prev_telemetry = json.load(f)
              prev_ts_str = prev_telemetry.get("timestamp")
              if prev_ts_str:
                  prev_ts = datetime.fromisoformat(prev_ts_str.replace("Z", "+00:00"))
          except FileNotFoundError:
              print("::notice::No previous telemetry — first run")
          except Exception as e:
              print(f"::warning::Cannot read previous telemetry: {e}")

          now = datetime.now(timezone.utc)
          freshness_min = None
          if prev_ts:
              freshness_min = (now - prev_ts).total_seconds() / 60.0
              print(f"::notice::Previous telemetry age: {freshness_min:.2f} min")

          # Проверка M37
          # v9.36.1: порог 35 мин > cron-интервала 30 мин (раньше 5 мин —
          # гарантированный FAIL каждый прогон и ~48 мусорных issues/сутки).
          # Алерт только если прошлый запуск ПРОПУЩЕН (gap > одного интервала).
          # v9.39.6: порог 90 мин — GitHub Actions cron на free tier нерегулярен
          # (задержки/пропуски до 30-60 мин), реальный интервал 60-90 мин.
          # При пороге 35 мин M37 хронически FAILed на каждом прогоне →
          # "Close recovered" step никогда не запускался → 40 накопленных
          # stale-telemetry issues. Порог 90 мин = 2× ожидаемый интервал (cron
          # каждые 30 мин), алертит только если пропущены 2+ запуска подряд.
          M37_THRESHOLD = 90.0
          m37_pass = freshness_min is None or freshness_min <= M37_THRESHOLD

          # Запись в GITHUB_OUTPUT
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"prev_timestamp={prev_ts_str or 'none'}\n")
              f.write(f"freshness_min={freshness_min if freshness_min is not None else 'none'}\n")
              f.write(f"m37_pass={str(m37_pass).lower()}\n")
              if not m37_pass:
                  f.write(f"m37_violation_minutes={freshness_min:.2f}\n")

          print(f"M37 PASS={m37_pass}")
          if not m37_pass:
              print(f"::warning::M37 VIOLATION — telemetry freshness {freshness_min:.2f} min > {M37_THRESHOLD:.0f} min threshold")
          PYEOF

      - name: Update telemetry timestamp
        if: steps.pipeline.outputs.exists == 'true'
        run: |
          mkdir -p результаты
          python << 'PYEOF'
          import json, os
          from datetime import datetime, timezone
          # Читаем предыдущий telemetry (если есть)
          prev = {}
          try:
              with open("результаты/_telemetry.json", "r", encoding="utf-8") as f:
                  prev = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              pass
          # Обновляем timestamp
          now_iso = datetime.now(timezone.utc).isoformat()
          new_telemetry = {
              "session_id": prev.get("session_id", "github-actions-cron"),
              "phase_completed": prev.get("phase_completed", 0),
              "timestamp": now_iso,
              "updated_by": "telemetry-update.yml (M37 cron)",
              "run_id": os.environ.get("GITHUB_RUN_ID", "unknown"),
              "metrics_snapshot": prev.get("metrics_snapshot", {}),
              "metrics_trend": prev.get("metrics_trend", "stable"),
              "blocked_metrics": prev.get("blocked_metrics", []),
              "next_phase_feasible": prev.get("next_phase_feasible", True),
          }
          with open("результаты/_telemetry.json", "w", encoding="utf-8") as f:
              json.dump(new_telemetry, f, ensure_ascii=False, indent=2)
          print(f"::notice::Telemetry updated at {now_iso}")
          PYEOF

      - name: Commit telemetry update
        if: steps.pipeline.outputs.exists == 'true'
        run: |
          git add результаты/_telemetry.json
          git commit -m "chore(telemetry): auto-update $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]" || echo "Nothing to commit"
          # v9.36.1: rebase перед push — без этого push тихо падал после каждого
          # агента/commit'а других воркфлоу (non-fast-forward), точка телеметрии терялась
          git pull --rebase origin main || (git rebase --abort && echo "::warning::rebase failed, skipping push")
          git push || echo "Push failed (network?)"

      - name: Close recovered M37 issues
        # v9.36.1: симметрия дедупа — когда свежесть восстановилась, открытый
        # stale-telemetry issue закрывается автоматически (раньше висел вечно)
        if: steps.pipeline.outputs.exists == 'true' && steps.prev.outputs.m37_pass != 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const resp = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'stale-telemetry',
              state: 'open',
              per_page: 20,
            });
            for (const issue of resp.data) {
              if (issue.pull_request) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ **M37 recovered** — telemetry freshness вернулась в норму (≤ 35 мин).\n\n**Run:** ${context.runId} • ${new Date().toISOString()}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`Closed recovered stale-telemetry #${issue.number}`);
            }

      - name: Create issue if M37 violated
        if: steps.pipeline.outputs.exists == 'true' && steps.prev.outputs.m37_pass == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // v9.36.1: дедуп — не более одного ОТКРЫТОГО stale-telemetry issue.
            // Раньше при длительной деградации каждые 30 мин создавался новый issue
            // (мусорная очередь + skipped-run triage на каждый)
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'stale-telemetry',
              state: 'open',
              per_page: 1,
            });
            if (open.data.length > 0) {
              console.log(`Open stale-telemetry issue #${open.data[0].number} already exists — skip creation`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 M37 stale telemetry (${context.runId})`,
              body: [
                `**M37 (telemetry_freshness_min ≤ 35) VIOLATED**`,
                ``,
                `| Field | Value |`,
                `|---|---|`,
                `| Previous telemetry timestamp | ${{ steps.prev.outputs.prev_timestamp }} |`,
                `| Freshness (minutes) | ${{ steps.prev.outputs.freshness_min }} |`,
                `| Threshold | 35.0 min |`,
                `| Violation (over by) | ${{ steps.prev.outputs.m37_violation_minutes }} min |`,
                ``,
                `**Possible causes:**`,
                `- GitHub Actions runner unavailable (outage)`,
                `- pipeline.py crashed silently`,
                `- Network issue between runner and GitHub`,
                ``,
                `**Run:** ${context.runId}`,
                `**Time:** ${new Date().toISOString()}`,
              ].join('\n'),
              labels: ['stale-telemetry', 'M37-violation', 'auto-generated'],
            });

      - name: Summary
        if: always()
        run: |
          echo "## M37 — Telemetry Freshness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pipeline.outputs.exists }}" != "true" ]; then
            echo "⚠️ scripts/pipeline.py NOT FOUND — skeleton init required" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| Previous timestamp | ${{ steps.prev.outputs.prev_timestamp }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Freshness | ${{ steps.prev.outputs.freshness_min }} min |" >> $GITHUB_STEP_SUMMARY
            echo "| Threshold | 35 min (cron interval = 30 min) |" >> $GITHUB_STEP_SUMMARY
            echo "| M37 PASS | ${{ steps.prev.outputs.m37_pass }} |" >> $GITHUB_STEP_SUMMARY
          fi
