name: Сводные списки — автогенерация

# Акционизирует конвейер материалов и списков: при изменении карточек базы
# знаний (пуш в main) или вручную (workflow_dispatch) сначала sync_materials.py
# создаёт пустые шаблоны материалов, на которые ссылаются изделия, технологии
# и альтернативы материалов, но карточек ещё нет; затем generate_lists.py
# перегенерирует все 14 сводных списков и коммитит их в ту же ветку — списки
# всегда синхронны с карточками (§15a.2), локальный запуск скриптов не требуется.
# Push от GITHUB_TOKEN не запускает воркфлоу повторно (ограничение GitHub) —
# циклов нет; маркер [skip ci] добавлен как дополнительная страховка.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'реальные данные/**'
      - 'фантастические данные/**'
      - 'работа и и/**'
      - 'результаты/**'
      - '.github/workflows/update-lists.yml'

permissions:
  contents: write

# Не отменять идущий прогон: коммиты должны ложиться строго по порядку.
concurrency:
  group: update-lists
  cancel-in-progress: false

jobs:
  regenerate:
    name: generate_lists.py + коммит
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12 + кэш pip
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Установка зависимостей
        run: pip install --requirement scripts/requirements.txt

      - name: Синхронизация материалов (ссылки изделий/технологий/альтернатив → пустые шаблоны)
        run: python3 scripts/sync_materials.py

      - name: Генерация 14 сводных списков
        run: python3 scripts/generate_lists.py

      - name: Коммит и push (если есть изменения)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # git add до проверки: первый запуск создаёт списки как новые файлы
          git add -A
          if git diff --cached --quiet; then
            echo "Списки актуальны — коммит не нужен."
            exit 0
          fi

          echo "::group::Изменения списков"
          git diff --cached --stat
          echo "::endgroup::"

          git commit -m "chore(материалы,списки): синхронизация ссылок на материалы + автогенерация сводных списков [skip ci]"

          # push с одним ретраем через rebase (на случай гонки с прямым пушем)
          if ! git push; then
            echo "::warning::push отклонён — подтягиваю изменения и повторяю"
            git pull --rebase --autostash
            git push
          fi
