# SkyNet Workflow 4/6 — GitHub Sync Verification (F47)
# Промпт-версия: v9.20
# Соответствует: §13 метрика F47 (синхронизация_github), §9 Phase 8
#
# Триггеры:
#   - push на любую ветку (после push-а проверяем что local == remote)
#   - workflow_dispatch
#
# Что делает:
#   1. Сравнивает локальный HEAD с origin/<branch>
#   2. Если DE-sync → создаёт ISSUE с меткой `desync`
#   3. Проверяет что git status clean (нет uncommitted changes)
#   4. Отчёт в результаты/_sync_status.json

name: F47 — GitHub Sync Verification

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: sync-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  sync-check:
    name: Verify local ↔ remote sync (F47)
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout SkyNet
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # вся история

      - name: Configure git
        run: |
          git config user.name "SkyNet-bot"
          git config user.email "bot@skynet.local"

      - name: Compare local vs remote HEAD
        id: sync
        run: |
          set +e
          # Fetch latest from origin
          git fetch origin --prune --tags 2>&1
          BRANCH=$(echo "${{ github.ref }}" | sed 's|refs/heads/||')
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse origin/$BRANCH 2>/dev/null || echo "MISSING")

          echo "local=$LOCAL" >> $GITHUB_OUTPUT
          echo "remote=$REMOTE" >> $GITHUB_OUTPUT

          # Проверка clean git status
          GIT_STATUS=$(git status --porcelain)
          if [ -z "$GIT_STATUS" ]; then
            CLEAN=true
          else
            CLEAN=false
          fi
          echo "clean_status=$CLEAN" >> $GITHUB_OUTPUT

          # Sync check
          if [ "$LOCAL" = "$REMOTE" ] && [ "$CLEAN" = "true" ]; then
            SYNCED=true
          else
            SYNCED=false
          fi
          echo "synced=$SYNCED" >> $GITHUB_OUTPUT

          echo "::notice::Branch=$BRANCH, local=$LOCAL, remote=$REMOTE, clean=$CLEAN, synced=$SYNCED"

          # Метрика F47
          if [ "$SYNCED" = "true" ]; then
            echo "F47=1.0 (PASS)" >> $GITHUB_STEP_SUMMARY
            echo "f47_value=1.0" >> $GITHUB_OUTPUT
          else
            echo "F47=0.0 (FAIL)" >> $GITHUB_STEP_SUMMARY
            echo "f47_value=0.0" >> $GITHUB_OUTPUT
            echo "::error::F47 FAIL — desync detected"
          fi

      - name: Save sync status JSON
        if: always()
        run: |
          mkdir -p результаты
          cat > результаты/_sync_status.json << EOF
          {
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "branch": "${{ steps.sync.outputs.branch }}",
            "local_sha": "${{ steps.sync.outputs.local }}",
            "remote_sha": "${{ steps.sync.outputs.remote }}",
            "git_status_clean": ${{ steps.sync.outputs.clean_status }},
            "synced": ${{ steps.sync.outputs.synced }},
            "F47_value": ${{ steps.sync.outputs.f47_value }},
            "threshold": 1.0,
            "passed": ${{ steps.sync.outputs.synced }}
          }
          EOF
          cat результаты/_sync_status.json

      - name: Create issue on desync
        if: steps.sync.outputs.synced == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔴 F47 Desync detected on ${'${{ steps.sync.outputs.branch }}'}`,
              body: [
                `**F47 (синхронизация_github) FAILED**`,
                ``,
                `| Field | Value |`,
                `|---|---|`,
                `| Branch | ${{ steps.sync.outputs.branch }} |`,
                `| Local SHA | ${{ steps.sync.outputs.local }} |`,
                `| Remote SHA | ${{ steps.sync.outputs.remote }} |`,
                `| Git status clean | ${{ steps.sync.outputs.clean_status }} |`,
                `| F47 value | ${{ steps.sync.outputs.f47_value }} |`,
                `| Threshold | 1.0 |`,
                ``,
                `**Triggered by:** ${{ github.event_name }} by ${{ github.actor }}`,
                `**Run:** ${context.runId}`,
                ``,
                `### Required action:`,
                `1. If git status NOT clean → run \`git status\` locally and commit pending changes`,
                `2. If local != remote → run \`git pull --rebase\` then \`git push --force-with-lease\``,
                `3. Verify P041 транзакционная синхронизация is enforced`,
              ].join('\n'),
              labels: ['desync', 'F47-failed', 'auto-generated'],
            });

      - name: Fail job if desync
        if: steps.sync.outputs.synced == 'false'
        run: |
          echo "::error::F47 desync — local ${{ steps.sync.outputs.local }} != remote ${{ steps.sync.outputs.remote }}"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## F47 — GitHub Sync Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ steps.sync.outputs.branch }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Local SHA | ${{ steps.sync.outputs.local }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Remote SHA | ${{ steps.sync.outputs.remote }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Git status clean | ${{ steps.sync.outputs.clean_status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Synced (F47=1.0) | ${{ steps.sync.outputs.synced }} |" >> $GITHUB_STEP_SUMMARY
